apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: kairoecsexperiments.kairo.ecs
spec:
  group: kairo.ecs
  names:
    kind: KairoECSExperiment
    listKind: KairoECSExperimentList
    plural: kairoecsexperiments
    singular: kairoecsexperiment
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [image, scenarioRef, storage]
              properties:
                scenarioRef:
                  type: object
                  properties:
                    configMapName: { type: string }
                    key: { type: string, default: scenario.yaml }
                    inline: { type: string }
                parallelism:
                  type: integer
                  minimum: 1
                  default: 1
                image:
                  type: string
                imagePullPolicy:
                  type: string
                  enum: [Always, IfNotPresent, Never]
                  default: IfNotPresent
                storage:
                  type: object
                  required: [backend, path]
                  properties:
                    backend:
                      type: string
                      enum: [s3, gcs, azure, filesystem]
                    path:
                      type: string
                resources:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                checkpoint:
                  type: object
                  properties:
                    enabled: { type: boolean, default: true }
                    interval: { type: string, default: 5m }
            status:
              type: object
              properties:
                phase: { type: string }
                completedRuns: { type: integer }
                failedRuns: { type: integer }
                lastCheckpointTime: { type: string }
                message: { type: string }
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Completed
          type: integer
          jsonPath: .status.completedRuns
        - name: Failed
          type: integer
          jsonPath: .status.failedRuns
