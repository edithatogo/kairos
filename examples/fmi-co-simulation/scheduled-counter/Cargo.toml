[package]
name = "kairo-fmi-scheduled-counter"
version = "0.1.0"
edition = "2021"
rust-version = "1.99"
license = "Apache-2.0"
publish = false

[workspace]

[lib]
name = "kairo_ecs_model"
crate-type = ["cdylib", "rlib"]

[dependencies]
kairo-ecs-core = { path = "../../../crates/kairo-ecs-core" }
kairo-ecs-fmi = { path = "../../../crates/kairo-ecs-fmi", features = ["fmi2"] }
kairo-ecs-types = { path = "../../../crates/kairo-ecs-types" }
