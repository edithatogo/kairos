[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "kairo-ecs"
version = "0.1.0"
requires-python = ">=3.15.2,<3.16"
dependencies = ["pyarrow"]
classifiers = [
  "Programming Language :: Python :: 3.15",
]

[tool.maturin]
features = ["pyo3/extension-module", "pyo3/abi3-py315"]
