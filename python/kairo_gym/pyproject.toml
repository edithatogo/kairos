[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kairo-gym"
version = "0.1.0"
description = "Optional Gymnasium and PettingZoo adapters for a Rust-owned KairoECS queue"
requires-python = ">=3.15.2,<3.16"
license = "Apache-2.0"
license-files = ["LICENSE-APACHE"]
dependencies = []

[project.optional-dependencies]
gymnasium = ["gymnasium>=1.4.0,<2"]
pettingzoo = ["pettingzoo>=1.24.3,<2"]
