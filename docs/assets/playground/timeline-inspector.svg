<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">Event timeline inspector</title>
  <desc id="desc">A conceptual timeline figure showing deterministic ticks, selected events, and a details panel for playground event inspection.</desc>
  <metadata>
    Source: generated vector asset for KairoECS documentation. Scope: conceptual playground figure, not a runtime screenshot.
  </metadata>
  <rect width="960" height="420" fill="#fbfcfe"/>
  <rect x="54" y="48" width="852" height="324" rx="14" fill="#ffffff" stroke="#223047" stroke-width="3"/>
  <text x="86" y="92" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#223047">Event timeline</text>
  <text x="86" y="122" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#536076">Inspect ordered events without claiming live runtime execution.</text>
  <line x1="100" y1="214" x2="630" y2="214" stroke="#2c6fbb" stroke-width="6"/>
