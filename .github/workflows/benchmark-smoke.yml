name: Benchmark Smoke

on:
  pull_request:
    paths:
      - 'crates/**'
      - 'benches/**'
      - 'conformance/fixtures/**'
      - 'conductor/tracks/18-*/**'
      - 'conductor/tracks/12-conformance-testing-benchmarks/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Benchmark smoke
        run: |
          test -f Cargo.toml
          test -d benches
          python benches/benchmark_smoke.py
          cargo check -p kairo-ecs-bench
