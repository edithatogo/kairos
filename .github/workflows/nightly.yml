name: nightly

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  schedule:
    - cron: '17 3 * * *'
    - cron: '47 3 * * 0'
  workflow_dispatch:
    inputs:
      suite:
        description: Checks to run manually
        type: choice
        options:
          - heavy
          - mutation
          - both
        default: heavy
        required: true

permissions:
  contents: read

jobs:
  mutation:
    name: core mutation score
    if: >-
      github.event.schedule == '47 3 * * 0' ||
      (github.event_name == 'workflow_dispatch' &&
      (inputs.suite == 'mutation' || inputs.suite == 'both'))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust 1.99.1
        run: rustup toolchain install 1.99.1 --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install cargo-mutants
        run: cargo +1.99.1 install cargo-mutants --version 27.1.0 --locked
      - name: Mutate the Rust scheduler core
        run: cargo +1.99.1 mutants --package kairo-ecs-core --jobs 2 --timeout-multiplier 3
      - name: Preserve mutation results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cargo-mutants-outcomes
          path: mutants.out
          if-no-files-found: warn
          retention-days: 30

  heavy-rust-checks:
    name: Rust 1.99.1 benchmarks (Miri UNVERIFIED)
    if: >-
      github.event.schedule == '17 3 * * *' ||
      (github.event_name == 'workflow_dispatch' &&
      (inputs.suite == 'heavy' || inputs.suite == 'both'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust 1.99.1
        run: rustup toolchain install 1.99.1 --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Run ordinary Rust 1.99.1 benchmarks
        run: |
          test -f Cargo.toml
          cargo +1.99.1 bench --workspace
      - name: Report Miri analysis as unverified
        if: always()
        run: |
          {
            echo '## Miri analysis: UNVERIFIED'
            echo 'Miri was not run: the Rust nightly toolchain is disallowed by the sole Rust 1.99.1 policy.'
            echo 'Outstanding obligation: reassess Miri only under a future reviewed toolchain policy; no Miri result is claimed here.'
          } >> "$GITHUB_STEP_SUMMARY"
