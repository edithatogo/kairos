name: Release Attestations

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      artifact_path:
        description: Path to the release artifacts to attest
        required: true
        default: dist

permissions:
  contents: read

jobs:
  attest:
    name: release-attestation
    permissions:
      contents: read
      id-token: write # Needed to sign release attestations with OIDC.
      attestations: write # Needed to publish artifact attestations.
    runs-on: ubuntu-latest
    env:
      ARTIFACT_PATH: ${{ github.event.inputs.artifact_path || 'dist' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Verify release artifacts exist
        run: |
          test -d "${ARTIFACT_PATH}"
          test -f "${ARTIFACT_PATH}/release-artifact-manifest.json"
          test -f "${ARTIFACT_PATH}/SHA256SUMS"
      - name: Install Syft
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
      - name: Generate SBOM
        run: syft "dir:${ARTIFACT_PATH}" -o "spdx-json=${ARTIFACT_PATH}/sbom.spdx.json"
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-sbom-spdx
          path: ${{ env.ARTIFACT_PATH }}/sbom.spdx.json
      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ env.ARTIFACT_PATH }}
          sbom-path: ${{ env.ARTIFACT_PATH }}/sbom.spdx.json
