name: Release Attestations

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      artifact_path:
        description: Path to the release artifacts to attest
        required: true
        default: dist

permissions:
  contents: read

jobs:
  attest:
    permissions:
      contents: read
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    env:
      ARTIFACT_PATH: ${{ github.event.inputs.artifact_path || 'dist' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Verify release artifacts exist
        run: |
          test -d "${ARTIFACT_PATH}"
          test -f "${ARTIFACT_PATH}/release-artifact-manifest.json"
          test -f "${ARTIFACT_PATH}/SHA256SUMS"
      - name: Install Syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610
      - name: Generate SBOM
        run: syft "dir:${ARTIFACT_PATH}" -o "spdx-json=${ARTIFACT_PATH}/sbom.spdx.json"
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-sbom-spdx
          path: ${{ env.ARTIFACT_PATH }}/sbom.spdx.json
      - name: Attest SBOM
        uses: actions/attest@281a49d4cbb0a72c9575a50d18f6deb515a11deb
        with:
          subject-path: ${{ env.ARTIFACT_PATH }}
          sbom-path: ${{ env.ARTIFACT_PATH }}/sbom.spdx.json
