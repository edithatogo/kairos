name: Toolchain Check

on:
  pull_request:
    paths:
      - "conductor/toolchain-matrix.md"
      - "conductor/quality-gates.md"
      - "conductor/tracks/30-toolchain-version-support-matrix/**"
      - ".github/workflows/toolchain-check.yml"
      - "rust-toolchain.toml"
      - "Cargo.toml"
      - "mise.toml"
      - "bindings/python/pyproject.toml"
      - "bindings/r/DESCRIPTION"
      - "bindings/julia/Project.toml"
      - "bindings/typescript/package.json"
      - "bindings/csharp/global.json"
      - "bindings/csharp/src/Kairo.ECS/Kairo.ECS.csproj"
      - "bindings/go/go.mod"
  push:
    branches:
      - main
    paths:
      - "conductor/toolchain-matrix.md"
      - "conductor/quality-gates.md"
      - "conductor/tracks/30-toolchain-version-support-matrix/**"
      - ".github/workflows/toolchain-check.yml"
      - "rust-toolchain.toml"
      - "Cargo.toml"
      - "mise.toml"
      - "bindings/python/pyproject.toml"
      - "bindings/r/DESCRIPTION"
      - "bindings/julia/Project.toml"
      - "bindings/typescript/package.json"
      - "bindings/csharp/global.json"
      - "bindings/csharp/src/Kairo.ECS/Kairo.ECS.csproj"
      - "bindings/go/go.mod"
  workflow_dispatch:

jobs:
  static-policy:
    name: Static matrix and gate policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate matrix document, gate rows, and workflow triggers
        shell: pwsh
        run: pwsh -NoProfile -File conductor/tracks/30-toolchain-version-support-matrix/validate-toolchain-matrix.ps1

  rust:
    name: Rust ${{ matrix.channel }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - channel: stable
            expected-prefix: "1.95"
          - channel: beta
            expected-prefix: "1.96"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.channel }}
          components: rustfmt,clippy
      - name: Validate installed Rust channel
        shell: pwsh
        run: pwsh -NoProfile -File conductor/tracks/30-toolchain-version-support-matrix/validate-toolchain-matrix.ps1 -CheckInstalled -Ecosystem rust -ExpectedPrefix '${{ matrix.expected-prefix }}'

  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate installed Python
        shell: pwsh
        run: pwsh -NoProfile -File conductor/tracks/30-toolchain-version-support-matrix/validate-toolchain-matrix.ps1 -CheckInstalled -Ecosystem python -ExpectedPrefix '${{ matrix.python-version }}'

  r:
    name: R ${{ matrix.r-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - r-version: oldrel-1
            expected-prefix: "4.5"
          - r-version: release
            expected-prefix: "4.6"
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r-version }}
      - name: Validate installed R
        shell: pwsh
        run: pwsh -NoProfile -File conductor/tracks/30-toolchain-version-support-matrix/validate-toolchain-matrix.ps1 -CheckInstalled -Ecosystem r -ExpectedPrefix '${{ matrix.expected-prefix }}'

  julia:
    name: Julia ${{ matrix.julia-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        julia-version: ["1.10", "1.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}
      - name: Validate installed Julia
        shell: pwsh
        run: pwsh -NoProfile -File conductor/tracks/30-toolchain-version-support-matrix/validate-toolchain-matrix.ps1 -CheckInstalled -Ecosystem julia -ExpectedPrefix '${{ matrix.julia-version }}'

  node:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Validate installed Node
        shell: pwsh
        run: pwsh -NoProfile -File conductor/tracks/30-toolchain-version-support-matrix/validate-toolchain-matrix.ps1 -CheckInstalled -Ecosystem node -ExpectedPrefix '${{ matrix.node-version }}'

  dotnet:
    name: .NET ${{ matrix.dotnet-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dotnet-version: "10.0.x"
            expected-prefix: "10.0"
            quality: "ga"
          - dotnet-version: "11.0.x"
            expected-prefix: "11.0"
            quality: "preview"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet-version }}
          dotnet-quality: ${{ matrix.quality }}
      - name: Validate installed .NET
        shell: pwsh
        run: pwsh -NoProfile -File conductor/tracks/30-toolchain-version-support-matrix/validate-toolchain-matrix.ps1 -CheckInstalled -Ecosystem dotnet -ExpectedPrefix '${{ matrix.expected-prefix }}'

  go:
    name: Go ${{ matrix.go-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - go-version: "1.25.x"
            expected-prefix: "1.25"
          - go-version: "1.26.x"
            expected-prefix: "1.26"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
      - name: Validate installed Go
        shell: pwsh
        run: pwsh -NoProfile -File conductor/tracks/30-toolchain-version-support-matrix/validate-toolchain-matrix.ps1 -CheckInstalled -Ecosystem go -ExpectedPrefix '${{ matrix.expected-prefix }}'
