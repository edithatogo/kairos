name: Toolchain Check

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  pull_request:
    paths:
      - "conductor/toolchain-matrix.md"
      - "conductor/quality-gates.md"
      - "conductor/tracks/30-toolchain-version-support-matrix/**"
      - ".github/workflows/toolchain-check.yml"
      - "rust-toolchain.toml"
      - "Cargo.toml"
      - "mise.toml"
      - "bindings/python/pyproject.toml"
      - "bindings/r/DESCRIPTION"
      - "bindings/julia/Project.toml"
      - "bindings/typescript/package.json"
      - "bindings/csharp/global.json"
      - "bindings/csharp/src/Kairo.ECS/Kairo.ECS.csproj"
      - "bindings/go/go.mod"
  push:
    branches:
      - main
    paths:
      - "conductor/toolchain-matrix.md"
      - "conductor/quality-gates.md"
      - "conductor/tracks/30-toolchain-version-support-matrix/**"
      - ".github/workflows/toolchain-check.yml"
      - "rust-toolchain.toml"
      - "Cargo.toml"
      - "mise.toml"
      - "bindings/python/pyproject.toml"
      - "bindings/r/DESCRIPTION"
      - "bindings/julia/Project.toml"
      - "bindings/typescript/package.json"
      - "bindings/csharp/global.json"
      - "bindings/csharp/src/Kairo.ECS/Kairo.ECS.csproj"
      - "bindings/go/go.mod"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-policy:
    name: Static matrix and gate policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Validate matrix document, gate rows, and workflow triggers
        shell: pwsh
        run: pwsh -NoProfile -File conductor/tracks/30-toolchain-version-support-matrix/validate-toolchain-matrix.ps1

  rust:
    name: Rust ${{ matrix.channel }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - channel: stable
            expected-prefix: "1.96"
          - channel: beta
            expected-prefix: "1."
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install Rust ${{ matrix.channel }}
        env:
          CHANNEL: ${{ matrix.channel }}
        run: |
          rustup toolchain install "$CHANNEL" --profile minimal --component rustfmt --component clippy
          rustup override set "$CHANNEL"
      - name: Validate installed Rust channel
        shell: pwsh
        env:
          EXPECTED_PREFIX: ${{ matrix.expected-prefix }}
        run: pwsh -NoProfile -File conductor/tracks/30-toolchain-version-support-matrix/validate-toolchain-matrix.ps1 -CheckInstalled -Ecosystem rust -ExpectedPrefix $env:EXPECTED_PREFIX

  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate installed Python
        shell: pwsh
        env:
          EXPECTED_PREFIX: ${{ matrix.python-version }}
        run: pwsh -NoProfile -File conductor/tracks/30-toolchain-version-support-matrix/validate-toolchain-matrix.ps1 -CheckInstalled -Ecosystem python -ExpectedPrefix $env:EXPECTED_PREFIX

  r:
    name: R ${{ matrix.r-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - r-version: oldrel-1
            expected-prefix: "4.5"
          - r-version: release
            expected-prefix: "4.6"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: r-lib/actions/setup-r@a51a8012b0aab7c32ef9d19bf54da93f3254335e # v2.12.0
        with:
          r-version: ${{ matrix.r-version }}
      - name: Validate installed R
        shell: pwsh
        env:
          EXPECTED_PREFIX: ${{ matrix.expected-prefix }}
        run: pwsh -NoProfile -File conductor/tracks/30-toolchain-version-support-matrix/validate-toolchain-matrix.ps1 -CheckInstalled -Ecosystem r -ExpectedPrefix $env:EXPECTED_PREFIX

  julia:
    name: Julia ${{ matrix.julia-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        julia-version: ["1.10", "1.12"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@f6f565d9f7cf12f53dc8045742460d6260ad3b39 # v3.0.1
        with:
          version: ${{ matrix.julia-version }}
      - name: Validate installed Julia
        shell: pwsh
        env:
          EXPECTED_PREFIX: ${{ matrix.julia-version }}
        run: pwsh -NoProfile -File conductor/tracks/30-toolchain-version-support-matrix/validate-toolchain-matrix.ps1 -CheckInstalled -Ecosystem julia -ExpectedPrefix $env:EXPECTED_PREFIX

  node:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}
      - name: Validate installed Node
        shell: pwsh
        env:
          EXPECTED_PREFIX: ${{ matrix.node-version }}
        run: pwsh -NoProfile -File conductor/tracks/30-toolchain-version-support-matrix/validate-toolchain-matrix.ps1 -CheckInstalled -Ecosystem node -ExpectedPrefix $env:EXPECTED_PREFIX

  dotnet:
    name: .NET ${{ matrix.dotnet-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dotnet-version: "10.0.x"
            expected-prefix: "10.0"
            quality: "ga"
          - dotnet-version: "11.0.x"
            expected-prefix: "11.0"
            quality: "preview"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: ${{ matrix.dotnet-version }}
          dotnet-quality: ${{ matrix.quality }}
      - name: Validate installed .NET
        shell: pwsh
        env:
          EXPECTED_PREFIX: ${{ matrix.expected-prefix }}
        run: pwsh -NoProfile -File conductor/tracks/30-toolchain-version-support-matrix/validate-toolchain-matrix.ps1 -CheckInstalled -Ecosystem dotnet -ExpectedPrefix $env:EXPECTED_PREFIX

  go:
    name: Go ${{ matrix.go-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - go-version: "1.25.x"
            expected-prefix: "1.25"
          - go-version: "1.26.x"
            expected-prefix: "1.26"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ matrix.go-version }}
      - name: Validate installed Go
        shell: pwsh
        env:
          EXPECTED_PREFIX: ${{ matrix.expected-prefix }}
        run: pwsh -NoProfile -File conductor/tracks/30-toolchain-version-support-matrix/validate-toolchain-matrix.ps1 -CheckInstalled -Ecosystem go -ExpectedPrefix $env:EXPECTED_PREFIX
