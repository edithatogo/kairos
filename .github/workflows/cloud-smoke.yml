name: Cloud/HPC Smoke

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  pull_request:
    paths:
      - "docker/**"
      - "k8s/**"
      - "cloud/**"
      - "hpc/**"
      - "docs/cloud-hpc/**"
      - "website/time-travel-demo/**"
      - ".github/workflows/cloud-smoke.yml"
  push:
    branches: [main]
    paths:
      - "docker/**"
      - "k8s/**"
      - "cloud/**"
      - "hpc/**"
      - "docs/cloud-hpc/**"
      - "website/time-travel-demo/**"
      - ".github/workflows/cloud-smoke.yml"

permissions:
  contents: read

jobs:
  offline-cloud-hpc-smoke:
    name: offline-cloud-hpc-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14.7"

      - name: Validate cloud and HPC manifests
        run: python cloud/validate_cloud_hpc.py

      - name: Render Kubernetes job from sample experiment
        run: python k8s/operator/kairoecs_operator.py --experiment k8s/samples/experiment.json --output /tmp/kairo-job.json

      - name: Syntax-check Python helpers
        run: python -m py_compile cloud/validate_cloud_hpc.py k8s/operator/kairoecs_operator.py docker/telemetry-plugin/cloud-output.py

      - name: Syntax-check shell entrypoints
        run: |
          bash -n docker/entrypoint.sh
          bash -n hpc/slurm/submit-experiment.sh
          bash -n hpc/slurm/submit-sweep.sh
          bash -n hpc/slurm/resume.sh

      - name: Telemetry plugin checksum smoke
        run: |
          mkdir -p /tmp/kairo-input /tmp/kairo-output
          printf 'arrow-smoke-sample\n' > /tmp/kairo-input/telemetry.arrow
          python docker/telemetry-plugin/cloud-output.py --input /tmp/kairo-input/telemetry.arrow --destination file:///tmp/kairo-output
          cd /tmp/kairo-output
          sha256sum -c telemetry.arrow.sha256

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24.21.0"

      - name: Validate time-travel demo fixture
        run: node website/time-travel-demo/validate-demo.mjs

      - name: Docker image build
        run: docker build -t kairo-ecs-cli:cloud-smoke -f docker/Dockerfile .

      - name: CLI help smoke
        run: docker run --rm kairo-ecs-cli:cloud-smoke --help
