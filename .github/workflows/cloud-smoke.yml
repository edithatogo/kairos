name: Cloud/HPC Smoke

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  pull_request:
    paths:
      - "docker/**"
      - "k8s/**"
      - "cloud/**"
      - "hpc/**"
      - "docs/cloud-hpc/**"
      - "conductor/free-compute-routes.json"
      - "scripts/validation/validate-free-compute-routes.mjs"
      - "scripts/validation/validate-docker-runtime-preflight.mjs"
      - "scripts/validation/validate-external-runtime-preflight.mjs"
      - "tests/free-compute-routes.test.mjs"
      - "tests/docker-runtime-preflight.test.mjs"
      - "tests/external-runtime-preflight.test.mjs"
      - "website/time-travel-demo/**"
      - ".github/workflows/cloud-smoke.yml"
  push:
    branches: [main]
    paths:
      - "docker/**"
      - "k8s/**"
      - "cloud/**"
      - "hpc/**"
      - "docs/cloud-hpc/**"
      - "conductor/free-compute-routes.json"
      - "scripts/validation/validate-free-compute-routes.mjs"
      - "scripts/validation/validate-docker-runtime-preflight.mjs"
      - "scripts/validation/validate-external-runtime-preflight.mjs"
      - "tests/free-compute-routes.test.mjs"
      - "tests/docker-runtime-preflight.test.mjs"
      - "tests/external-runtime-preflight.test.mjs"
      - "website/time-travel-demo/**"
      - ".github/workflows/cloud-smoke.yml"

permissions:
  contents: read

jobs:
  offline-cloud-hpc-smoke:
    name: offline-cloud-hpc-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Validate cloud and HPC manifests
        run: python cloud/validate_cloud_hpc.py

      - name: Test Kubernetes scenario key validation
        run: python -m unittest discover -s k8s/operator -p 'test_*.py'

      - name: Render Kubernetes job from sample experiment
        run: python k8s/operator/kairoecs_operator.py --experiment k8s/samples/experiment.json --output /tmp/kairo-job.json

      - name: Syntax-check Python helpers
        run: python -m py_compile cloud/validate_cloud_hpc.py k8s/operator/kairoecs_operator.py docker/telemetry-plugin/cloud-output.py

      - name: Syntax-check shell entrypoints
        run: |
          bash -n docker/entrypoint.sh
          bash -n hpc/slurm/submit-experiment.sh
          bash -n hpc/slurm/submit-sweep.sh
          bash -n hpc/slurm/resume.sh

      - name: Telemetry plugin checksum smoke
        run: |
          mkdir -p /tmp/kairo-input /tmp/kairo-output
          printf 'arrow-smoke-sample\n' > /tmp/kairo-input/telemetry.arrow
          python docker/telemetry-plugin/cloud-output.py --input /tmp/kairo-input/telemetry.arrow --destination file:///tmp/kairo-output
          cd /tmp/kairo-output
          sha256sum -c telemetry.arrow.sha256

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Validate free compute blocker routes
        run: node scripts/validation/validate-free-compute-routes.mjs

      - name: Test Docker runtime preflight
        run: node --test tests/docker-runtime-preflight.test.mjs

      - name: Probe Docker runtime availability
        run: node scripts/validation/validate-docker-runtime-preflight.mjs --require-docker

      - name: Test external runtime preflight
        run: node --test tests/external-runtime-preflight.test.mjs

      - name: Probe external runtime CLIs
        run: node scripts/validation/validate-external-runtime-preflight.mjs

      - name: Validate time-travel demo fixture
        run: node website/time-travel-demo/validate-demo.mjs

      - name: Docker image build
        run: docker build -t kairo-ecs-cli:cloud-smoke -f docker/Dockerfile .

      - name: CLI help smoke
        run: docker run --rm kairo-ecs-cli:cloud-smoke --help
