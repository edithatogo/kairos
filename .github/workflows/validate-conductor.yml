name: Validate Conductor

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches: [main]
    paths:
      - 'conductor/**'
      - 'docs/cloud-hpc/free-compute-blocker-plan.md'
      - 'docs/cloud-hpc/evidence-capture.md'
      - 'docs/developer-experience/windows-linker-resolution.md'
      - '.github/workflows/**'
      - 'scripts/validate_conductor*.ps1'
      - 'scripts/validation/**'
      - 'scripts/evidence/**'
      - 'tests/hpc-evidence-capture.test.mjs'
      - 'tests/windows-linker-resolution.test.mjs'
      - 'deny.toml'
      - 'rust-toolchain.toml'
  pull_request:
    paths:
      - 'conductor/**'
      - 'docs/cloud-hpc/free-compute-blocker-plan.md'
      - 'docs/cloud-hpc/evidence-capture.md'
      - 'docs/developer-experience/windows-linker-resolution.md'
      - '.github/workflows/**'
      - 'scripts/validate_conductor*.ps1'
      - 'scripts/validation/**'
      - 'scripts/evidence/**'
      - 'tests/hpc-evidence-capture.test.mjs'
      - 'tests/windows-linker-resolution.test.mjs'
      - 'deny.toml'
      - 'rust-toolchain.toml'
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: validate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install exact Rust 1.99.0 Linux toolchain
        if: runner.os == 'Linux'
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy

      - name: Install exact Rust 1.99.0 Windows GNU toolchain
        if: runner.os == 'Windows'
        run: rustup toolchain install 1.99.0-x86_64-pc-windows-gnu --profile minimal --component rustfmt --component clippy

      - name: Validate conductor setup
        run: pwsh -NoProfile -File scripts/validate_conductor_setup.ps1

      - name: Validate conductor DAG
        run: pwsh -NoProfile -File scripts/validate_conductor_dag.ps1

      - name: Validate conductor artifacts
        run: pwsh -NoProfile -File scripts/validate_conductor_artifacts.ps1

      - name: Validate conductor phase gates
        run: pwsh -NoProfile -File scripts/validate_conductor_phase_gates.ps1

      - name: Validate Track 13 metadata alignment
        run: node scripts/validation/validate-track13-metadata.mjs

      - name: Validate free compute blocker routes
        run: node scripts/validation/validate-free-compute-routes.mjs

      - name: Test HPC evidence capture utility
        run: node --test tests/hpc-evidence-capture.test.mjs

      - name: Test Windows linker resolution diagnostic
        run: node --test tests/windows-linker-resolution.test.mjs

      - name: Validate track coverage
        run: pwsh -NoProfile -File scripts/validate_track_coverage.ps1
