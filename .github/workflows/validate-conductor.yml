name: Validate Conductor

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches: [main]
    paths:
      - 'conductor/**'
      - '.github/workflows/**'
      - 'scripts/validate_conductor*.ps1'
      - 'scripts/validation/**'
      - 'deny.toml'
      - 'rust-toolchain.toml'
  pull_request:
    paths:
      - 'conductor/**'
      - '.github/workflows/**'
      - 'scripts/validate_conductor*.ps1'
      - 'scripts/validation/**'
      - 'deny.toml'
      - 'rust-toolchain.toml'
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: validate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Validate conductor setup
        run: pwsh -NoProfile -File scripts/validate_conductor_setup.ps1

      - name: Validate conductor DAG
        run: pwsh -NoProfile -File scripts/validate_conductor_dag.ps1

      - name: Validate conductor artifacts
        run: pwsh -NoProfile -File scripts/validate_conductor_artifacts.ps1

      - name: Validate conductor phase gates
        run: pwsh -NoProfile -File scripts/validate_conductor_phase_gates.ps1

      - name: Validate Track 13 metadata alignment
        run: node scripts/validation/validate-track13-metadata.mjs

      - name: Validate track coverage
        run: pwsh -NoProfile -File scripts/validate_track_coverage.ps1
