name: CareOps native owner
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            host: x86_64-unknown-linux-gnu
          - os: macos-15
            host: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify exact native host and source
        env:
          EXPECTED_HOST: ${{ matrix.host }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          rustup toolchain install 1.99.1 --profile minimal
          rustc +1.99.1 -vV | grep -Fx "host: $EXPECTED_HOST"
      - name: Test native workspace
        run: cargo +1.99.1 test --locked --workspace
