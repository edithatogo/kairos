name: CareOps native owner

on:
  push:
    branches: ['codex/careops-*']
  pull_request:
    paths:
      - 'crates/kairo-ecs-core/**'
      - 'crates/kairo-ecs-types/**'
      - 'crates/kairo-ecs-state/**'
      - 'crates/kairo-ecs-rng/**'
      - 'crates/kairo-ecs-des/**'
      - 'crates/kairo-ecs-abm/**'
      - 'crates/kairo-ecs-arrow/**'
      - 'crates/kairo-ecs-calibration/**'
      - 'crates/kairo-ecs-arrow-io/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/ci-core.yml'
      - '.github/workflows/careops-native-owner.yml'
      - 'scripts/c1-arrow-io-python-tools.lock'
      - 'conformance/c43/**'
      - 'conductor/design/calibration/c4.3-arrow-output-v1.md'
      - 'conductor/design/calibration/c4.4-statistical-diagnostics*.md'
      - 'tests/conformance/queue_simpy_v1*'
      - 'benches/queue/qualify_native_v1.py'
      - 'benches/queue/test_qualify_native_v1.py'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  native:
    name: Native owner (${{ matrix.os }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install reviewed Rust 1.99.0
        run: |
          mkdir -p .artifacts/ci/native
          set -o pipefail
          rustup toolchain install 1.99.0 --profile minimal 2>&1 | tee .artifacts/ci/native/install.log
      - name: Verify actual native host and source
        env:
          EXPECTED_OS: ${{ matrix.os }}
        run: |
          set -o pipefail
          exec > >(tee -a .artifacts/ci/native/install.log) 2>&1
          git rev-parse HEAD
          task_rustc="$(rustup which --toolchain 1.99.0 rustc)"
          "$task_rustc" -vV
          if [ "$EXPECTED_OS" = macos-15 ]; then
            "$task_rustc" -vV | grep -Fx 'host: aarch64-apple-darwin'
          else
            "$task_rustc" -vV | grep -Fx 'host: x86_64-unknown-linux-gnu'
          fi
          uname -a
          if [ "$EXPECTED_OS" = macos-15 ]; then
            test "$(uname -m)" = arm64
          else
            test "$(uname -m)" = x86_64
          fi
      - name: Test reusable native owner packages
        run: |
          mkdir -p .artifacts/ci/native
          set -o pipefail
          task_rustc="$(rustup which --toolchain 1.99.0 rustc)"
          task_bin="$(dirname "$task_rustc")"
          export RUSTC="$task_rustc" RUSTDOC="$task_bin/rustdoc" PATH="$task_bin:$PATH"
          cargo test --locked -p kairo-ecs-core -p kairo-ecs-types -p kairo-ecs-state -p kairo-ecs-rng -p kairo-ecs-des -p kairo-ecs-abm -p kairo-ecs-arrow -p kairo-ecs-calibration 2>&1 | tee .artifacts/ci/native/owner.log
      - name: Test calibration and resource lifecycle on current Rust 1.99.0
        env:
          EXPECTED_OS: ${{ matrix.os }}
        run: |
          set -euo pipefail
          rustup run 1.99.0 rustc -vV | tee .artifacts/ci/native/calibration-current.log
          grep -Fx 'release: 1.99.0' .artifacts/ci/native/calibration-current.log
          if [ "$EXPECTED_OS" = macos-15 ]; then
            grep -Fx 'host: aarch64-apple-darwin' .artifacts/ci/native/calibration-current.log
          else
            grep -Fx 'host: x86_64-unknown-linux-gnu' .artifacts/ci/native/calibration-current.log
          fi
          rustup run 1.99.0 cargo test --locked -p kairo-ecs-calibration 2>&1 | tee -a .artifacts/ci/native/calibration-current.log
          rustup run 1.99.0 cargo test --locked -p kairo-ecs-arrow --features resource-lifecycle-io 2>&1 | tee .artifacts/ci/native/resource-lifecycle-current.log
      - name: C2 save, restore, repeat, and sentinel verification on Rust 1.99.0
        env:
          EXPECTED_OS: ${{ matrix.os }}
        run: |
          set -euo pipefail
          log_dir=".artifacts/c2-native-ci/${EXPECTED_OS}"
          mkdir -p "$log_dir"
          exclude_file="$(git rev-parse --git-path info/exclude)"
          mkdir -p "$(dirname "$exclude_file")"
          touch "$exclude_file"
          for pattern in '/.artifacts/c2-native-ci/' '/.artifacts/c2-replay-demo/'; do
            if ! grep -Fxq "$pattern" "$exclude_file"; then
              printf '%s\n' "$pattern" >> "$exclude_file"
            fi
          done
          git rev-parse HEAD | tee "$log_dir/source.log"
          task_rustc="$(rustup which --toolchain 1.99.0 rustc)"
          task_bin="$(dirname "$task_rustc")"
          task_cargo="$(rustup which --toolchain 1.99.0 cargo)"
          export RUSTC="$task_rustc" RUSTDOC="$task_bin/rustdoc" PATH="$task_bin:$PATH"
          "$task_cargo" -V | tee -a "$log_dir/source.log"
          "$task_rustc" -vV | tee -a "$log_dir/source.log"
          grep -Fx 'release: 1.99.0' "$log_dir/source.log"
          if [ "$EXPECTED_OS" = macos-15 ]; then
            grep -Fx 'host: aarch64-apple-darwin' "$log_dir/source.log"
          else
            grep -Fx 'host: x86_64-unknown-linux-gnu' "$log_dir/source.log"
          fi
          export CARGO_TARGET_DIR="$RUNNER_TEMP/c2-native-ci-target"
          rustup run 1.99.0 cargo test --locked -p kairo-ecs-des -p kairo-ecs-abm -p kairo-ecs-calibration --features kairo-ecs-calibration/flow,kairo-ecs-abm/test-support -- --nocapture 2>&1 | tee "$log_dir/flow-tests.log"
          "$task_cargo" build --locked -p kairo-ecs-calibration --features flow,kairo-ecs-abm/test-support --example c2_replay_demo 2>&1 | tee "$log_dir/example-build.log"
          binary="$CARGO_TARGET_DIR/debug/examples/c2_replay_demo"
          test -x "$binary"
          shasum -a 256 "$binary" | tee "$log_dir/example-binary.sha256"
          checkpoint="$log_dir/checkpoint.json"
          test ! -e "$checkpoint"
          "$binary" save "$checkpoint" 2>&1 | tee "$log_dir/save.log"
          shasum -a 256 "$checkpoint" | tee "$log_dir/checkpoint.sha256"
          "$binary" restore "$checkpoint" > "$log_dir/restore-first.json" 2> "$log_dir/restore-first.log"
          "$binary" restore "$checkpoint" > "$log_dir/restore-second.json" 2> "$log_dir/restore-second.log"
          cmp "$log_dir/restore-first.json" "$log_dir/restore-second.json"
          printf '%s\n' 'repeat_restore_output=identical' | tee "$log_dir/repeat-check.log"
          sentinel="$log_dir/preexisting-checkpoint.json"
          expected="$log_dir/preexisting-checkpoint.expected"
          printf '%s\n' 'preexisting sentinel bytes' > "$sentinel"
          cp "$sentinel" "$expected"
          if "$binary" save "$sentinel" > "$log_dir/sentinel-save.stdout" 2> "$log_dir/sentinel-save.stderr"; then
            status=0
          else
            status=$?
          fi
          test "$status" -eq 1
          grep -F 'checkpoint destination already exists' "$log_dir/sentinel-save.stderr"
          cmp "$expected" "$sentinel"
          printf 'sentinel_save_exit=%s\nexisting_target_rejected=true\nsentinel_bytes_unchanged=true\n' "$status" | tee "$log_dir/sentinel-check.log"
      - name: Preserve C2 native evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: c2-native-${{ matrix.os }}
          path: .artifacts/c2-native-ci/${{ matrix.os }}/
          retention-days: 7
          if-no-files-found: error
      - name: Initialize Arrow IO Rust 1.99.0 evidence directory
        run: mkdir -p ".artifacts/ci/arrow-io/1.99.0/${{ matrix.os }}"
      - name: Install pinned Python for Arrow IO interoperability
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.14.8'
      - name: Q5.1 deterministic queues and bounded SimPy reference
        run: |
          set -euo pipefail
          # Only declared generated CI outputs are ignored; source changes remain visible.
          printf '%s\n' '/.artifacts/ci/' >> "$(git rev-parse --git-path info/exclude)"
          log_dir=".artifacts/ci/q51"
          mkdir -p "$log_dir"
          git rev-parse HEAD | tee "$log_dir/source.log"
          rustup run 1.99.0 cargo -V | tee -a "$log_dir/source.log"
          rustup run 1.99.0 rustc -vV | tee -a "$log_dir/source.log"
          rustup run 1.99.0 cargo test --locked -p kairo-ecs-des --test flow_determinism_conformance_v1 --test flow_preemption_property_v1 -- --nocapture 2>&1 | tee "$log_dir/debug.log"
          rustup run 1.99.0 cargo test --locked -p kairo-ecs-des --release -- --nocapture 2>&1 | tee "$log_dir/release.log"
          rustup run 1.99.0 cargo run --locked -p kairo-ecs-des --example flow_simpy_shared_v1 > "$log_dir/rust.json" 2> "$log_dir/rust-emitter.log"
          python -m unittest discover -s tests/conformance -p queue_simpy_v1_test.py -v 2>&1 | tee "$log_dir/comparator-tests.log"
          reference_dir="$RUNNER_TEMP/q51-reference-python"
          python -m venv "$reference_dir"
          "$reference_dir/bin/python" --version | tee "$log_dir/reference-install.log"
          "$reference_dir/bin/python" -m pip install --disable-pip-version-check --no-input --only-binary=:all: --no-deps --require-hashes -r tests/conformance/queue_simpy_v1_requirements.txt 2>&1 | tee -a "$log_dir/reference-install.log"
          "$reference_dir/bin/python" tests/conformance/queue_simpy_v1.py --rust-trace "$log_dir/rust.json" --output "$log_dir/comparison.json" 2>&1 | tee "$log_dir/reference.log"
      - name: Q5.2 supplementary queue benchmark checks
        run: |
          set -euo pipefail
          log_dir=".artifacts/ci/q52"
          mkdir -p "$log_dir"
          git rev-parse HEAD | tee "$log_dir/source.log"
          rustup run 1.99.0 rustc -vV | tee -a "$log_dir/source.log"
          python -m unittest discover -s benches/queue -p test_run_v1.py -v 2>&1 | tee "$log_dir/collector-tests.log"
          rustup run 1.99.0 cargo test --locked -p kairo-ecs-des --release benchmark_q52_measurements -- --ignored --nocapture 2>&1 | tee "$log_dir/kernel.log"
          python benches/queue/run_v1.py --build --binary target/release/examples/flow_queue_benchmark_v1 --scenario churn --n 10 --resources 1 --capacity 1 --repeats 5 --timeout-seconds 30 --seed 42 --output-dir "$log_dir/runtime" 2>&1 | tee "$log_dir/runtime.log"
          python -c 'import glob,json; paths=glob.glob(".artifacts/ci/q52/runtime/*/result.json"); assert len(paths)==1, paths; r=json.load(open(paths[0])); assert r["status"]=="complete" and r["bounded_measurement_provenance_qualified"], r["status"]'
          # This bounded smoke is correctness/provenance evidence; full local matrix
          # and canonical upstream regression comparisons remain separate gates.
      - name: Preserve Q5.2 supplementary benchmark evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: q52-queue-benchmarks-${{ matrix.os }}
          path: .artifacts/ci/q52/
          retention-days: 7
          if-no-files-found: error
      - name: Preserve Q5.1 conformance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: q51-conformance-${{ matrix.os }}
          path: .artifacts/ci/q51/
          retention-days: 7
          if-no-files-found: error
      - name: Test Arrow IO with Rust 1.99.0
        env:
          EXPECTED_OS: ${{ matrix.os }}
        run: |
          set -o pipefail
          log_dir=".artifacts/ci/arrow-io/1.99.0/${EXPECTED_OS}"
          mkdir -p "$log_dir"
          task_rustc="$(rustup which --toolchain 1.99.0 rustc)"
          task_bin="$(dirname "$task_rustc")"
          task_cargo="$(rustup which --toolchain 1.99.0 cargo)"
          export RUSTC="$task_rustc" RUSTDOC="$task_bin/rustdoc" PATH="$task_bin:$PATH"
          "$task_cargo" -V | tee "$log_dir/toolchain.log"
          "$task_rustc" -vV | tee -a "$log_dir/toolchain.log"
          grep -Fx 'release: 1.99.0' "$log_dir/toolchain.log"
          if [ "$EXPECTED_OS" = macos-15 ]; then
            grep -Fx 'host: aarch64-apple-darwin' "$log_dir/toolchain.log"
          else
            grep -Fx 'host: x86_64-unknown-linux-gnu' "$log_dir/toolchain.log"
          fi
          python_dir="$RUNNER_TEMP/c1-arrow-io-python"
          python -m venv "$python_dir"
          "$python_dir/bin/python" --version | tee "$log_dir/python.log"
          "$python_dir/bin/python" -m pip install --disable-pip-version-check --no-input --only-binary=:all: --require-hashes -r scripts/c1-arrow-io-python-tools.lock 2>&1 | tee -a "$log_dir/python.log"
          "$python_dir/bin/python" -c 'import platform, pyarrow; assert platform.python_version() == "3.14.8", platform.python_version(); assert pyarrow.__version__ == "25.0.1", pyarrow.__version__' 2>&1 | tee -a "$log_dir/python.log"
          fixtures="crates/kairo-ecs-arrow-io/tests/fixtures/interop_v1/generate.py"
          "$python_dir/bin/python" "$fixtures" --check 2>&1 | tee "$log_dir/fixtures.log"
          output_dir="$GITHUB_WORKSPACE/$log_dir/rust-output"
          test ! -e "$output_dir"
          mkdir -p "$output_dir"
          export KAIROS_INTEROP_OUTDIR="$output_dir"
          export KAIROS_C11_PHYSICAL_OUTDIR="$GITHUB_WORKSPACE/$log_dir/c11-rust-output"
          "$task_cargo" test --locked -p kairo-ecs-arrow-io --all-features 2>&1 | tee "$log_dir/test.log"
          "$task_cargo" test --locked -p kairo-ecs-arrow --features resource-lifecycle-io 2>&1 | tee "$log_dir/resource-lifecycle.log"
          export C43_OUTPUT_DIR="$GITHUB_WORKSPACE/$log_dir/c43-rust-output"
          export C44_DIAGNOSTICS_DIR="$GITHUB_WORKSPACE/$log_dir/c44-diagnostic-cases"
          "$task_cargo" test --locked -p kairo-ecs-calibration --no-default-features --features ipc,parquet --test arrow_output_c43 --test sidecar_adapter_c43 --test sidecar_pipeline_c43 c43_ 2>&1 | tee "$log_dir/c43-native.log"
          "$python_dir/bin/python" conformance/c43/readback.py --self-test 2>&1 | tee "$log_dir/c43-reader-controls.log"
          "$python_dir/bin/python" conformance/c43/readback.py --require-manifests --require-statistical-diagnostics --mutation-controls "$C43_OUTPUT_DIR" 2>&1 | tee "$log_dir/c43-readback.log"
          for case_name in overlap-and-ties empty-and-insufficient; do
            "$python_dir/bin/python" conformance/c43/statistical_diagnostics.py "$C44_DIAGNOSTICS_DIR/$case_name" 2>&1 | tee "$log_dir/c44-$case_name-readback.log"
          done
          test -s "$output_dir/rust.ipc_file"
          test -s "$output_dir/rust.ipc_stream"
          test -s "$output_dir/rust.parquet"
          "$python_dir/bin/python" "$fixtures" --check-rust "$output_dir" 2>&1 | tee "$log_dir/pyarrow-readback.log"
          "$python_dir/bin/python" crates/kairo-ecs-arrow-io/tests/fixtures/calibration_physical_v2/generate.py --check-rust "$KAIROS_C11_PHYSICAL_OUTDIR" 2>&1 | tee "$log_dir/c11-pyarrow-readback.log"
      - name: Preserve Arrow IO Rust 1.99.0 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: arrow-io-rust-1.99.0-${{ matrix.os }}
          path: .artifacts/ci/arrow-io/1.99.0/${{ matrix.os }}/
          retention-days: 7
          if-no-files-found: error
      - name: Retain bounded failure log
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: careops-owner-failure-${{ matrix.os }}
          path: .artifacts/ci/native/
          retention-days: 7
          if-no-files-found: error

  arrow-io-current:
    name: Arrow IO Rust 1.99.0 (${{ matrix.os }}, ${{ matrix.features }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        features: [none, ipc, parquet, both]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Initialize Arrow IO evidence directory
        run: mkdir -p ".artifacts/ci/arrow-io/1.99.0/${{ matrix.os }}/${{ matrix.features }}"
      - name: Install current stable Rust 1.99.0
        run: rustup toolchain install 1.99.0 --profile minimal
      - name: Verify Rust 1.99.0 host
        env:
          EXPECTED_OS: ${{ matrix.os }}
        run: |
          task_rustc="$(rustup which --toolchain 1.99.0 rustc)"
          task_cargo="$(rustup which --toolchain 1.99.0 cargo)"
          "$task_cargo" -V | tee ".artifacts/ci/arrow-io/1.99.0/${{ matrix.os }}/${{ matrix.features }}/toolchain.log"
          "$task_rustc" -vV | tee -a ".artifacts/ci/arrow-io/1.99.0/${{ matrix.os }}/${{ matrix.features }}/toolchain.log"
          grep -Fx 'release: 1.99.0' ".artifacts/ci/arrow-io/1.99.0/${{ matrix.os }}/${{ matrix.features }}/toolchain.log"
          if [ "$EXPECTED_OS" = macos-15 ]; then
            grep -Fx 'host: aarch64-apple-darwin' ".artifacts/ci/arrow-io/1.99.0/${{ matrix.os }}/${{ matrix.features }}/toolchain.log"
          else
            grep -Fx 'host: x86_64-unknown-linux-gnu' ".artifacts/ci/arrow-io/1.99.0/${{ matrix.os }}/${{ matrix.features }}/toolchain.log"
          fi
      - name: Install pinned PyArrow for bidirectional interop
        if: matrix.features == 'both'
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.14.8'
      - name: Install hash-locked PyArrow requirements
        if: matrix.features == 'both'
        run: |
          set -o pipefail
          log_dir=".artifacts/ci/arrow-io/1.99.0/${{ matrix.os }}/${{ matrix.features }}"
          python_dir="$RUNNER_TEMP/c1-arrow-io-python"
          test ! -e "$python_dir"
          python -m venv "$python_dir"
          python_exe="$python_dir/bin/python"
          "$python_exe" --version | tee "$log_dir/python.log"
          "$python_exe" -m pip install --disable-pip-version-check --no-input --only-binary=:all: --require-hashes -r scripts/c1-arrow-io-python-tools.lock 2>&1 | tee -a "$log_dir/python.log"
          "$python_exe" -c 'import platform, pyarrow; assert platform.python_version() == "3.14.8", platform.python_version(); assert pyarrow.__version__ == "25.0.1", pyarrow.__version__' 2>&1 | tee -a "$log_dir/python.log"
          "$python_exe" crates/kairo-ecs-arrow-io/tests/fixtures/interop_v1/generate.py --check 2>&1 | tee "$log_dir/fixtures.log"
      - name: Run Arrow IO feature selection
        env:
          EXPECTED_OS: ${{ matrix.os }}
          FEATURE_SET: ${{ matrix.features }}
          KAIROS_INTEROP_OUTDIR: ${{ github.workspace }}/.artifacts/ci/arrow-io/1.99.0/${{ matrix.os }}/${{ matrix.features }}/rust-output
        run: |
          set -o pipefail
          log_dir=".artifacts/ci/arrow-io/1.99.0/${EXPECTED_OS}/${FEATURE_SET}"
          task_rustc="$(rustup which --toolchain 1.99.0 rustc)"
          task_bin="$(dirname "$task_rustc")"
          task_cargo="$(rustup which --toolchain 1.99.0 cargo)"
          export RUSTC="$task_rustc" RUSTDOC="$task_bin/rustdoc" PATH="$task_bin:$PATH"
          cargo_args=(test --locked -p kairo-ecs-arrow-io --no-default-features)
          case "$FEATURE_SET" in
            none) ;;
            ipc) cargo_args+=(--features ipc) ;;
            parquet) cargo_args+=(--features parquet) ;;
            both) cargo_args+=(--features 'ipc,parquet') ;;
            *) echo "unsupported feature set: $FEATURE_SET" >&2; exit 2 ;;
          esac
          if [ "$FEATURE_SET" = both ]; then
            test ! -e "$KAIROS_INTEROP_OUTDIR"
            mkdir -p "$KAIROS_INTEROP_OUTDIR"
          fi
          "$task_cargo" "${cargo_args[@]}" 2>&1 | tee "$log_dir/test.log"
          calibration_args=(test --locked -p kairo-ecs-calibration --no-default-features --test arrow_output_c43 --test sidecar_adapter_c43 --test sidecar_pipeline_c43)
          case "$FEATURE_SET" in
            none) ;;
            ipc) calibration_args+=(--features ipc) ;;
            parquet) calibration_args+=(--features parquet) ;;
            both) calibration_args+=(--features 'ipc,parquet') ;;
          esac
          export C43_OUTPUT_DIR="$GITHUB_WORKSPACE/$log_dir/c43-rust-output"
          export C44_DIAGNOSTICS_DIR="$GITHUB_WORKSPACE/$log_dir/c44-diagnostic-cases"
          "$task_cargo" "${calibration_args[@]}" c43_ 2>&1 | tee "$log_dir/c43-native.log"
          if [ "$FEATURE_SET" = both ]; then
            "$RUNNER_TEMP/c1-arrow-io-python/bin/python" conformance/c43/readback.py --self-test 2>&1 | tee "$log_dir/c43-reader-controls.log"
            "$RUNNER_TEMP/c1-arrow-io-python/bin/python" conformance/c43/readback.py --require-manifests --require-statistical-diagnostics --mutation-controls "$C43_OUTPUT_DIR" 2>&1 | tee "$log_dir/c43-readback.log"
            for case_name in overlap-and-ties empty-and-insufficient; do
              "$RUNNER_TEMP/c1-arrow-io-python/bin/python" conformance/c43/statistical_diagnostics.py "$C44_DIAGNOSTICS_DIR/$case_name" 2>&1 | tee "$log_dir/c44-$case_name-readback.log"
            done
          fi
          if [ "$FEATURE_SET" = both ]; then
            test -s "$KAIROS_INTEROP_OUTDIR/rust.ipc_file"
            test -s "$KAIROS_INTEROP_OUTDIR/rust.ipc_stream"
            test -s "$KAIROS_INTEROP_OUTDIR/rust.parquet"
            "$RUNNER_TEMP/c1-arrow-io-python/bin/python" crates/kairo-ecs-arrow-io/tests/fixtures/interop_v1/generate.py --check-rust "$KAIROS_INTEROP_OUTDIR" 2>&1 | tee "$log_dir/pyarrow-readback.log"
          fi
      - name: Preserve Arrow IO Rust 1.99.0 feature evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: arrow-io-rust-1.99.0-${{ matrix.os }}-${{ matrix.features }}
          path: .artifacts/ci/arrow-io/1.99.0/${{ matrix.os }}/${{ matrix.features }}/
          retention-days: 7
          if-no-files-found: error

  q52-native-regression:
    name: Q5.2 canonical native regression (Ubuntu)
    if: startsWith(github.head_ref || github.ref_name, 'codex/careops-q52')
    needs: [native, arrow-io-current]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install pinned Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.14.8'
      - name: Test Q5.2 qualifier without compiling
        run: |
          set -euo pipefail
          mkdir -p .artifacts/ci/q52-native
          python -m unittest discover -s benches/queue -p test_qualify_native_v1.py -v 2>&1 | tee .artifacts/ci/q52-native/qualification-tests.log
          python -m py_compile benches/queue/qualify_native_v1.py benches/queue/test_qualify_native_v1.py 2>&1 | tee .artifacts/ci/q52-native/qualification-pycompile.log
      - name: Compare accepted F and exact Q5.2 head
        timeout-minutes: 25
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          RUN_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python benches/queue/qualify_native_v1.py --expected-head "$EXPECTED_HEAD" --run-sha "$RUN_SHA"
      - name: Preserve Q5.2 native canonical evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: q52-native-canonical-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .artifacts/ci/q52-native/**
            !.artifacts/ci/q52-native/target/**
          retention-days: 7
          if-no-files-found: warn

  native-required:
    name: Native and Arrow IO required
    if: always()
    needs: [native, arrow-io-current, q52-native-regression]
    runs-on: ubuntu-24.04
    steps:
      - name: Require native and every Arrow IO matrix child
        env:
          NATIVE_RESULT: ${{ needs.native.result }}
          ARROW_IO_RESULT: ${{ needs.arrow-io-current.result }}
          Q52_RESULT: ${{ needs.q52-native-regression.result }}
          Q52_REQUIRED: ${{ startsWith(github.head_ref || github.ref_name, 'codex/careops-q52') }}
        run: |
          test "$NATIVE_RESULT" = success
          test "$ARROW_IO_RESULT" = success
          if [ "$Q52_REQUIRED" = true ]; then
            test "$Q52_RESULT" = success
          else
            test "$Q52_RESULT" = skipped
          fi
