name: Conductor Monthly Assessment Reminder

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  schedule:
    - cron: '0 9 1 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create-assessment-issue:
    name: Create monthly assessment issue
    permissions:
      contents: read
      issues: write # Needed only to create the scheduled monthly assessment issue.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Check for existing open assessment issue this month
        id: check-existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MONTH=$(date +%B)
          YEAR=$(date +%Y)
          SEARCH="Monthly assessment — $MONTH $YEAR"
          EXISTING=$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --search "$SEARCH in:title" \
            --state open \
            --json number \
            --jq '.[0].number // empty')
          echo "existing=$EXISTING" >> "$GITHUB_OUTPUT"

      - name: Create assessment issue
        if: steps.check-existing.outputs.existing == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MONTH=$(date +%B)
          YEAR=$(date +%Y)
          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "Monthly assessment — $MONTH $YEAR" \
            --label "conductor,assessment,recurring" \
            --body-file .github/ISSUE_TEMPLATE/conductor-assessment.md
