name: Scorecard supply-chain security

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
on:
  branch_protection_rule:
  schedule:
    - cron: '21 4 * * 1'
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Needed by Scorecard publish_results for provenance.
      security-events: write # Needed to upload Scorecard SARIF into code scanning.

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SARIF file
          path: scorecard-results.sarif
          retention-days: 5

      - name: Upload to SARIF
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: scorecard-results.sarif
          category: OpenSSF Scorecard
          wait-for-processing: true
      - name: Gate high and critical code-scanning alerts
        uses: edithatogo/.github/.github/actions/code-scanning-gate@c3e51f894a500198e67c864a1f0c460ba72e12cd
        with:
          timeout-seconds: "0" # SARIF processing completed in the preceding step.
