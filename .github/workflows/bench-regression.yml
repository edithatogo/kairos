name: Benchmark Regression Guard

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  pull_request:
    paths:
      - 'crates/kairo-ecs-core/**'
      - 'crates/kairo-ecs-state/**'
      - 'benches/**'
      - 'crates/kairo-ecs-bench/**'
      - 'conductor/performance-thresholds.md'
      - 'conductor/tracks/31-performance-regression-guard/**'
      - '.github/workflows/bench-regression.yml'
  push:
    branches:
      - main
    paths:
      - 'crates/kairo-ecs-core/**'
      - 'crates/kairo-ecs-state/**'
      - 'benches/**'
      - 'crates/kairo-ecs-bench/**'
      - 'conductor/performance-thresholds.md'
      - 'conductor/tracks/31-performance-regression-guard/**'
      - '.github/workflows/bench-regression.yml'

permissions:
  contents: read

jobs:
  regression-check:
    name: regression-check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.1"
      - name: Verify repository-local Python 3.15.1
        run: python scripts/python_runtime.py --github
      - name: Validate benchmark metadata
        run: python benches/benchmark_smoke.py
      - name: Validate threshold coverage
        run: python benches/regression/compare.py --report bench-regression-threshold-report.json
      - name: Compile benchmark targets
        run: cargo bench --workspace --no-run
      - name: Upload regression guard report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: bench-regression-threshold-report
          path: bench-regression-threshold-report.json
