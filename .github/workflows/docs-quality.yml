name: Docs Quality

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  pull_request:
    paths:
      - '.github/workflows/docs.yml'
      - '.github/workflows/docs-quality.yml'
      - 'tools/docs-quality-node-tools/package.json'
      - 'tools/docs-quality-node-tools/package-lock.json'
      - '*.md'
      - '**/*.mmd'
      - 'docs/**'
      - 'website/**'
      - 'bindings/**'
      - 'examples/**'
      - 'notebooks/**'
      - 'crates/kairo-ecs-core/**'
      - 'planning/diagrams/**'
      - 'scripts/validation/**'
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  docs-quality:
    name: docs-quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Check Mermaid diagrams render
        run: |
          npm ci --prefix tools/docs-quality-node-tools
          tools/docs-quality-node-tools/node_modules/.bin/puppeteer browsers install chrome-headless-shell
          cat > .mermaid-puppeteer.json <<'JSON'
          {
            "args": ["--no-sandbox", "--disable-setuid-sandbox"]
          }
          JSON
          mkdir -p /tmp/mermaid-out
          shopt -s globstar nullglob
          for f in **/*.mmd; do
            echo "Rendering $f"
            tools/docs-quality-node-tools/node_modules/.bin/mmdc -p .mermaid-puppeteer.json -i "$f" -o "/tmp/mermaid-out/$(basename "$f").svg"
          done
      - name: Restore Lychee cache
        id: lychee-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lycheecache
          key: lychee-${{ runner.os }}-${{ github.sha }}
          restore-keys: lychee-${{ runner.os }}-
      - name: Markdown link check
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --verbose --no-progress --cache --max-cache-age 1d './*.md' './docs/**/*.md' './website/**/*.md'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Save Lychee cache
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lycheecache
          key: ${{ steps.lychee-cache.outputs.cache-primary-key }}
      - name: Tutorial validation
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File docs/tutorials/validate-tutorials.ps1
      - name: Install website dependencies
        run: |
          npm ci --prefix website
          python3 scripts/bootstrap-node-tools/apply_http_cache_fix.py website/node_modules
          node tests/http-cache-security-regression.mjs website/node_modules/http-cache-semantics/index.js
      - name: Local LLMS renderer contract tests
        run: node --test website/tests/kairoecs-llms-txt.test.mjs
      - name: Search DOM XSS regression tests
        run: node website/scripts/test-search-security.mjs
      - name: Docs workflow validation
        run: node scripts/dx/validate-docs-workflow.mjs
      - name: Build docs site
        run: npm --prefix website run build
      - name: Docs platform SOTA gate
        run: node scripts/validation/validate-docs-platform-sota.mjs
      - name: Learning coverage matrix
        run: node scripts/validation/validate-learning-coverage.mjs
      - name: Notebook validation
        run: python notebooks/validate_notebooks.py
