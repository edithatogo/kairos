name: Docs Quality

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  pull_request:
    paths:
      - '.github/workflows/docs.yml'
      - '.github/workflows/docs-quality.yml'
      - 'scripts/bootstrap-node-tools/apply_http_cache_fix.py'
      - 'tests/test_website_cache_evidence.py'
      - 'tests/test_website_http_cache_patch.py'
      - 'tests/test_dependency_advisory_pins.py'
      - 'tests/fixtures/http-cache-semantics-4.3.0.tgz'
      - 'tests/http-cache-security-regression.mjs'
      - 'scripts/prepare_mermaid_runtime.mjs'
      - 'tests/mermaid-runtime.test.mjs'
      - 'tools/docs-quality-node-tools/package.json'
      - 'tools/docs-quality-node-tools/package-lock.json'
      - '*.md'
      - '**/*.mmd'
      - 'docs/**'
      - 'website/**'
      - 'bindings/**'
      - 'examples/**'
      - 'notebooks/**'
      - 'crates/kairo-ecs-core/**'
      - 'planning/diagrams/**'
      - 'scripts/validation/**'
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  docs-quality:
    name: docs-quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.1"
      - name: Verify repository-local Python 3.15.1
        run: python scripts/python_runtime.py --github
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.2'
      - name: Install website dependencies
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          mkdir -p artifacts/website-cache-security
          node --version > artifacts/website-cache-security/node-version.txt
          npm --version > artifacts/website-cache-security/npm-version.txt
          test -f tests/test_website_http_cache_patch.py
          test -f tests/test_website_cache_evidence.py
          python3 -m unittest discover -s tests -p 'test_website*cache*.py' -v > artifacts/website-cache-security/adapter-tests.log 2>&1
          python3 -m unittest discover -s tests -p test_dependency_advisory_pins.py -v > artifacts/website-cache-security/dependency-pin-tests.log 2>&1
          npm ci --prefix website > artifacts/website-cache-security/install.log 2>&1
          npm audit --prefix website --audit-level=moderate --json > artifacts/website-cache-security/raw-audit.json
          node tests/http-cache-security-regression.mjs website/node_modules/http-cache-semantics/index.js --expect-vulnerable > artifacts/website-cache-security/negative-control.log
          python3 website/scripts/apply_http_cache_fix.py website/node_modules > artifacts/website-cache-security/mitigation.log
          node tests/http-cache-security-regression.mjs website/node_modules/http-cache-semantics/index.js > artifacts/website-cache-security/regression.log
          printf '%s\n' "$GITHUB_SHA" > artifacts/website-cache-security/source-commit.txt
          sha256sum tests/test_dependency_advisory_pins.py website/package-lock.json website/scripts/apply_http_cache_fix.py scripts/bootstrap-node-tools/apply_http_cache_fix.py tests/http-cache-security-regression.mjs tests/test_website_http_cache_patch.py tests/fixtures/http-cache-semantics-4.3.0.tgz website/node_modules/http-cache-semantics/index.js website/scripts/verify_cache_security_evidence.py tests/test_website_cache_evidence.py > artifacts/website-cache-security/SHA256SUMS
          mkdir -p artifacts/website-cache-security/http-cache-semantics
          cp website/node_modules/http-cache-semantics/index.js website/node_modules/http-cache-semantics/package.json website/node_modules/http-cache-semantics/LICENSE artifacts/website-cache-security/http-cache-semantics/
          python3 website/scripts/verify_cache_security_evidence.py artifacts/website-cache-security
      - name: Check Mermaid diagrams render
        id: mermaid
        run: |
          mkdir -p artifacts/mermaid-runtime
          npm ci --prefix tools/docs-quality-node-tools > artifacts/mermaid-runtime/install.log 2>&1
          tools/docs-quality-node-tools/node_modules/.bin/puppeteer browsers install chrome-headless-shell > artifacts/mermaid-runtime/browser-install.log 2>&1
          cat > .mermaid-puppeteer.json <<'JSON'
          {
            "args": ["--no-sandbox", "--disable-setuid-sandbox"]
          }
          JSON
          node --test tests/mermaid-runtime.test.mjs > artifacts/mermaid-runtime/tests.log 2>&1
          mkdir -p /tmp/mermaid-out
          rendered_count=0
          while IFS= read -r -d '' f; do
            echo "Rendering $f"
            mkdir -p "/tmp/mermaid-out/$(dirname "$f")"
            tools/docs-quality-node-tools/node_modules/.bin/mmdc -p .mermaid-puppeteer.json -i "$f" -o "/tmp/mermaid-out/$f.svg"
            rendered_count=$((rendered_count + 1))
          done < <(git ls-files -z -- '*.mmd')
          test "$rendered_count" -gt 0
      - name: Retain Mermaid runtime qualification
        if: always() && steps.mermaid.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mermaid-runtime-${{ github.run_id }}
          path: artifacts/mermaid-runtime
          if-no-files-found: error
          retention-days: 14
      - name: Restore Lychee cache
        id: lychee-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lycheecache
          key: lychee-${{ runner.os }}-${{ github.sha }}
          restore-keys: lychee-${{ runner.os }}-
      - name: Markdown link check
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # Website installation now precedes this step; npm dependency docs are not repository docs.
          args: --verbose --no-progress --cache --max-cache-age 1d --exclude-path '(^|/)node_modules/' './*.md' './docs/**/*.md' './website/**/*.md'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Save Lychee cache
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lycheecache
          key: ${{ steps.lychee-cache.outputs.cache-primary-key }}
      - name: Tutorial validation
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File docs/tutorials/validate-tutorials.ps1
      - name: Local LLMS renderer contract tests
        run: node --test website/tests/kairoecs-llms-txt.test.mjs
      - name: Search DOM XSS regression tests
        run: node website/scripts/test-search-security.mjs
      - name: Docs workflow validation
        run: node scripts/dx/validate-docs-workflow.mjs
      - name: Build docs site
        run: npm --prefix website run build
      - name: Docs platform SOTA gate
        run: node scripts/validation/validate-docs-platform-sota.mjs
      - name: Learning coverage matrix
        run: node scripts/validation/validate-learning-coverage.mjs
      - name: Notebook validation
        run: python notebooks/validate_notebooks.py
      - name: Retain website cache security evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: website-cache-security-${{ github.workflow }}-${{ github.run_id }}
          path: artifacts/website-cache-security
          if-no-files-found: error
          retention-days: 14
