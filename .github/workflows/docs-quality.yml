name: Docs Quality

on:
  pull_request:
    paths:
      - '**/*.md'
      - '**/*.mmd'
      - 'docs/**'
      - 'planning/diagrams/**'
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  docs-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
      - name: Check Mermaid diagrams render
        run: |
          npm install -g @mermaid-js/mermaid-cli
          mkdir -p /tmp/mermaid-out
          shopt -s globstar nullglob
          for f in **/*.mmd; do
            echo "Rendering $f"
            mmdc -i "$f" -o "/tmp/mermaid-out/$(basename "$f").svg"
          done
      - name: Markdown link check
        uses: lycheeverse/lychee-action@v2
        with:
          args: --verbose --no-progress './README.md' './docs/**/*.md'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
