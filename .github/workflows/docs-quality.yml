name: Docs Quality

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  pull_request:
    paths:
      - '**/*.md'
      - '**/*.mmd'
      - 'docs/**'
      - 'website/**'
      - 'bindings/**'
      - 'examples/**'
      - 'notebooks/**'
      - 'crates/kairo-ecs-core/**'
      - 'planning/diagrams/**'
      - 'scripts/validation/**'
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  docs-quality:
    name: docs-quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
      - name: Check Mermaid diagrams render
        run: |
          npm install -g @mermaid-js/mermaid-cli
          chrome_path="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -n "$chrome_path" ]; then
            cat > .mermaid-puppeteer.json <<JSON
          {
            "executablePath": "$chrome_path",
            "args": ["--no-sandbox", "--disable-setuid-sandbox"]
          }
          JSON
          else
            npx --yes puppeteer browsers install chrome-headless-shell
            cat > .mermaid-puppeteer.json <<'JSON'
          {
            "args": ["--no-sandbox", "--disable-setuid-sandbox"]
          }
          JSON
          fi
          mkdir -p /tmp/mermaid-out
          shopt -s globstar nullglob
          for f in **/*.mmd; do
            echo "Rendering $f"
            mmdc -p .mermaid-puppeteer.json -i "$f" -o "/tmp/mermaid-out/$(basename "$f").svg"
          done
      - name: Markdown link check
        uses: lycheeverse/lychee-action@8646ba30535128ac92d33dfc9133794bfdd9b411 # v2.8.0
        with:
          args: --verbose --no-progress './README.md' './docs/**/*.md'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Tutorial validation
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File docs/tutorials/validate-tutorials.ps1
      - name: Install website dependencies
        run: npm ci --prefix website
      - name: Docs workflow validation
        run: node scripts/dx/validate-docs-workflow.mjs
      - name: Build docs site
        run: npm --prefix website run build
      - name: Docs platform SOTA gate
        run: node scripts/validation/validate-docs-platform-sota.mjs
      - name: Learning coverage matrix
        run: node scripts/validation/validate-learning-coverage.mjs
      - name: Notebook validation
        run: python notebooks/validate_notebooks.py
