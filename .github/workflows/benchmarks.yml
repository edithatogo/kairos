name: Benchmarks

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  workflow_dispatch:
  schedule:
    - cron: '33 2 * * 2'

permissions:
  contents: read

jobs:
  criterion:
    name: criterion
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust 1.99.0
        run: |
          rustup toolchain install 1.99.0 --profile minimal
      - name: Bind Rust 1.99.0 tools
        shell: bash
        run: |
          task_rustc="$(rustup which --toolchain 1.99.0 rustc)"
          task_bin="$(dirname "$task_rustc")"
          task_cargo="$(rustup which --toolchain 1.99.0 cargo)"
          task_rustdoc="$(rustup which --toolchain 1.99.0 rustdoc)"
          "$task_cargo" -V | grep -E '^cargo 1\.99\.0 '
          "$task_rustc" -V | grep -E '^rustc 1\.99\.0 '
          "$task_rustdoc" -V | grep -E '^rustdoc 1\.99\.0 '
          printf '%s\n' "PATH=$task_bin:$PATH" 'RUSTUP_TOOLCHAIN=1.99.0' "RUSTC=$task_rustc" "RUSTDOC=$task_rustdoc" >> "$GITHUB_ENV"
      - name: Run benchmarks
        shell: bash
        run: |
          set -euo pipefail
          test -f Cargo.toml
          if [ -d benches ] || [ -d benchmarks ]; then
            cargo bench --workspace --all-features
          else
            echo "Missing benchmark harness: expected benches/ or benchmarks/ to exist."
            exit 1
          fi
      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-artifacts
          path: |
            target/criterion/**
            benchmarks/**
          if-no-files-found: error
