name: FAIR research software assessment

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: fair-software-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fair-software:
    name: FAIR software advisory assessment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Provision isolated assessment interpreter
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install pinned howfairis CLI
        run: python -m pip install --disable-pip-version-check howfairis==0.14.2
      - name: Assess public repository FAIR metadata
        continue-on-error: true
        run: howfairis "https://github.com/${{ github.repository }}"
