name: FAIR research software assessment

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: fair-software-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fair-software:
    name: FAIR software advisory assessment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Provision pinned isolated metadata tool
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.10.0"
      - name: Verify howfairis CLI is installable
        run: uvx --python 3.11 --from howfairis==0.14.2 howfairis --help
      - name: Assess public repository FAIR metadata
        continue-on-error: true
        run: uvx --python 3.11 --from howfairis==0.14.2 howfairis "https://github.com/${{ github.repository }}"
