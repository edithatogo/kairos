name: CI Policy

on:
  pull_request:
    paths:
      - ".github/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "deny.toml"
      - "rust-toolchain.toml"
  push:
    branches: [main]
    paths:
      - ".github/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "deny.toml"
      - "rust-toolchain.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy:
    name: Workflow and supply-chain policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Required CI files are present
        run: |
          test -f Cargo.toml
          test -f Cargo.lock
          test -f deny.toml
          test -f rust-toolchain.toml
          test -f .github/dependabot.yml
          test -f .github/workflows/actions-security.yml
          test -f .github/workflows/bench-regression.yml
          test -f .github/workflows/benchmark-smoke.yml
          test -f .github/workflows/benchmarks.yml
          test -f .github/workflows/changelog-policy.yml
          test -f .github/workflows/ci-bindings.yml
          test -f .github/workflows/ci-core.yml
          test -f .github/workflows/ci-policy.yml
          test -f .github/workflows/ci-skip-guard.yml
          test -f .github/workflows/cloud-smoke.yml
          test -f .github/workflows/codeql.yml
          test -f .github/workflows/conductor-assessment-reminder.yml
          test -f .github/workflows/conformance.yml
          test -f .github/workflows/dependency-review.yml
          test -f .github/workflows/docs-link-check.yml
          test -f .github/workflows/docs-quality.yml
          test -f .github/workflows/docs.yml
          test -f .github/workflows/fuzzing.yml
          test -f .github/workflows/nightly.yml
          test -f .github/workflows/package-dry-run.yml
          test -f .github/workflows/release-attestations.yml
          test -f .github/workflows/release-drafter.yml
          test -f .github/workflows/release-plz.yml
          test -f .github/workflows/release.yml
          test -f .github/workflows/scorecard.yml
          test -f .github/workflows/secret-scan.yml
          test -f .github/workflows/sbom-attestations.yml
          test -f .github/workflows/stale.yml
          test -f .github/workflows/toolchain-check.yml
          test -f .github/workflows/validate-conductor.yml
          test -f .github/workflows/workflow-security.yml
      - name: Workflow consistency policy
        run: |
          for f in .github/workflows/*.yml; do
            test -s "$f"
          done
          if grep -R -n -E "uses:[[:space:]]+[^@[:space:]]+@(main|master|latest|HEAD)\b" .github/workflows; then
            exit 1
          fi
          if find .github/workflows -name '*.yml' ! -name 'ci-policy.yml' -print0 | xargs -0 grep -n -E "if-no-files-found:[[:space:]]*ignore|--if-present|\|\| true"; then
            exit 1
          fi
      - name: Rust metadata and policy files
        run: |
          cargo metadata --no-deps --format-version 1 >/dev/null
          grep -n -E 'rust-version = "1\.76"' Cargo.toml
          grep -n -E 'channel = "stable"' rust-toolchain.toml
          grep -n -E 'wildcards = "deny"' deny.toml
          grep -n -E 'unknown-registry = "deny"' deny.toml
          grep -n -E 'unknown-git = "deny"' deny.toml
          grep -n -F 'allow-registry = ["https://github.com/rust-lang/crates.io-index"]' deny.toml
      - name: Cargo supply-chain checks
        run: |
          cargo install cargo-deny cargo-audit --locked
          cargo deny check
          cargo audit
