name: ci-core

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    name: Classify Rust changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.classify.outputs.rust }}
      fmi: ${{ steps.classify.outputs.fmi }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate Rust CI routing
        run: |
          node tests/conformance/classify-rust-ci-changes-check.mjs
          node tests/conformance/project-coverage-check.mjs
      - name: Classify changed files
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          node scripts/validation/classify-rust-ci-changes.mjs "$EVENT_NAME" "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"
          if git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- crates/kairo-ecs-fmi Cargo.toml Cargo.lock rust-toolchain.toml .github/workflows/ci-core.yml; then
            echo 'fmi=false' >> "$GITHUB_OUTPUT"
          else
            echo 'fmi=true' >> "$GITHUB_OUTPUT"
          fi

  rust-stable:
    name: Rust 1.99.1 verification
    if: needs.changes.outputs.rust == 'true'
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install current stable Rust 1.99.1
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install pinned cargo tools
        uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: |
            cargo-nextest@0.9.150
            cargo-deny@0.20.2
            cargo-audit@0.22.2
            cargo-llvm-cov@0.9.1
          fallback: none
      - name: Install native MPI build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libopenmpi-dev openmpi-bin libclang-dev
          mpiexec --version
      - name: Prepare pinned HDF5 library and independent reader
        run: bash scripts/prepare-hdf5-ci.sh
      - name: Prepare pinned ADIOS2 library and independent reader
        run: bash scripts/prepare-adios2-ci.sh
      - name: Verify workspace readiness
        run: |
          test -f Cargo.toml
          cargo metadata --no-deps --format-version 1 >/dev/null
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Reclaim non-coverage build artifacts
        run: |
          df -h "$GITHUB_WORKSPACE"
          cargo clean
          df -h "$GITHUB_WORKSPACE"
      - name: Workspace tests and core coverage
        env:
          CARGO_BUILD_JOBS: '2'
        shell: bash
        run: |
          set -euo pipefail
          fmi_dir="$(mktemp -d)"
          trap 'rm -rf "$fmi_dir"' EXIT
          curl --fail --silent --show-error --location \
            https://github.com/modelica/Reference-FMUs/releases/download/v0.0.42/Reference-FMUs.zip \
            -o "$fmi_dir/reference.zip"
          echo "b6b4a195b9c0f6bdd3459cd949cbb35fc21ee2049d6dab4cb7a3ba7da63b1e97  $fmi_dir/reference.zip" | sha256sum -c -
          unzip -q "$fmi_dir/reference.zip" '2.0/BouncingBall.fmu' '3.0/BouncingBall.fmu' 'LICENSE.txt' -d "$fmi_dir/reference"
          export KAIRO_REFERENCE_FMUS_DIR="$fmi_dir/reference"
          sha256sum "$fmi_dir/reference/"{2.0,3.0}/BouncingBall.fmu
          cargo llvm-cov clean --workspace
          cargo llvm-cov test --no-report --locked -p kairo-ecs-fmi --all-features \
            --test maturity_external_fmu bouncing_ball -- --ignored | tee "$fmi_dir/reference.log"
          grep -Fq 'test result: ok. 2 passed; 0 failed; 0 ignored' "$fmi_dir/reference.log"
          cargo llvm-cov test --no-report --locked -p kairo-ecs-arrow --features hdf5 \
            --test maturity_native_io_format h5dump -- --ignored --nocapture | tee "$RUNNER_TEMP/kairo-h5dump.log"
          grep -Fq 'test result: ok. 1 passed; 0 failed; 0 ignored' "$RUNNER_TEMP/kairo-h5dump.log"
          cargo llvm-cov test --no-report --locked -p kairo-ecs-arrow --features adios2 \
            --test maturity_native_adios2 bpls -- --ignored --nocapture | tee "$RUNNER_TEMP/kairo-bpls.log"
          grep -Fq 'test result: ok. 1 passed; 0 failed; 0 ignored' "$RUNNER_TEMP/kairo-bpls.log"
          cargo llvm-cov nextest --workspace --all-features --lcov --output-path lcov.info --no-clean
          node scripts/validation/check-core-coverage.mjs lcov.info
      - name: Capture runner resources after coverage
        if: always()
        run: |
          df -h "$GITHUB_WORKSPACE"
          free -h
          if [ -d target ]; then du -sh target; fi
          if [ -d target/llvm-cov-target ]; then du -sh target/llvm-cov-target; fi
      - name: Native MPI API exchange on two and four ranks
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p kairo-ecs-mpi --all-features --test native_mpi_smoke --no-run --message-format=json > native-mpi-build.jsonl
          native_mpi_test="$(jq -r 'select(.reason == "compiler-artifact" and .target.name == "native_mpi_smoke" and .executable != null) | .executable' native-mpi-build.jsonl)"
          test -x "$native_mpi_test"
          for ranks in 2 4; do
            timeout 60s mpiexec --oversubscribe -n "$ranks" "$native_mpi_test" --test-threads=1 --nocapture
          done
      - name: Preserve coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-coverage
          path: lcov.info
          if-no-files-found: error
      - name: Doctests
        run: cargo test --doc --workspace --all-features
      - name: Docs
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps
      - name: Dependency policy
        run: |
          test -f deny.toml
          cargo deny check advisories bans licenses sources
          cargo audit

  rust-msrv:
    name: Rust 1.99.1 workspace checks
    if: needs.changes.outputs.rust == 'true'
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust 1.99.1
        run: rustup toolchain install 1.99.1 --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install native MPI build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libopenmpi-dev openmpi-bin libclang-dev
          mpiexec --version
      - name: Independently built OpenModelica FMU
        if: needs.changes.outputs.fmi == 'true'
        shell: bash
        run: |
          set -euo pipefail
          fmi_dir="$(mktemp -d)"
          trap 'rm -rf "$fmi_dir"' EXIT
          cat > "$fmi_dir/KairosDecay.mo" <<'MODEL'
          model KairosDecay
            output Real x(start=1, fixed=true);
          equation
            der(x) = -x;
            when time >= 0.5 then
              reinit(x, 2);
            end when;
          end KairosDecay;
          MODEL
          cat > "$fmi_dir/build.mos" <<'SCRIPT'
          getVersion();
          loadFile("KairosDecay.mo");
          buildModelFMU(KairosDecay, version="2.0", fmuType="cs");
          getErrorString();
          SCRIPT
          sha256sum "$fmi_dir/KairosDecay.mo" "$fmi_dir/build.mos"
          docker run --rm --network none --user "$(id -u):$(id -g)" \
            --env HOME=/tmp --volume "$fmi_dir:/work" --workdir /work \
            openmodelica/openmodelica@sha256:1fa776fd2f03cdcfc03db6f6ac69888dd48c8eca442034495b178dc73b96dc40 \
            omc build.mos
          export KAIRO_OPENMODELICA_FMU="$fmi_dir/KairosDecay.fmu"
          test -s "$KAIRO_OPENMODELICA_FMU"
          sha256sum "$KAIRO_OPENMODELICA_FMU"
          cargo test --locked -p kairo-ecs-fmi --features fmi2 --test maturity_external_fmu openmodelica -- --ignored \
            | tee "$fmi_dir/openmodelica.log"
          grep -Fq 'test result: ok. 1 passed; 0 failed; 0 ignored' "$fmi_dir/openmodelica.log"
      - name: Check workspace on Rust 1.99.1
        run: cargo +1.99.1 check --workspace --exclude kairo-ecs-wasm --exclude kairo-ecs-arrow --lib --bins --all-features --locked
      - name: Check default Arrow telemetry on Rust 1.99.1
        run: cargo +1.99.1 check -p kairo-ecs-arrow --lib --locked

  rust-wasm-msrv:
    name: Rust 1.99.1 WebAssembly check
    if: needs.changes.outputs.rust == 'true'
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust 1.99.1 WebAssembly target
        run: rustup toolchain install 1.99.1 --profile minimal --target wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Check wasm-export on Rust 1.99.1
        run: cargo +1.99.1 check --locked --manifest-path crates/kairo-ecs-wasm/Cargo.toml --features wasm-export --target wasm32-unknown-unknown

  project-coverage:
    name: Rust project coverage
    if: needs.changes.outputs.rust == 'true'
    needs: [changes, rust-stable]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # Read the exact base commit's trusted main coverage artifact.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rust-coverage
      - name: Require zero workspace coverage regression against exact base
        env:
          GH_TOKEN: ${{ github.token }}
          COVERAGE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            # Read the immutable commit headers even in a shallow checkout.
            test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
            mapfile -t parents < <(git cat-file -p HEAD | sed -n '/^$/q; s/^parent //p')
            test "${#parents[@]}" -eq 2
            test "${parents[1]}" = "$PR_HEAD_SHA"
            export COVERAGE_BASE_SHA="${parents[0]}"
          fi
          node scripts/validation/check-project-coverage.mjs lcov.info
      - name: Preserve project coverage decision
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: project-coverage-decision
          path: artifacts/project-coverage/receipt.json
          if-no-files-found: error

  rust-core:
    name: Rust core quality
    if: always()
    needs: [changes, rust-stable, rust-msrv, rust-wasm-msrv, project-coverage]
    runs-on: ubuntu-latest
    steps:
      - name: Require Rust verification or a valid selective skip
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          RUST_REQUIRED: ${{ needs.changes.outputs.rust }}
          RUST_STABLE_RESULT: ${{ needs.rust-stable.result }}
          RUST_MSRV_RESULT: ${{ needs.rust-msrv.result }}
          RUST_WASM_MSRV_RESULT: ${{ needs.rust-wasm-msrv.result }}
          PROJECT_COVERAGE_RESULT: ${{ needs.project-coverage.result }}
        run: |
          set -euo pipefail
          test "$CHANGES_RESULT" = success
          case "$RUST_REQUIRED" in
            true)
              test "$RUST_STABLE_RESULT" = success
              test "$RUST_MSRV_RESULT" = success
              test "$RUST_WASM_MSRV_RESULT" = success
              test "$PROJECT_COVERAGE_RESULT" = success
              ;;
            false)
              test "$RUST_STABLE_RESULT" = skipped
              test "$RUST_MSRV_RESULT" = skipped
              test "$RUST_WASM_MSRV_RESULT" = skipped
              test "$PROJECT_COVERAGE_RESULT" = skipped
              ;;
            *)
              echo "Rust change classification did not produce true or false." >&2
              exit 1
              ;;
          esac

  codecov:
    name: Codecov OIDC upload
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [changes, rust-core]
    runs-on: ubuntu-latest
    permissions:
      actions: read # Download the coverage artifact produced by this run.
      contents: read # Read commit metadata for the coverage upload.
      id-token: write # Request a short-lived Codecov OIDC token; this job runs only on main pushes.
      pull-requests: read # Associate uploaded coverage with its pull request metadata.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rust-coverage
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: lcov.info
          flags: rust-core
          fail_ci_if_error: true
          use_oidc: true
