name: ci-core

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    name: Classify Rust changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.classify.outputs.rust }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify changed files
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == pull_request ]]; then
            changed_files="$(git diff --name-only --diff-filter=ACMRTUXB "$BASE_SHA...$HEAD_SHA")"
          elif [[ "$EVENT_NAME" == push ]]; then
            if [[ "$BASE_SHA" =~ ^0+$ ]]; then
              echo "Initial push has no comparison base; running Rust verification."
              echo "rust=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            changed_files="$(git diff --name-only --diff-filter=ACMRTUXB "$BASE_SHA" "$HEAD_SHA")"
          else
            echo "Unsupported event: $EVENT_NAME" >&2
            exit 1
          fi

          # Rust verification covers Rust source, Cargo inputs, Rust-owned test
          # fixtures, and the CI policy/scripts that define these checks.
          rust_required=false
          while IFS= read -r path; do
            [[ -n "$path" ]] || continue
            case "$path" in
              *.rs|Cargo.toml|Cargo.lock|*/Cargo.toml|*/Cargo.lock|deny.toml|rust-toolchain|rust-toolchain.toml|.cargo/*|*/.cargo/*|crates/*|fuzz/*|conformance/fixtures/*|scripts/validation/check-core-coverage.mjs|.github/workflows/ci-core.yml)
                rust_required=true
                break
                ;;
            esac
          done <<< "$changed_files"

          echo "rust=$rust_required" >> "$GITHUB_OUTPUT"

  rust-stable:
    name: Rust stable verification
    if: needs.changes.outputs.rust == 'true'
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install pinned cargo tools
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: |
            cargo-nextest@0.9.146
            cargo-deny@0.20.2
            cargo-audit@0.22.2
            cargo-llvm-cov@0.9.1
          fallback: none
      - name: Verify workspace readiness
        run: |
          test -f Cargo.toml
          cargo metadata --no-deps --format-version 1 >/dev/null
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Workspace tests and core coverage
        run: |
          cargo llvm-cov nextest --workspace --all-features --lcov --output-path lcov.info
          node scripts/validation/check-core-coverage.mjs lcov.info
      - name: Preserve coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-coverage
          path: lcov.info
          if-no-files-found: error
      - name: Doctests
        run: cargo test --doc --workspace --all-features
      - name: Docs
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps
      - name: Dependency policy
        run: |
          test -f deny.toml
          cargo deny check advisories sources
          cargo audit

  rust-msrv:
    name: Rust MSRV 1.76
    if: needs.changes.outputs.rust == 'true'
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install Rust MSRV
        run: rustup toolchain install 1.76.0 --profile minimal
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Check workspace on Rust 1.76
        run: cargo +1.76.0 check --workspace --exclude kairo-ecs-wasm --lib --bins --all-features --locked

  rust-wasm-msrv:
    name: Rust Wasm MSRV 1.77
    if: needs.changes.outputs.rust == 'true'
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install Rust Wasm MSRV
        run: rustup toolchain install 1.77.0 --profile minimal --target wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Check wasm-export on Rust 1.77
        run: cargo +1.77.0 check --locked --manifest-path crates/kairo-ecs-wasm/Cargo.toml --features wasm-export --target wasm32-unknown-unknown

  rust-core:
    name: Rust core quality
    if: always()
    needs: [changes, rust-stable, rust-msrv, rust-wasm-msrv]
    runs-on: ubuntu-latest
    steps:
      - name: Require Rust verification or an explicit skip
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          RUST_REQUIRED: ${{ needs.changes.outputs.rust }}
          RUST_STABLE_RESULT: ${{ needs.rust-stable.result }}
          RUST_MSRV_RESULT: ${{ needs.rust-msrv.result }}
          RUST_WASM_MSRV_RESULT: ${{ needs.rust-wasm-msrv.result }}
        run: |
          set -euo pipefail
          test "$CHANGES_RESULT" = success
          case "$RUST_REQUIRED" in
            true)
              test "$RUST_STABLE_RESULT" = success
              test "$RUST_MSRV_RESULT" = success
              test "$RUST_WASM_MSRV_RESULT" = success
              ;;
            false)
              test "$RUST_STABLE_RESULT" = skipped
              test "$RUST_MSRV_RESULT" = skipped
              test "$RUST_WASM_MSRV_RESULT" = skipped
              ;;
            *)
              echo "Rust change classification did not produce true or false." >&2
              exit 1
              ;;
          esac

  codecov:
    name: Codecov OIDC upload
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.rust == 'true'
    needs: [changes, rust-core]
    runs-on: ubuntu-latest
    permissions:
      actions: read # Download the coverage artifact produced by this run.
      contents: read # Read commit metadata for the coverage upload.
      id-token: write # Request a short-lived Codecov OIDC token; this job runs only on main pushes.
      pull-requests: read # Associate uploaded coverage with its pull request metadata.
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v7.0.0
        with:
          name: rust-coverage
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: lcov.info
          flags: rust-core
          fail_ci_if_error: true
          use_oidc: true
