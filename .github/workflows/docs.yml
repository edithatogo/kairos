name: docs

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-docs:
    name: build-docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Build docs
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          test -f website/package.json
          mkdir -p artifacts/website-cache-security
          node --version > artifacts/website-cache-security/node-version.txt
          npm --version > artifacts/website-cache-security/npm-version.txt
          test -f tests/test_website_http_cache_patch.py
          python3 -m unittest discover -s tests -p test_website_http_cache_patch.py -v > artifacts/website-cache-security/adapter-tests.log 2>&1
          npm ci --prefix website > artifacts/website-cache-security/install.log 2>&1
          npm audit --prefix website --audit-level=moderate --json > artifacts/website-cache-security/raw-audit.json
          python3 website/scripts/apply_http_cache_fix.py website/node_modules > artifacts/website-cache-security/mitigation.log
          node tests/http-cache-security-regression.mjs website/node_modules/http-cache-semantics/index.js > artifacts/website-cache-security/regression.log
          printf '%s\n' "$GITHUB_SHA" > artifacts/website-cache-security/source-commit.txt
          sha256sum website/package-lock.json website/scripts/apply_http_cache_fix.py scripts/bootstrap-node-tools/apply_http_cache_fix.py tests/http-cache-security-regression.mjs tests/test_website_http_cache_patch.py tests/fixtures/http-cache-semantics-4.3.0.tgz website/node_modules/http-cache-semantics/index.js > artifacts/website-cache-security/SHA256SUMS
          npm --prefix website run build
      - name: Retain website cache security evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: website-cache-security-${{ github.workflow }}-${{ github.run_id }}
          path: artifacts/website-cache-security
          if-no-files-found: error
          retention-days: 14
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/build
  deploy:
    name: deploy-pages
    needs: build-docs
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write # Needed to publish the generated Pages artifact.
      id-token: write # Needed for GitHub Pages OIDC deployment.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
