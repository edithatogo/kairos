name: Dependency Review

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  pull_request:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - 'bindings/**'
      - 'website/package.json'
      - 'package.json'
      - 'package-lock.json'
      - 'pnpm-lock.yaml'
      - 'yarn.lock'
      - '.github/workflows/**'
      - 'scripts/bootstrap-node-tools/**'
      - 'scripts/validate_dependency_identity.py'
      - 'tests/test_dependency_identity.py'
      - 'vendor/**'

permissions:
  contents: read
  pull-requests: read # Needed to compare dependency manifests in pull requests.

jobs:
  dependency-review:
    name: dependency-review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.15.2" }
      - name: Verify repository-local Python 3.15.2
        run: python scripts/python_runtime.py --github
      - name: Test dependency identity control
        run: python3 -m unittest discover -s tests -p test_dependency_identity.py -v
      - name: Enforce high vulnerability threshold with pinned alias identity
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p artifacts/dependency-review
          gh api --paginate --slurp "repos/$GH_REPO/dependency-graph/compare/$BASE_SHA...$HEAD_SHA" > artifacts/dependency-review/raw.json
          python3 scripts/validate_dependency_identity.py artifacts/dependency-review/raw.json > artifacts/dependency-review/result.json
      - name: Retain dependency identity evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-identity-evidence
          path: artifacts/dependency-review/
          if-no-files-found: error
      - name: Dependency Review
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high
          vulnerability-check: false # Enforced above with exact private alias identity; license review remains enabled.
          comment-summary-in-pr: always
