name: Package Dry Runs

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  pull_request:
    paths:
      - 'crates/**'
      - 'bindings/**'
      - 'scripts/bootstrap-node-tools/package.json'
      - 'scripts/bootstrap-node-tools/package-lock.json'
      - 'scripts/bootstrap-node-tools/prepare_npm_cli.py'
      - 'scripts/bootstrap-node-tools/validate_npm_cli.mjs'
      - 'scripts/bootstrap-node-tools/run_strict_npm_audit_gate.py'
      - 'tests/test_strict_npm_audit_runner.py'
      - 'tests/test_strict_npm_audit_workflow.py'
      - 'tests/http-cache-private-vendor-regression.mjs'
      - 'tests/http-cache-connection-regression.mjs'
      - 'vendor/http-cache-semantics-kairos-prototype/**'
      - 'vendor/http-cache-semantics-kairos-prototype-0.1.0.tgz'
      - 'scripts/bootstrap-node-tools/apply_http_cache_fix.py'
      - 'scripts/bootstrap-node-tools/run_npm_audit_gate.py'
      - 'conductor/tracks/20-openssf-supply-chain-institutional-trust/exceptions/**'
      - 'tests/test_npm_audit_exception.py'
      - 'tests/test_npm_audit_runner.py'
      - 'tests/test_http_cache_patch.py'
      - 'tests/http-cache-security-regression.mjs'
      - 'tests/http-cache-legacy-60-regression.mjs'
      - 'scripts/bootstrap.sh'
      - 'scripts/bootstrap-python-tools.lock'
      - 'scripts/package-python-tools.in'
      - 'scripts/package-python-tools.lock'
      - 'packaging/scripts/build_package_archive_bundle.py'
      - 'packaging/scripts/write_package_build_receipt.py'
      - 'tests/test_package_archive_bundle.py'
      - 'tests/test_package_archive_attestation_workflow.py'
      - 'tools/docs-quality-node-tools/package.json'
      - 'tools/docs-quality-node-tools/package-lock.json'
      - '.github/workflows/package-dry-run.yml'
  workflow_dispatch:
    inputs:
      attest_archives:
        description: Upload signed provenance for retained archives to GitHub Attestations (no package publication)
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  rust-package:
    name: rust-package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust 1.99.0
        run: |
          rustup toolchain install 1.99.0 --profile minimal
      - name: Bind Rust 1.99.0 tools
        shell: bash
        run: |
          task_rustc="$(rustup which --toolchain 1.99.0 rustc)"
          task_bin="$(dirname "$task_rustc")"
          task_cargo="$(rustup which --toolchain 1.99.0 cargo)"
          task_rustdoc="$(rustup which --toolchain 1.99.0 rustdoc)"
          "$task_cargo" -V | grep -E '^cargo 1\.99\.0 '
          "$task_rustc" -V | grep -E '^rustc 1\.99\.0 '
          "$task_rustdoc" -V | grep -E '^rustdoc 1\.99\.0 '
          printf '%s\n' "PATH=$task_bin:$PATH" 'RUSTUP_TOOLCHAIN=1.99.0' "RUSTC=$task_rustc" "RUSTDOC=$task_rustdoc" >> "$GITHUB_ENV"
      - name: Cargo package dry run
        run: |
          test -f Cargo.toml
          test -f crates/kairo-ecs-core/Cargo.toml
          test -f crates/kairo-ecs-rng/Cargo.toml
          test -f crates/kairo-ecs-state/Cargo.toml
          test -f crates/kairo-ecs-types/Cargo.toml
          cargo package --locked --allow-dirty -p kairo-ecs-types
          mkdir -p dist/packages/rust
          cp target/package/kairo-ecs-types-*.crate dist/packages/rust/
          python3 packaging/scripts/write_package_build_receipt.py --ecosystem rust --archive-dir dist/packages/rust --source-commit "$GITHUB_SHA" --command 'cargo package --locked --allow-dirty -p kairo-ecs-types' --toolchain "$(rustc --version); $(cargo --version)"
          python packaging/scripts/build_release_manifest.py --check
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kairos-package-rust
          path: dist/packages/rust/
          if-no-files-found: error
          retention-days: 7
  python-package:
    name: python-package (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Python package dry run
        run: |
          test -f bindings/python/pyproject.toml
          test -d bindings/python/kairo_ecs
          python -m pip install --require-hashes -r "$GITHUB_WORKSPACE/scripts/package-python-tools.lock"
          cd bindings/python
          python -m build --no-isolation --outdir "$GITHUB_WORKSPACE/dist/packages/python"
          python -m twine check "$GITHUB_WORKSPACE"/dist/packages/python/*
          cd "$GITHUB_WORKSPACE"
          python3 packaging/scripts/write_package_build_receipt.py --ecosystem python --archive-dir dist/packages/python --source-commit "$GITHUB_SHA" --command 'python -m build --no-isolation; python -m twine check' --toolchain "$(python --version); $(python -m build --version); $(python -m twine --version)"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kairos-package-python
          path: dist/packages/python/
          if-no-files-found: error
          retention-days: 7
  r-package:
    name: r-package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Ensure R is available
        run: |
          if ! command -v Rscript >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends r-base-core
          fi
          Rscript --version
      - name: R package dry run
        run: |
          test -f bindings/r/DESCRIPTION
          test -f bindings/r/NAMESPACE
          test -d bindings/r/R
          cd bindings/r
          R CMD build .
          _R_CHECK_FORCE_SUGGESTS_=false R CMD check --no-manual --no-tests ./*.tar.gz
          mkdir -p "$GITHUB_WORKSPACE/dist/packages/r"
          cp ./*.tar.gz "$GITHUB_WORKSPACE/dist/packages/r/"
          cd "$GITHUB_WORKSPACE"
          python3 packaging/scripts/write_package_build_receipt.py --ecosystem r --archive-dir dist/packages/r --source-commit "$GITHUB_SHA" --command 'R CMD build; R CMD check --no-manual --no-tests' --toolchain "$(R --version | head -n 1)" --validation-notes 'R CMD check completed with one NOTE for unavailable optional suggested packages; package tests skipped by the specified --no-tests workflow command.'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kairos-package-r
          path: dist/packages/r/
          if-no-files-found: error
          retention-days: 7
  npm-package:
    name: npm-package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: '22.23.3' }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: '3.14.8' }
      - name: Create fail-closed npm audit marker
        run: |
          mkdir -p artifacts/npm-audit-gate
          python3 - <<'PYTHON'
          import json
          from pathlib import Path
          Path("artifacts/npm-audit-gate/receipt.json").write_text(json.dumps({"classification": "failed", "raw_audit": {"status": "not_executed"}, "record_kind": "initial_pre_run_fail_closed_marker", "reason": "preparation or tests have not completed"}, separators=(",", ":")) + "\n")
          PYTHON
      - name: Prepare pinned npm CLI
        run: python3 scripts/bootstrap-node-tools/prepare_npm_cli.py --check
      - name: Install locked bootstrap dependencies
        run: npm ci --ignore-scripts --prefix scripts/bootstrap-node-tools
      - name: Test strict npm audit runner
        run: python3 -m unittest discover -s tests -p test_strict_npm_audit_runner.py -v
      - name: Test package workflow contract
        run: python3 -m unittest discover -s tests -p test_strict_npm_audit_workflow.py -v
      - name: Resolve and hash setup-node executable
        run: |
          set -eu
          KAIROS_NODE_BIN="$(realpath "$(command -v node)")"
          KAIROS_NODE_SHA256="$(sha256sum "$KAIROS_NODE_BIN" | awk '{print $1}')"
          test -x "$KAIROS_NODE_BIN"
          printf 'KAIROS_NODE_BIN=%s\nKAIROS_NODE_SHA256=%s\n' "$KAIROS_NODE_BIN" "$KAIROS_NODE_SHA256" >> "$GITHUB_ENV"
      - name: Run preserved 60-case cache regression
        run: |
          "$KAIROS_NODE_BIN" tests/http-cache-legacy-60-regression.mjs
      - name: Run qualified 248-case private-vendor regression
        run: |
          "$KAIROS_NODE_BIN" tests/http-cache-private-vendor-regression.mjs scripts/bootstrap-node-tools/node_modules/http-cache-semantics/index.js
      - name: Run Connection header hardening regression
        run: '"$KAIROS_NODE_BIN" tests/http-cache-connection-regression.mjs scripts/bootstrap-node-tools/node_modules/http-cache-semantics/index.js'
      - name: Verify installed npm signatures
        run: |
          mkdir -p artifacts/npm-audit-gate
          "$KAIROS_NODE_BIN" scripts/bootstrap-node-tools/node_modules/npm/bin/npm-cli.js audit signatures --prefix scripts/bootstrap-node-tools --registry=https://registry.npmjs.org/ --update-notifier=false > artifacts/npm-audit-gate/signatures.stdout 2> artifacts/npm-audit-gate/signatures.stderr
      - name: Run strict private-tree npm audit
        run: python3 scripts/bootstrap-node-tools/run_strict_npm_audit_gate.py --node-path "$KAIROS_NODE_BIN" --node-sha256 "$KAIROS_NODE_SHA256"
      - name: Publish strict success receipt at root
        if: success()
        run: |
          cp -- artifacts/npm-audit-gate/strict/receipt.json artifacts/npm-audit-gate/receipt.json
          cmp -s artifacts/npm-audit-gate/strict/receipt.json artifacts/npm-audit-gate/receipt.json
      - name: Build TypeScript package
        run: |
          test -f bindings/typescript/package.json
          test -f bindings/typescript/tsconfig.json
          test -d bindings/typescript/src
          cd bindings/typescript
          npm ci --ignore-scripts
          npm run build
          # Build once explicitly; ignore scripts prevents npm pack lifecycle rebuilds.
          mkdir -p "$GITHUB_WORKSPACE/dist/packages/typescript"
          npm pack --ignore-scripts --pack-destination "$GITHUB_WORKSPACE/dist/packages/typescript"
          cd "$GITHUB_WORKSPACE"
          python3 packaging/scripts/write_package_build_receipt.py --ecosystem typescript --archive-dir dist/packages/typescript --source-commit "$GITHUB_SHA" --command 'npm ci --ignore-scripts; npm run build; npm pack --ignore-scripts' --toolchain "$(node --version); $(npm --version)"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kairos-package-typescript
          path: dist/packages/typescript/
          if-no-files-found: error
          retention-days: 7
      - name: Retain raw npm audit and policy classification
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kairos-bootstrap-npm-audit
          path: artifacts/npm-audit-gate/
          if-no-files-found: error
          retention-days: 7
  nuget-package:
    name: nuget-package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with: { dotnet-version: '10.0.401' }
      - name: dotnet pack dry run
        run: |
          test -f bindings/csharp/Kairo.ECS.sln
          test -f bindings/csharp/src/Kairo.ECS/Kairo.ECS.csproj
          dotnet restore bindings/csharp/src/Kairo.ECS/Kairo.ECS.csproj -p:TargetFrameworks=net10.0 --locked-mode -p:UseSharedCompilation=false -m:1 -nr:false
          mkdir -p "$GITHUB_WORKSPACE/dist/packages/nuget"
          dotnet pack bindings/csharp/src/Kairo.ECS/Kairo.ECS.csproj -c Release -p:TargetFrameworks=net10.0 --no-restore -p:RestoreLockedMode=true -p:UseSharedCompilation=false -m:1 -nr:false -o "$GITHUB_WORKSPACE/dist/packages/nuget"
          python3 packaging/scripts/write_package_build_receipt.py --ecosystem nuget --archive-dir dist/packages/nuget --source-commit "$GITHUB_SHA" --command 'dotnet restore --locked-mode; dotnet pack -c Release -p:TargetFrameworks=net10.0 --no-restore' --toolchain "dotnet $(dotnet --version)"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kairos-package-nuget
          path: dist/packages/nuget/
          if-no-files-found: error
          retention-days: 7

  julia-package:
    name: julia-source-archive
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Archive Julia package source
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' bindings/julia/Project.toml)
          mkdir -p dist/packages/julia
          git archive --format=tar --prefix="KairoECS-${version}-source/" "${GITHUB_SHA}:bindings/julia" | gzip -n > "dist/packages/julia/KairoECS-${version}-source.tar.gz"
          python3 packaging/scripts/write_package_build_receipt.py --ecosystem julia --archive-dir dist/packages/julia --source-commit "$GITHUB_SHA" --command 'git archive bindings/julia; gzip -n' --toolchain "$(git --version); $(gzip --version | head -n 1)" --validation-notes 'Julia package tests run in the required ci-bindings workflow.'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kairos-package-julia
          path: dist/packages/julia/
          if-no-files-found: error
          retention-days: 7

  go-package:
    name: go-source-archive
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Archive Go module source
        run: |
          mkdir -p dist/packages/go
          git archive --format=tar --prefix="kairos-go-${GITHUB_SHA::12}/" "${GITHUB_SHA}:bindings/go" | gzip -n > "dist/packages/go/kairos-go-${GITHUB_SHA::12}-source.tar.gz"
          python3 packaging/scripts/write_package_build_receipt.py --ecosystem go --archive-dir dist/packages/go --source-commit "$GITHUB_SHA" --command 'git archive bindings/go; gzip -n' --toolchain "$(git --version); $(gzip --version | head -n 1)" --validation-notes 'Go module tests and vet run in the required ci-bindings workflow.'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kairos-package-go
          path: dist/packages/go/
          if-no-files-found: error
          retention-days: 7

  retain-package-archives:
    name: verify-and-retain-package-archives
    needs: [rust-package, python-package, r-package, npm-package, nuget-package, julia-package, go-package]
    runs-on: ubuntu-latest
    permissions:
      actions: read # Read this run's artifact metadata and download its artifacts.
      contents: read # Read the checked-out source for archive validation.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: kairos-package-*
          path: dist/package-archives
      - name: Validate archives and write SHA-256 index
        run: |
          python3 packaging/scripts/build_package_archive_bundle.py \
            --input dist/package-archives \
            --output dist/retained-package-archives \
            --source-commit "$GITHUB_SHA"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kairos-actual-package-archives-${{ github.sha }}
          path: dist/retained-package-archives/
          if-no-files-found: error
          retention-days: 90

  attest-retained-archives:
    name: attest-retained-package-archives
    needs: [retain-package-archives]
    if: inputs.attest_archives == true && github.event_name == 'workflow_dispatch' && github.repository == 'edithatogo/kairos' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read # Download the exact retained artifact from this workflow run.
      attestations: write # Upload signed provenance to the repository Attestations API.
      contents: read # Check out and run the pinned archive verifier.
      id-token: write # Request the short-lived Sigstore signing identity.
    steps:
      - name: Recheck opt-in trusted main invocation
        shell: bash
        env:
          ATTEST_ARCHIVES: ${{ inputs.attest_archives }}
        run: |
          set -euo pipefail
          [[ "$ATTEST_ARCHIVES" == true ]]
          [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]
          [[ "$GITHUB_REPOSITORY" == edithatogo/kairos ]]
          [[ "$GITHUB_REF" == refs/heads/main ]]
          [[ "$GITHUB_SHA" == "$GITHUB_WORKFLOW_SHA" ]]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: kairos-actual-package-archives-${{ github.sha }}
          path: dist/retained-package-archives
      - name: Reverify exact source-bound archive tree
        run: >-
          python3 packaging/scripts/build_package_archive_bundle.py
          --verify-existing
          --output dist/retained-package-archives
          --source-commit "$GITHUB_SHA"
      - name: Project exact archive checksums to workspace-relative subjects
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import hashlib
          import json
          import os
          import re
          from collections import Counter
          from pathlib import Path, PurePosixPath

          def unique_object(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError(f'duplicate JSON key: {key}')
                  result[key] = value
              return result

          source_sha = os.environ['GITHUB_SHA']
          if not re.fullmatch(r'[0-9a-f]{40}', source_sha):
              raise SystemExit('workflow source SHA must be a full lowercase Git commit')
          workspace = Path(os.environ['GITHUB_WORKSPACE']).resolve(strict=True)
          dist_root = workspace / 'dist'
          archive_root = dist_root / 'retained-package-archives'
          if dist_root.is_symlink() or not dist_root.is_dir() or archive_root.is_symlink() or not archive_root.is_dir():
              raise SystemExit('retained archive root or parent is missing or symlinked')
          archive_root_real = archive_root.resolve(strict=True)
          if not archive_root_real.is_relative_to(workspace):
              raise SystemExit('retained archive root escapes the checkout')
          index_path = archive_root / 'ARCHIVE-INDEX.json'
          sums_path = archive_root / 'SHA256SUMS'
          if index_path.is_symlink() or sums_path.is_symlink():
              raise SystemExit('retained archive metadata must not be symlinks')
          index_bytes = index_path.read_bytes()
          index = json.loads(index_bytes, object_pairs_hook=unique_object)
          if index.get('schema_version') != 1 or index.get('source_commit') != source_sha:
              raise SystemExit('archive index schema or source commit does not match this workflow run')
          artifacts = index.get('artifacts')
          expected_counts = {'rust': 1, 'python': 2, 'r': 1, 'julia': 1, 'typescript': 1, 'nuget': 1, 'go': 1}
          expected_kinds = {'rust': 'crate', 'python': 'python-distribution', 'r': 'r-source-package', 'julia': 'julia-source-archive', 'typescript': 'npm-package', 'nuget': 'nuget-package', 'go': 'go-source-archive'}
          if not isinstance(artifacts, list) or len(artifacts) != 8:
              raise SystemExit('archive index must contain exactly eight package archives')
          if Counter(row.get('ecosystem') for row in artifacts if isinstance(row, dict)) != Counter(expected_counts):
              raise SystemExit('archive index must contain the exact seven ecosystems with Python wheel and sdist')
          generated = []
          seen_paths = set()
          python_suffixes = []
          expected_suffixes = {'rust': ('.crate',), 'python': ('.whl', '.tar.gz'), 'r': ('.tar.gz',), 'julia': ('.tar.gz',), 'typescript': ('.tgz',), 'nuget': ('.nupkg',), 'go': ('.tar.gz',)}
          for row in artifacts:
              if not isinstance(row, dict):
                  raise SystemExit('archive index entry must be an object')
              ecosystem = row.get('ecosystem')
              relative = row.get('path')
              digest = row.get('sha256')
              size = row.get('bytes')
              if ecosystem not in expected_counts or row.get('kind') != expected_kinds[ecosystem]:
                  raise SystemExit('archive index contains an unexpected ecosystem or archive kind')
              if not isinstance(relative, str) or not relative or '\\' in relative or ':' in relative:
                  raise SystemExit('archive index path is not a canonical POSIX path')
              relpath = PurePosixPath(relative)
              if relpath.is_absolute() or '..' in relpath.parts or relpath.as_posix() != relative or len(relpath.parts) != 2 or relpath.parts[0] != ecosystem:
                  raise SystemExit('archive index path escapes or mismatches its ecosystem')
              filename = relpath.name
              if not re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9._+-]*', filename):
                  raise SystemExit('archive filename is not a portable basename')
              if not any(filename.endswith(suffix) for suffix in expected_suffixes[ecosystem]):
                  raise SystemExit('archive filename suffix does not match its ecosystem')
              if ecosystem == 'python':
                  python_suffixes.append('.whl' if filename.endswith('.whl') else '.tar.gz')
              if relative in seen_paths:
                  raise SystemExit('archive index contains duplicate archive paths')
              if not isinstance(digest, str) or not re.fullmatch(r'[0-9a-f]{64}', digest):
                  raise SystemExit('archive index SHA-256 is malformed')
              if type(size) is not int or size <= 0:
                  raise SystemExit('archive index byte count is invalid')
              ecosystem_root = archive_root / ecosystem
              path = archive_root / relative
              if ecosystem_root.is_symlink() or not ecosystem_root.is_dir() or path.is_symlink() or not path.is_file():
                  raise SystemExit('indexed archive or ecosystem directory is missing or symlinked')
              if not path.resolve(strict=True).is_relative_to(archive_root_real):
                  raise SystemExit('indexed archive escapes the retained bundle')
              if path.stat().st_size != size:
                  raise SystemExit('indexed archive byte count changed')
              hasher = hashlib.sha256()
              with path.open('rb') as stream:
                  for block in iter(lambda: stream.read(1024 * 1024), b''):
                      hasher.update(block)
              if hasher.hexdigest() != digest:
                  raise SystemExit('indexed archive digest changed')
              workspace_relative = f'dist/retained-package-archives/{relative}'
              generated.append(f'{digest}  {workspace_relative}\n')
              seen_paths.add(relative)
          if Counter(python_suffixes) != Counter({'.whl': 1, '.tar.gz': 1}):
              raise SystemExit('Python archive set must contain exactly one wheel and one sdist')
          expected_sums = ''.join(f"{row['sha256']}  {row['path']}\n" for row in artifacts)
          if sums_path.read_text(encoding='utf-8') != expected_sums:
              raise SystemExit('original SHA256SUMS does not match the verified index')
          evidence_dir = workspace / 'dist/package-provenance-evidence'
          evidence_dir.mkdir(mode=0o700)
          files = {
              'ARCHIVE-INDEX.json': index_bytes,
              'SHA256SUMS': sums_path.read_bytes(),
              'package-archive-subjects.sha256': ''.join(generated).encode('ascii'),
          }
          for name, content in files.items():
              with (evidence_dir / name).open('xb') as stream:
                  stream.write(content)
          PY
      # This step uploads signed metadata to the GitHub Attestations API. It is opt-in and does not publish packages.
      - id: archive-attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/package-provenance-evidence/package-archive-subjects.sha256
          push-to-registry: false
          create-storage-record: false
          show-summary: true
      - name: Preserve action bundle with exact subject inputs
        shell: bash
        env:
          ATTESTATION_BUNDLE_PATH: ${{ steps.archive-attestation.outputs.bundle-path }}
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import os
          import shutil
          from pathlib import Path

          source = Path(os.environ['ATTESTATION_BUNDLE_PATH'])
          target = Path('dist/package-provenance-evidence/attestation.bundle.json')
          if source.is_symlink() or not source.is_file() or not 0 < source.stat().st_size <= 16 * 1024 * 1024:
              raise SystemExit('attestation action bundle output is missing, oversized, or unsafe')
          with source.open('rb') as incoming, target.open('xb') as outgoing:
              shutil.copyfileobj(incoming, outgoing, length=1024 * 1024)
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kairos-package-archive-provenance-${{ github.sha }}
          path: dist/package-provenance-evidence/
          if-no-files-found: error
          retention-days: 90
