name: Package Dry Runs

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  pull_request:
    paths:
      - 'crates/**'
      - 'bindings/**'
      - 'scripts/bootstrap-node-tools/package.json'
      - 'scripts/bootstrap-node-tools/package-lock.json'
      - 'scripts/bootstrap-node-tools/prepare_npm_cli.py'
      - 'scripts/bootstrap-node-tools/validate_npm_cli.mjs'
      - 'scripts/bootstrap.sh'
      - 'scripts/bootstrap-python-tools.lock'
      - 'scripts/package-python-tools.in'
      - 'scripts/package-python-tools.lock'
      - 'tools/docs-quality-node-tools/package.json'
      - 'tools/docs-quality-node-tools/package-lock.json'
      - '.github/workflows/package-dry-run.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-package:
    name: rust-package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Cargo package dry run
        run: |
          test -f Cargo.toml
          test -f crates/kairo-ecs-core/Cargo.toml
          test -f crates/kairo-ecs-rng/Cargo.toml
          test -f crates/kairo-ecs-state/Cargo.toml
          test -f crates/kairo-ecs-types/Cargo.toml
          cargo package --allow-dirty -p kairo-ecs-types
          python packaging/scripts/build_release_manifest.py --check
  python-package:
    name: python-package (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Python package dry run
        run: |
          test -f bindings/python/pyproject.toml
          test -d bindings/python/kairo_ecs
          python -m pip install --require-hashes -r "$GITHUB_WORKSPACE/scripts/package-python-tools.lock"
          cd bindings/python
          python -m build --no-isolation
          twine check ./dist/*
  r-package:
    name: r-package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Ensure R is available
        run: |
          if ! command -v Rscript >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends r-base-core
          fi
          Rscript --version
      - name: R package dry run
        run: |
          test -f bindings/r/DESCRIPTION
          test -f bindings/r/NAMESPACE
          test -d bindings/r/R
          cd bindings/r
          R CMD build .
          _R_CHECK_FORCE_SUGGESTS_=false R CMD check --no-manual --no-tests ./*.tar.gz
  npm-package:
    name: npm-package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: '22.22.2' }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: '3.14' }
      - name: npm pack dry run
        run: |
          python3 scripts/bootstrap-node-tools/prepare_npm_cli.py --check
          npm ci --ignore-scripts --prefix scripts/bootstrap-node-tools
          node scripts/bootstrap-node-tools/node_modules/npm/bin/npm-cli.js --version
          node scripts/bootstrap-node-tools/node_modules/npm/bin/npm-cli.js help >/dev/null
          node scripts/bootstrap-node-tools/validate_npm_cli.mjs
          node scripts/bootstrap-node-tools/node_modules/npm/bin/npm-cli.js audit --prefix scripts/bootstrap-node-tools --audit-level=moderate
          node scripts/bootstrap-node-tools/node_modules/npm/bin/npm-cli.js audit signatures --prefix scripts/bootstrap-node-tools
          test -f bindings/typescript/package.json
          test -f bindings/typescript/tsconfig.json
          test -d bindings/typescript/src
          cd bindings/typescript
          npm ci --ignore-scripts
          npm run build
          # Build once explicitly; ignore scripts prevents npm pack lifecycle rebuilds.
          npm pack --dry-run --ignore-scripts
  nuget-package:
    name: nuget-package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with: { dotnet-version: '10.0.x' }
      - name: dotnet pack dry run
        run: |
          test -f bindings/csharp/Kairo.ECS.sln
          test -f bindings/csharp/src/Kairo.ECS/Kairo.ECS.csproj
          dotnet restore bindings/csharp/src/Kairo.ECS/Kairo.ECS.csproj -p:TargetFrameworks=net10.0 --locked-mode -p:UseSharedCompilation=false -m:1 -nr:false
          dotnet pack bindings/csharp/src/Kairo.ECS/Kairo.ECS.csproj -c Release -p:TargetFrameworks=net10.0 --no-restore -p:RestoreLockedMode=true -p:UseSharedCompilation=false -m:1 -nr:false
