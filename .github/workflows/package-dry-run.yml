name: Package Dry Runs

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  pull_request:
    paths:
      - 'crates/**'
      - 'bindings/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-package:
    name: rust-package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Cargo package dry run
        run: |
          test -f Cargo.toml
          test -f crates/kairo-ecs-core/Cargo.toml
          test -f crates/kairo-ecs-rng/Cargo.toml
          test -f crates/kairo-ecs-state/Cargo.toml
          test -f crates/kairo-ecs-types/Cargo.toml
          cargo metadata --no-deps --format-version 1 >/dev/null
          cargo test --workspace --all-features --no-run
          cargo package --allow-dirty -p kairo-ecs-types
          python packaging/scripts/build_release_manifest.py --check
  python-package:
    name: python-package (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Python package dry run
        run: |
          test -f bindings/python/pyproject.toml
          test -d bindings/python/kairo_ecs
          python -m pip install -U build twine
          cd bindings/python
          python -m build
          twine check ./dist/*
  r-package:
    name: r-package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Ensure R is available
        run: |
          if ! command -v Rscript >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends r-base-core
          fi
          Rscript --version
      - name: R package dry run
        run: |
          test -f bindings/r/DESCRIPTION
          test -f bindings/r/NAMESPACE
          test -d bindings/r/R
          cd bindings/r
          R CMD build .
          _R_CHECK_FORCE_SUGGESTS_=false R CMD check --no-manual --no-tests ./*.tar.gz
  julia-package:
    name: julia-package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3.0.2
        with:
          version: '1'
      - name: Julia package dry run
        run: |
          test -f bindings/julia/Project.toml
          test -d bindings/julia/src
          test -d bindings/julia/test
          cd bindings/julia
          julia --project=. -e 'using Pkg; Pkg.instantiate(); Pkg.test()'
  go-package:
    name: go-package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.27.1'
      - name: Go package dry run
        run: |
          test -f bindings/go/go.mod
          test -f bindings/go/kairoecs.go
          test -f bindings/go/kairoecs_test.go
          cd bindings/go
          go test ./...
          go vet ./...
  npm-package:
    name: npm-package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with: { node-version: '24.21.0' }
      - name: npm pack dry run
        run: |
          test -f bindings/typescript/package.json
          test -f bindings/typescript/tsconfig.json
          test -d bindings/typescript/src
          cd bindings/typescript
          npm ci
          npm run typecheck
          npm test
          npm pack --dry-run
  nuget-package:
    name: nuget-package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with: { dotnet-version: '10.0.x' }
      - name: dotnet pack dry run
        run: |
          test -f bindings/csharp/Kairo.ECS.sln
          test -f bindings/csharp/src/Kairo.ECS/Kairo.ECS.csproj
          test -f bindings/csharp/tests/Kairo.ECS.Tests/Kairo.ECS.Tests.csproj
          dotnet restore bindings/csharp/tests/Kairo.ECS.Tests/Kairo.ECS.Tests.csproj -p:TargetFramework=net10.0 -p:UseSharedCompilation=false -m:1 -nr:false
          dotnet test bindings/csharp/tests/Kairo.ECS.Tests/Kairo.ECS.Tests.csproj -c Release -f net10.0 --no-restore -p:UseSharedCompilation=false -m:1 -nr:false
          dotnet pack bindings/csharp/src/Kairo.ECS/Kairo.ECS.csproj -c Release -p:TargetFrameworks=net10.0 --no-restore -p:UseSharedCompilation=false -m:1 -nr:false
