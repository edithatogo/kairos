name: Package Dry Runs

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  pull_request:
    paths:
      - 'crates/**'
      - 'bindings/**'
      - 'templates/**'
      - '.github/workflows/package-dry-run.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: stable
      - name: Cargo package dry run
        run: |
          test -f Cargo.toml
          test -f crates/kairo-ecs-core/Cargo.toml
          test -f crates/kairo-ecs-rng/Cargo.toml
          test -f crates/kairo-ecs-state/Cargo.toml
          test -f crates/kairo-ecs-types/Cargo.toml
          cargo metadata --no-deps --format-version 1 >/dev/null
          cargo test --workspace --all-features --no-run
          cargo package --allow-dirty --workspace
          cargo publish --dry-run --workspace
  python-package:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: ${{ matrix.python-version }}
      - name: Python package dry run
        run: |
          test -f bindings/python/pyproject.toml
          test -d bindings/python/kairo_ecs
          python -m pip install -U build twine
          cd bindings/python
          python -m build
          twine check ./dist/*
  r-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: r-lib/actions/setup-r@a51a8012b0aab7c32ef9d19bf54da93f3254335e
      - name: R package dry run
        run: |
          test -f bindings/r/DESCRIPTION
          test -f bindings/r/NAMESPACE
          test -d bindings/r/R
          cd bindings/r
          R CMD build .
          R CMD check --no-manual --as-cran ./*.tar.gz
  julia-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@f6f565d9f7cf12f53dc8045742460d6260ad3b39
        with:
          version: '1'
      - name: Julia package dry run
        run: |
          test -f bindings/julia/Project.toml
          test -d bindings/julia/src
          test -d bindings/julia/test
          cd bindings/julia
          julia --project=. -e 'using Pkg; Pkg.instantiate(); Pkg.test()'
  go-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version: '1.25.x'
      - name: Go package dry run
        run: |
          test -f bindings/go/go.mod
          test -f bindings/go/kairoecs.go
          test -f bindings/go/kairoecs_test.go
          cd bindings/go
          go test ./...
          go vet ./...
  npm-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with: { node-version: '24' }
      - name: npm pack dry run
        run: |
          test -f bindings/typescript/package.json
          test -f bindings/typescript/tsconfig.json
          test -d bindings/typescript/src
          cd bindings/typescript
          npm ci
          npm run typecheck
          npm test
          npm pack --dry-run
  nuget-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7
        with: { dotnet-version: '10.0.x' }
      - name: dotnet pack dry run
        run: |
          test -f bindings/csharp/Kairo.ECS.sln
          test -f bindings/csharp/src/Kairo.ECS/Kairo.ECS.csproj
          test -f bindings/csharp/tests/Kairo.ECS.Tests/Kairo.ECS.Tests.csproj
          dotnet restore bindings/csharp/Kairo.ECS.sln
          dotnet test bindings/csharp/Kairo.ECS.sln -c Release --no-restore
          dotnet pack bindings/csharp/Kairo.ECS.sln -c Release
