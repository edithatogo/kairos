name: Package Dry Runs

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  pull_request:
    paths:
      - 'crates/**'
      - 'bindings/**'
      - 'scripts/bootstrap-node-tools/package.json'
      - 'scripts/bootstrap-node-tools/package-lock.json'
      - 'scripts/bootstrap-node-tools/prepare_npm_cli.py'
      - 'scripts/bootstrap-node-tools/validate_npm_cli.mjs'
      - 'scripts/bootstrap-node-tools/run_strict_npm_audit_gate.py'
      - 'tests/test_strict_npm_audit_runner.py'
      - 'tests/test_strict_npm_audit_workflow.py'
      - 'tests/http-cache-private-vendor-regression.mjs'
      - 'vendor/http-cache-semantics-kairos-prototype/**'
      - 'vendor/http-cache-semantics-kairos-prototype-0.1.0.tgz'
      - 'scripts/bootstrap-node-tools/apply_http_cache_fix.py'
      - 'scripts/bootstrap-node-tools/run_npm_audit_gate.py'
      - 'conductor/tracks/20-openssf-supply-chain-institutional-trust/exceptions/**'
      - 'tests/test_npm_audit_exception.py'
      - 'tests/test_npm_audit_runner.py'
      - 'tests/test_http_cache_patch.py'
      - 'tests/http-cache-security-regression.mjs'
      - 'tests/http-cache-legacy-60-regression.mjs'
      - 'scripts/bootstrap.sh'
      - 'scripts/bootstrap-python-tools.lock'
      - 'scripts/package-python-tools.in'
      - 'scripts/package-python-tools.lock'
      - 'packaging/scripts/build_package_archive_bundle.py'
      - 'packaging/scripts/write_package_build_receipt.py'
      - 'tests/test_package_archive_bundle.py'
      - 'tools/docs-quality-node-tools/package.json'
      - 'tools/docs-quality-node-tools/package-lock.json'
      - '.github/workflows/package-dry-run.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-package:
    name: rust-package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Cargo package dry run
        run: |
          test -f Cargo.toml
          test -f crates/kairo-ecs-core/Cargo.toml
          test -f crates/kairo-ecs-rng/Cargo.toml
          test -f crates/kairo-ecs-state/Cargo.toml
          test -f crates/kairo-ecs-types/Cargo.toml
          cargo package --locked --allow-dirty -p kairo-ecs-types
          mkdir -p dist/packages/rust
          cp target/package/kairo-ecs-types-*.crate dist/packages/rust/
          python3 packaging/scripts/write_package_build_receipt.py --ecosystem rust --archive-dir dist/packages/rust --source-commit "$GITHUB_SHA" --command 'cargo package --locked --allow-dirty -p kairo-ecs-types' --toolchain "$(rustc --version); $(cargo --version)"
          python packaging/scripts/build_release_manifest.py --check
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kairos-package-rust
          path: dist/packages/rust/
          if-no-files-found: error
          retention-days: 7
  python-package:
    name: python-package (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Python package dry run
        run: |
          test -f bindings/python/pyproject.toml
          test -d bindings/python/kairo_ecs
          python -m pip install --require-hashes -r "$GITHUB_WORKSPACE/scripts/package-python-tools.lock"
          cd bindings/python
          python -m build --no-isolation --outdir "$GITHUB_WORKSPACE/dist/packages/python"
          python -m twine check "$GITHUB_WORKSPACE"/dist/packages/python/*
          cd "$GITHUB_WORKSPACE"
          python3 packaging/scripts/write_package_build_receipt.py --ecosystem python --archive-dir dist/packages/python --source-commit "$GITHUB_SHA" --command 'python -m build --no-isolation; python -m twine check' --toolchain "$(python --version); $(python -m build --version); $(python -m twine --version)"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kairos-package-python
          path: dist/packages/python/
          if-no-files-found: error
          retention-days: 7
  r-package:
    name: r-package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Ensure R is available
        run: |
          if ! command -v Rscript >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends r-base-core
          fi
          Rscript --version
      - name: R package dry run
        run: |
          test -f bindings/r/DESCRIPTION
          test -f bindings/r/NAMESPACE
          test -d bindings/r/R
          cd bindings/r
          R CMD build .
          _R_CHECK_FORCE_SUGGESTS_=false R CMD check --no-manual --no-tests ./*.tar.gz
          mkdir -p "$GITHUB_WORKSPACE/dist/packages/r"
          cp ./*.tar.gz "$GITHUB_WORKSPACE/dist/packages/r/"
          cd "$GITHUB_WORKSPACE"
          python3 packaging/scripts/write_package_build_receipt.py --ecosystem r --archive-dir dist/packages/r --source-commit "$GITHUB_SHA" --command 'R CMD build; R CMD check --no-manual --no-tests' --toolchain "$(R --version | head -n 1)" --validation-notes 'R CMD check completed with one NOTE for unavailable optional suggested packages; package tests skipped by the specified --no-tests workflow command.'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kairos-package-r
          path: dist/packages/r/
          if-no-files-found: error
          retention-days: 7
  npm-package:
    name: npm-package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: '22.22.2' }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: '3.14' }
      - name: Create fail-closed npm audit marker
        run: |
          mkdir -p artifacts/npm-audit-gate
          python3 - <<'PYTHON'
          import json
          from pathlib import Path
          Path("artifacts/npm-audit-gate/receipt.json").write_text(json.dumps({"classification": "failed", "raw_audit": {"status": "not_executed"}, "record_kind": "initial_pre_run_fail_closed_marker", "reason": "preparation or tests have not completed"}, separators=(",", ":")) + "\n")
          PYTHON
      - name: Prepare pinned npm CLI
        run: python3 scripts/bootstrap-node-tools/prepare_npm_cli.py --check
      - name: Install locked bootstrap dependencies
        run: npm ci --ignore-scripts --prefix scripts/bootstrap-node-tools
      - name: Test strict npm audit runner
        run: python3 -m unittest discover -s tests -p test_strict_npm_audit_runner.py -v
      - name: Test package workflow contract
        run: python3 -m unittest discover -s tests -p test_strict_npm_audit_workflow.py -v
      - name: Resolve and hash setup-node executable
        run: |
          set -eu
          KAIROS_NODE_BIN="$(realpath "$(command -v node)")"
          KAIROS_NODE_SHA256="$(sha256sum "$KAIROS_NODE_BIN" | awk '{print $1}')"
          test -x "$KAIROS_NODE_BIN"
          printf 'KAIROS_NODE_BIN=%s\nKAIROS_NODE_SHA256=%s\n' "$KAIROS_NODE_BIN" "$KAIROS_NODE_SHA256" >> "$GITHUB_ENV"
      - name: Run preserved 60-case cache regression
        run: |
          "$KAIROS_NODE_BIN" tests/http-cache-legacy-60-regression.mjs
      - name: Run qualified 248-case private-vendor regression
        run: |
          "$KAIROS_NODE_BIN" tests/http-cache-private-vendor-regression.mjs scripts/bootstrap-node-tools/node_modules/http-cache-semantics/index.js
      - name: Verify installed npm signatures
        run: |
          mkdir -p artifacts/npm-audit-gate
          "$KAIROS_NODE_BIN" scripts/bootstrap-node-tools/node_modules/npm/bin/npm-cli.js audit signatures --prefix scripts/bootstrap-node-tools --registry=https://registry.npmjs.org/ --update-notifier=false > artifacts/npm-audit-gate/signatures.stdout 2> artifacts/npm-audit-gate/signatures.stderr
      - name: Run strict private-tree npm audit
        run: python3 scripts/bootstrap-node-tools/run_strict_npm_audit_gate.py --node-path "$KAIROS_NODE_BIN" --node-sha256 "$KAIROS_NODE_SHA256"
      - name: Publish strict success receipt at root
        if: success()
        run: |
          cp -- artifacts/npm-audit-gate/strict/receipt.json artifacts/npm-audit-gate/receipt.json
          cmp -s artifacts/npm-audit-gate/strict/receipt.json artifacts/npm-audit-gate/receipt.json
      - name: Build TypeScript package
        run: |
          test -f bindings/typescript/package.json
          test -f bindings/typescript/tsconfig.json
          test -d bindings/typescript/src
          cd bindings/typescript
          npm ci --ignore-scripts
          npm run build
          # Build once explicitly; ignore scripts prevents npm pack lifecycle rebuilds.
          mkdir -p "$GITHUB_WORKSPACE/dist/packages/typescript"
          npm pack --ignore-scripts --pack-destination "$GITHUB_WORKSPACE/dist/packages/typescript"
          cd "$GITHUB_WORKSPACE"
          python3 packaging/scripts/write_package_build_receipt.py --ecosystem typescript --archive-dir dist/packages/typescript --source-commit "$GITHUB_SHA" --command 'npm ci --ignore-scripts; npm run build; npm pack --ignore-scripts' --toolchain "$(node --version); $(npm --version)"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kairos-package-typescript
          path: dist/packages/typescript/
          if-no-files-found: error
          retention-days: 7
      - name: Retain raw npm audit and policy classification
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kairos-bootstrap-npm-audit
          path: artifacts/npm-audit-gate/
          if-no-files-found: error
          retention-days: 7
  nuget-package:
    name: nuget-package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with: { dotnet-version: '10.0.x' }
      - name: dotnet pack dry run
        run: |
          test -f bindings/csharp/Kairo.ECS.sln
          test -f bindings/csharp/src/Kairo.ECS/Kairo.ECS.csproj
          dotnet restore bindings/csharp/src/Kairo.ECS/Kairo.ECS.csproj -p:TargetFrameworks=net10.0 --locked-mode -p:UseSharedCompilation=false -m:1 -nr:false
          mkdir -p "$GITHUB_WORKSPACE/dist/packages/nuget"
          dotnet pack bindings/csharp/src/Kairo.ECS/Kairo.ECS.csproj -c Release -p:TargetFrameworks=net10.0 --no-restore -p:RestoreLockedMode=true -p:UseSharedCompilation=false -m:1 -nr:false -o "$GITHUB_WORKSPACE/dist/packages/nuget"
          python3 packaging/scripts/write_package_build_receipt.py --ecosystem nuget --archive-dir dist/packages/nuget --source-commit "$GITHUB_SHA" --command 'dotnet restore --locked-mode; dotnet pack -c Release -p:TargetFrameworks=net10.0 --no-restore' --toolchain "dotnet $(dotnet --version)"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kairos-package-nuget
          path: dist/packages/nuget/
          if-no-files-found: error
          retention-days: 7

  julia-package:
    name: julia-source-archive
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Archive Julia package source
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' bindings/julia/Project.toml)
          mkdir -p dist/packages/julia
          git archive --format=tar --prefix="KairoECS-${version}-source/" "${GITHUB_SHA}:bindings/julia" | gzip -n > "dist/packages/julia/KairoECS-${version}-source.tar.gz"
          python3 packaging/scripts/write_package_build_receipt.py --ecosystem julia --archive-dir dist/packages/julia --source-commit "$GITHUB_SHA" --command 'git archive bindings/julia; gzip -n' --toolchain "$(git --version); $(gzip --version | head -n 1)" --validation-notes 'Julia package tests run in the required ci-bindings workflow.'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kairos-package-julia
          path: dist/packages/julia/
          if-no-files-found: error
          retention-days: 7

  go-package:
    name: go-source-archive
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Archive Go module source
        run: |
          mkdir -p dist/packages/go
          git archive --format=tar --prefix="kairos-go-${GITHUB_SHA::12}/" "${GITHUB_SHA}:bindings/go" | gzip -n > "dist/packages/go/kairos-go-${GITHUB_SHA::12}-source.tar.gz"
          python3 packaging/scripts/write_package_build_receipt.py --ecosystem go --archive-dir dist/packages/go --source-commit "$GITHUB_SHA" --command 'git archive bindings/go; gzip -n' --toolchain "$(git --version); $(gzip --version | head -n 1)" --validation-notes 'Go module tests and vet run in the required ci-bindings workflow.'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kairos-package-go
          path: dist/packages/go/
          if-no-files-found: error
          retention-days: 7

  retain-package-archives:
    name: verify-and-retain-package-archives
    needs: [rust-package, python-package, r-package, npm-package, nuget-package, julia-package, go-package]
    runs-on: ubuntu-latest
    # The validator only downloads this run's artifacts and reads the checked-out source;
    # it does not publish packages or change repository contents.
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v7.0.0
        with:
          pattern: kairos-package-*
          path: dist/package-archives
      - name: Validate archives and write SHA-256 index
        run: |
          python3 packaging/scripts/build_package_archive_bundle.py \
            --input dist/package-archives \
            --output dist/retained-package-archives \
            --source-commit "$GITHUB_SHA"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kairos-actual-package-archives-${{ github.sha }}
          path: dist/retained-package-archives/
          if-no-files-found: error
          retention-days: 90
