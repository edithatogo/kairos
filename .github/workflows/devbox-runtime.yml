name: Devbox runtime
on:
  pull_request:
    paths: ['devbox.json', '.python-version', 'scripts/python_runtime.py', '.github/workflows/devbox-runtime.yml']
  push:
    branches: [main]
    paths: ['devbox.json', '.python-version', 'scripts/python_runtime.py', '.github/workflows/devbox-runtime.yml']
permissions:
  contents: read
jobs:
  startup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.15.2"
      - name: Install Devbox 0.19.0
        run: |
          curl --fail --location https://github.com/jetify-com/devbox/releases/download/0.19.0/devbox_0.19.0_linux_amd64.tar.gz -o /tmp/devbox.tgz
          echo "13a9c9ca15ffef279f5c37694e7feeeeaed93d7ab7b0a69c7b4301a06bcd21ba  /tmp/devbox.tgz" | sha256sum -c -
          tar -xzf /tmp/devbox.tgz -C /tmp devbox
          sudo install /tmp/devbox /usr/local/bin/devbox
      - name: Qualify absent environment and preserved startup
        run: |
          test ! -e .venv
          devbox run -- bash -c 'python scripts/python_runtime.py'
          test -x .venv/bin/python
          devbox run -- bash -c 'python scripts/python_runtime.py'
      - name: Verify repository runtime for subsequent jobs
        run: python scripts/python_runtime.py --github
