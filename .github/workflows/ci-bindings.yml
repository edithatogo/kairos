name: ci-bindings

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  pull_request:
    paths:
      - '.github/actions/**'
      - '.github/workflows/ci-bindings.yml'
      - 'scripts/bootstrap-python-tools.lock'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/**'
      - 'bindings/**'
      - 'crates/**'
      - 'conformance/**'
      - 'examples/**'
      - 'hpc/**'
      - 'include/**'
      - 'schemas/**'
      - 'scripts/**'
      - 'templates/**'
      - 'tests/**'
      - 'benches/**'
      - 'build.rs'
      - 'justfile'
      - 'mise.toml'
      - 'rust-toolchain.toml'
  push:
    branches: [main]
    paths:
      - '.github/actions/**'
      - '.github/workflows/ci-bindings.yml'
      - 'scripts/bootstrap-python-tools.lock'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/**'
      - 'bindings/**'
      - 'crates/**'
      - 'conformance/**'
      - 'examples/**'
      - 'hpc/**'
      - 'include/**'
      - 'schemas/**'
      - 'scripts/**'
      - 'templates/**'
      - 'tests/**'
      - 'benches/**'
      - 'build.rs'
      - 'justfile'
      - 'mise.toml'
      - 'rust-toolchain.toml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Python binding smoke
        run: |
          test -f bindings/python/pyproject.toml
          python -m pip install --require-hashes -r scripts/bootstrap-python-tools.lock
          cd bindings/python
          python -m pip install --no-deps --no-build-isolation -e '.[test]'
          ruff check .
          python -m pytest -q

  r:
    name: R binding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Ensure R is available
        run: |
          if ! command -v Rscript >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends r-base-core
          fi
          Rscript --version
      - name: R smoke
        run: |
          test -f bindings/r/DESCRIPTION
          cd bindings/r
          Rscript tests/smoke-base.R

  julia:
    name: Julia binding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3.0.2
        with:
          version: '1'
      - name: Julia smoke
        run: |
          test -f bindings/julia/Project.toml
          julia --project=bindings/julia -e 'using Pkg; Pkg.instantiate(); Pkg.test()'

  typescript:
    name: TypeScript/Wasm binding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: TypeScript smoke
        run: |
          test -f bindings/typescript/package.json
          cd bindings/typescript
          npm ci
          npm run typecheck
          npm test

  csharp:
    name: C# ${{ matrix.target-framework }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target-framework: 'net10.0'
          - target-framework: 'net11.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            10.0.x
            11.0.x
      - name: C# smoke
        env:
          TARGET_FRAMEWORK: ${{ matrix.target-framework }}
        run: |
          test -f bindings/csharp/Kairo.ECS.sln
          dotnet test bindings/csharp/tests/Kairo.ECS.Tests/Kairo.ECS.Tests.csproj -c Release -f "$TARGET_FRAMEWORK" -p:TreatWarningsAsErrors=true

  go:
    name: Go binding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 'stable'
      - name: Go smoke
        run: |
          test -f bindings/go/go.mod
          mapfile -t go_files < <(git ls-files 'bindings/go/*.go')
          test -z "$(gofmt -l "${go_files[@]}")"
          cd bindings/go
          go vet ./...
          go test ./...
