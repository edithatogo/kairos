name: ci-bindings

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Python binding smoke
        run: |
          test -f bindings/python/pyproject.toml
          python -m pip install -U pip maturin pytest ruff pyarrow
          cd bindings/python
          ruff check .
          python -m pytest -q

  r:
    name: R binding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Ensure R is available
        run: |
          if ! command -v Rscript >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends r-base-core
          fi
          Rscript --version
      - name: R smoke
        run: |
          test -f bindings/r/DESCRIPTION
          cd bindings/r
          Rscript tests/smoke-base.R

  julia:
    name: Julia binding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3.0.2
        with:
          version: '1'
      - name: Julia smoke
        run: |
          test -f bindings/julia/Project.toml
          julia --project=bindings/julia -e 'using Pkg; Pkg.instantiate(); Pkg.test()'

  typescript:
    name: TypeScript/Wasm binding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24.21.0'
      - name: TypeScript smoke
        run: |
          test -f bindings/typescript/package.json
          cd bindings/typescript
          npm ci
          npm run typecheck
          npm test

  csharp:
    name: C# ${{ matrix.target-framework }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target-framework: 'net10.0'
          - target-framework: 'net11.0'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: |
            10.0.x
            11.0.x
      - name: C# smoke
        env:
          TARGET_FRAMEWORK: ${{ matrix.target-framework }}
        run: |
          test -f bindings/csharp/Kairo.ECS.sln
          dotnet test bindings/csharp/tests/Kairo.ECS.Tests/Kairo.ECS.Tests.csproj -c Release -f "$TARGET_FRAMEWORK" -p:TreatWarningsAsErrors=true

  go:
    name: Go binding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: 'stable'
      - name: Go smoke
        run: |
          test -f bindings/go/go.mod
          mapfile -t go_files < <(git ls-files 'bindings/go/*.go')
          test -z "$(gofmt -l "${go_files[@]}")"
          cd bindings/go
          go vet ./...
          go test ./...
