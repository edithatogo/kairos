name: SBOM and Attestations

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      artifact_path:
        description: Path to the release artifact tree to scan
        required: true
        default: dist
  release:
    types: [published]

permissions:
  contents: read

jobs:
  sbom:
    name: sbom-attestation
    permissions:
      contents: read
      id-token: write # Needed to sign SBOM attestations with OIDC.
      attestations: write # Needed to publish SBOM attestations.
    runs-on: ubuntu-latest
    env:
      ARTIFACT_PATH: ${{ github.event.inputs.artifact_path || 'dist' }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Verify release artifact tree exists
        run: |
          test -d "${ARTIFACT_PATH}"
          test -f "${ARTIFACT_PATH}/RELEASE.txt"
          test -f "${ARTIFACT_PATH}/release-artifact-manifest.json"
          test -f "${ARTIFACT_PATH}/SHA256SUMS"
      - name: Install Syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610
      - name: Generate SBOM
        run: syft "dir:${ARTIFACT_PATH}" -o "spdx-json=${ARTIFACT_PATH}/sbom.spdx.json"
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sbom-spdx
          path: ${{ env.ARTIFACT_PATH }}/sbom.spdx.json
      - name: Attest SBOM
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26
        with:
          subject-path: ${{ env.ARTIFACT_PATH }}
          sbom-path: ${{ env.ARTIFACT_PATH }}/sbom.spdx.json
