name: Fuzzing Smoke

on:
  schedule:
    - cron: '17 3 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: FFI fuzz smoke
        shell: bash
        run: |
          set -euo pipefail
          test -f Cargo.toml
          test -d fuzz
          cargo fuzz run ffi_boundary -- -max_total_time=60
