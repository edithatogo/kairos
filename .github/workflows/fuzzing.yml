name: Fuzzing Smoke

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  pull_request:
    paths:
      - '.github/workflows/fuzzing.yml'
      - 'crates/kairo-ecs-core/**'
      - 'crates/kairo-ecs-types/**'
      - 'crates/kairo-ecs-rng/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'fuzz/**'
  schedule:
    - cron: '17 3 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stable-properties:
    name: Scheduler properties (Rust 1.99.1)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the canonical stable compiler
        run: rustup toolchain install 1.99.1 --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: scheduler-properties
      - name: Build the existing bounded property suites
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/scheduler-properties
          rustc +1.99.1 -Vv > artifacts/scheduler-properties/compiler.txt
          git rev-parse HEAD > artifacts/scheduler-properties/commit.txt
          timeout 600s cargo +1.99.1 test --locked -p kairo-ecs-core \
            --test track96_phase0_proptest_baseline \
            --test track96_phase1_proptest_invariants --no-run \
            2>&1 | tee artifacts/scheduler-properties/build.log
      - name: Run ordering, conservation, cancellation and oracle controls
        shell: bash
        run: |
          set -euo pipefail
          timeout 120s cargo +1.99.1 test --locked -p kairo-ecs-core \
            --test track96_phase0_proptest_baseline \
            --test track96_phase1_proptest_invariants -- --test-threads=1 --nocapture \
            2>&1 | tee artifacts/scheduler-properties/tests.log
      - name: Preserve test evidence and minimized regression seeds
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scheduler-properties-${{ github.run_attempt }}
          path: |
            artifacts/scheduler-properties/
            crates/kairo-ecs-core/proptest-regressions/
            crates/kairo-ecs-core/tests/*.proptest-regressions
          if-no-files-found: warn
          retention-days: 14

      - name: Run coverage-guided scheduler fuzz
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/scheduler-fuzz-target
          RUSTFLAGS: >-
            -Cpasses=sancov-module
            -Cllvm-args=-sanitizer-coverage-level=3
            -Cllvm-args=-sanitizer-coverage-inline-8bit-counters
            -Cllvm-args=-sanitizer-coverage-pc-table
        shell: bash
        run: |
          set -euo pipefail
          evidence=artifacts/scheduler-fuzz
          corpus="$RUNNER_TEMP/scheduler-fuzz-corpus"
          mkdir -p "$evidence/findings" "$corpus"
          cp fuzz/corpus/scheduler_requests/* "$corpus/"
          rustc +1.99.1 -Vv > "$evidence/compiler.txt"
          git rev-parse HEAD > "$evidence/commit.txt"
          sha256sum fuzz/Cargo.lock fuzz/fuzz_targets/scheduler_requests.rs \
            fuzz/corpus/scheduler_requests/* > "$evidence/inputs.sha256"
          printf '%s\n' "$RUSTFLAGS" > "$evidence/rustflags.txt"
          timeout 600s cargo +1.99.1 build --locked --release --manifest-path fuzz/Cargo.toml \
            --target x86_64-unknown-linux-gnu --bin scheduler_requests \
            2>&1 | tee "$evidence/build.log"
          binary="$CARGO_TARGET_DIR/x86_64-unknown-linux-gnu/release/scheduler_requests"
          sha256sum "$binary" > "$evidence/executable.sha256"

          arguments=(-seed=472026 -max_len=1024 -rss_limit_mb=2048 -timeout=10)
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            arguments+=(-runs=20000)
          else
            arguments+=(-max_total_time=60)
          fi
          printf '%s\n' "${arguments[@]}" > "$evidence/arguments.txt"
          timeout 120s "$binary" "$corpus" "${arguments[@]}" -artifact_prefix="$evidence/findings/" \
            2>&1 | tee "$evidence/fuzz.log"
          grep -Eq '^INFO: Loaded [1-9][0-9]* modules?.*\([1-9][0-9]* inline 8-bit counters\)' "$evidence/fuzz.log"
          awk '
            $2 == "INITED" && $3 == "cov:" { initial = $4 }
            $2 == "DONE" && $3 == "cov:" { final = $4 }
            END { exit !(initial > 0 && final > initial) }
          ' "$evidence/fuzz.log"
      - name: Record the outstanding sanitizer status
        if: always()
        run: |
          mkdir -p artifacts/scheduler-fuzz
          {
            echo '## Scheduler sanitizer analysis: UNVERIFIED'
            echo 'AddressSanitizer execution remains unverified under Rust 1.99.1.'
          } | tee artifacts/scheduler-fuzz/sanitizer-status.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve guided fuzz evidence and crash artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scheduler-fuzz-${{ github.run_attempt }}
          path: artifacts/scheduler-fuzz/
          if-no-files-found: error
          retention-days: 30
