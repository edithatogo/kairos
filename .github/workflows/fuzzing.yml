name: Fuzzing Smoke

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  schedule:
    - cron: '17 3 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz-unverified:
    name: Fuzzing UNVERIFIED (cargo-fuzz not run)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Record the outstanding fuzzing obligation
        run: |
          {
            echo '## Scheduler fuzzing: UNVERIFIED'
            echo 'No fuzz run was performed. cargo-fuzz requires Rust nightly, which is disallowed by the sole Rust 1.99.0 policy.'
            echo 'Outstanding obligation: reassess fuzz execution only under a future reviewed toolchain policy; this workflow reports no fuzz pass.'
          } | tee fuzzing-unverified.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve unverified fuzzing status
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scheduler-fuzz-unverified
          path: fuzzing-unverified.txt
          if-no-files-found: error
          retention-days: 30
