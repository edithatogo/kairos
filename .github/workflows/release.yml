name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release
        required: true
      dry_run:
        description: Dry run only
        required: true
        default: 'true'

permissions:
  contents: write
  id-token: write

jobs:
  release-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Install Python build tools
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install Node LTS
        uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'
      - name: Install .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Validate release checklist
        run: |
          test -f Cargo.toml
          test -f docs/release/release-checklist.md
          test -f docs/release/supply-chain-verification.md
          test -f bindings/python/pyproject.toml
          test -f bindings/r/DESCRIPTION
          test -f bindings/julia/Project.toml
          test -f bindings/typescript/package.json
          test -f bindings/csharp/Kairo.ECS.sln
          test -f bindings/go/go.mod
          cargo metadata --no-deps --format-version 1 >/dev/null
          cargo test --workspace --all-features --no-run
          cargo publish --dry-run --workspace
      - name: Build release manifest
        run: python packaging/scripts/build_release_manifest.py --version "${{ github.event.inputs.version }}" --dry-run "${{ github.event.inputs.dry_run }}"
      - name: Validate release manifest
        run: |
          test -f dist/release-artifact-manifest.json
          test -f dist/SHA256SUMS
          python - <<'PY'
          import json, pathlib
          data = json.loads(pathlib.Path('dist/release-artifact-manifest.json').read_text(encoding='utf-8'))
          artifacts = data.get('artifacts', [])
          if len(artifacts) < 7:
              raise SystemExit(f'unexpected artifact count: {len(artifacts)}')
          ecosystems = {entry.get('ecosystem') for entry in artifacts}
          expected = {'rust', 'python', 'r', 'julia', 'typescript', 'csharp', 'go'}
          if ecosystems != expected:
              raise SystemExit(f'unexpected artifact ecosystems: {sorted(ecosystems)}')
          if data.get('production_publish_enabled') is not False:
              raise SystemExit('release manifest must remain dry-run only')
          PY
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: kairo-ecs-release-${{ github.event.inputs.version }}
          path: dist/
