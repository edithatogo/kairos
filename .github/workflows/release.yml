name: release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release
        required: true
      dry_run:
        description: Dry run only
        required: true
        default: 'true'

permissions:
  contents: read

jobs:
  release-dry-run:
    name: release-dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust 1.99.0
        run: |
          rustup toolchain install 1.99.0 --profile minimal
      - name: Bind Rust 1.99.0 tools
        shell: bash
        run: |
          task_rustc="$(rustup which --toolchain 1.99.0 rustc)"
          task_bin="$(dirname "$task_rustc")"
          task_cargo="$(rustup which --toolchain 1.99.0 cargo)"
          task_rustdoc="$(rustup which --toolchain 1.99.0 rustdoc)"
          "$task_cargo" -V | grep -E '^cargo 1\.99\.0 '
          "$task_rustc" -V | grep -E '^rustc 1\.99\.0 '
          "$task_rustdoc" -V | grep -E '^rustdoc 1\.99\.0 '
          printf '%s\n' "PATH=$task_bin:$PATH" 'RUSTUP_TOOLCHAIN=1.99.0' "RUSTC=$task_rustc" "RUSTDOC=$task_rustdoc" >> "$GITHUB_ENV"
      - name: Install Python build tools
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.8'
      - name: Install Node LTS
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
      - name: Install .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.401'
      - name: Validate release checklist
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          if [ "${DRY_RUN}" != "true" ]; then
            echo "release workflow is dry-run only"
            exit 1
          fi
          test -f Cargo.toml
          test -f docs/release/release-checklist.md
          test -f docs/release/supply-chain-verification.md
          test -f bindings/python/pyproject.toml
          test -f bindings/r/DESCRIPTION
          test -f bindings/julia/Project.toml
          test -f bindings/typescript/package.json
          test -f bindings/csharp/Kairo.ECS.sln
          test -f bindings/go/go.mod
          cargo metadata --no-deps --format-version 1 >/dev/null
          python packaging/scripts/build_release_manifest.py --check
          cargo test --workspace --all-features --no-run
          cargo package --allow-dirty --workspace
          cargo publish --dry-run --workspace
      - name: Build release manifest
        env:
          RELEASE_VERSION: ${{ github.event.inputs.version }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: python packaging/scripts/build_release_manifest.py --version "${RELEASE_VERSION}" --dry-run "${DRY_RUN}"
      - name: Validate release manifest
        run: python packaging/scripts/build_release_manifest.py --verify-existing
      - name: Test release evidence gate
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File tests/test_track15_release_evidence_gate.ps1
      - name: Validate release delivery gate
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/validate_track15_release_delivery.ps1
      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kairo-ecs-release-${{ github.event.inputs.version }}
          path: dist/
          if-no-files-found: error
          retention-days: 90
