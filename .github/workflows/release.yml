name: release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release
        required: true
      dry_run:
        description: Dry run only
        required: true
        default: 'true'

permissions:
  contents: read

jobs:
  release-dry-run:
    name: release-dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Install Python build tools
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.14'
      - name: Install Node LTS
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
      - name: Install .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7
        with:
          dotnet-version: '10.0.x'
      - name: Validate release checklist
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          if [ "${DRY_RUN}" != "true" ]; then
            echo "release workflow is dry-run only"
            exit 1
          fi
          test -f Cargo.toml
          test -f docs/release/release-checklist.md
          test -f docs/release/supply-chain-verification.md
          test -f bindings/python/pyproject.toml
          test -f bindings/r/DESCRIPTION
          test -f bindings/julia/Project.toml
          test -f bindings/typescript/package.json
          test -f bindings/csharp/Kairo.ECS.sln
          test -f bindings/go/go.mod
          cargo metadata --no-deps --format-version 1 >/dev/null
          python packaging/scripts/build_release_manifest.py --check
          cargo test --workspace --all-features --no-run
          cargo package --allow-dirty --workspace
          cargo publish --dry-run --workspace
      - name: Validate release delivery gate
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/validate_track15_release_delivery.ps1
      - name: Build release manifest
        env:
          RELEASE_VERSION: ${{ github.event.inputs.version }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: python packaging/scripts/build_release_manifest.py --version "${RELEASE_VERSION}" --dry-run "${DRY_RUN}"
      - name: Validate release manifest
        run: python packaging/scripts/build_release_manifest.py --verify-existing
      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: kairo-ecs-release-${{ github.event.inputs.version }}
          path: dist/
