name: Registry Publish

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish
        required: true
      ecosystem:
        description: Ecosystem to publish, or all
        required: true
        default: all
        type: choice
        options:
          - all
          - rust
          - python
          - r
          - julia
          - typescript
          - csharp
          - go
      publish:
        description: Actually write to registries
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  preflight:
    name: publication preflight
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.mode.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.8'
      - name: Validate publication gates
        run: |
          node scripts/validation/validate-code-health.mjs
          node scripts/validation/validate-publication-readiness.mjs
          python packaging/scripts/build_release_manifest.py --check
      - id: mode
        name: Record publish mode
        env:
          KAIROS_PUBLISH: ${{ github.event.inputs.publish }}
        run: echo "publish=$KAIROS_PUBLISH" >> "$GITHUB_OUTPUT"

  dry-run:
    name: registry dry run
    runs-on: ubuntu-latest
    needs: preflight
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.8'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            10.0.x
            11.0.x
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3.0.2
        with:
          version: '1.13.1'
      - name: Ensure R is available
        run: |
          if ! command -v Rscript >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends r-base-core
          fi
          Rscript --version
      - name: Dry-run publication inventory
        env:
          KAIROS_ECOSYSTEM: ${{ github.event.inputs.ecosystem }}
          KAIROS_VERSION: ${{ github.event.inputs.version }}
        run: |
          python packaging/scripts/build_release_manifest.py --version "$KAIROS_VERSION" --dry-run true
          python packaging/scripts/build_release_manifest.py --verify-existing
          node scripts/release/publish-registry.mjs --mode dry-run --ecosystem "$KAIROS_ECOSYSTEM" --version "$KAIROS_VERSION"

  publish:
    name: protected registry publication
    runs-on: ubuntu-latest
    needs: [preflight, dry-run]
    if: ${{ github.event.inputs.publish == 'true' && github.ref == 'refs/heads/main' }}
    environment: release-publication
    permissions:
      contents: write # Required only for the Go module tag push during protected publication.
      id-token: write # Required for trusted publishing to registries that support OIDC.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.8'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            10.0.x
            11.0.x
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3.0.2
        with:
          version: '1.13.1'
      - name: Ensure R is available
        run: |
          if ! command -v Rscript >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends r-base-core
          fi
          Rscript --version
      - name: Final health gate
        run: |
          node scripts/validation/validate-code-health.mjs
          node scripts/validation/validate-publication-readiness.mjs
      - name: Execute publication lane
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          KAIROS_ECOSYSTEM: ${{ github.event.inputs.ecosystem }}
          KAIROS_VERSION: ${{ github.event.inputs.version }}
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/release/publish-registry.mjs --mode publish --ecosystem "$KAIROS_ECOSYSTEM" --version "$KAIROS_VERSION"
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        if: ${{ github.event.inputs.ecosystem == 'all' || github.event.inputs.ecosystem == 'python' }}
        with:
          packages-dir: bindings/python/dist
