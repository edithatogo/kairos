name: Registry Publish

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish
        required: true
      ecosystem:
        description: Ecosystem to publish, or all
        required: true
        default: all
        type: choice
        options:
          - all
          - rust
          - python
          - r
          - julia
          - typescript
          - csharp
          - go
      publish:
        description: Actually write to registries
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  preflight:
    name: publication preflight
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.mode.outputs.publish }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.14'
      - name: Validate publication gates
        run: |
          node scripts/validation/validate-code-health.mjs
          node scripts/validation/validate-publication-readiness.mjs
          python packaging/scripts/build_release_manifest.py --check
      - id: mode
        name: Record publish mode
        env:
          KAIROS_PUBLISH: ${{ github.event.inputs.publish }}
        run: echo "publish=$KAIROS_PUBLISH" >> "$GITHUB_OUTPUT"

  dry-run:
    name: registry dry run
    runs-on: ubuntu-latest
    needs: preflight
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.14'
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: '1.25.x'
          cache: false
      - uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: |
            10.0.x
            11.0.x
      - uses: julia-actions/setup-julia@f6f565d9f7cf12f53dc8045742460d6260ad3b39 # v3.0.1
        with:
          version: '1'
      - name: Ensure R is available
        run: |
          if ! command -v Rscript >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends r-base-core
          fi
          Rscript --version
      - name: Dry-run publication inventory
        env:
          KAIROS_ECOSYSTEM: ${{ github.event.inputs.ecosystem }}
          KAIROS_VERSION: ${{ github.event.inputs.version }}
        run: |
          python packaging/scripts/build_release_manifest.py --version "$KAIROS_VERSION" --dry-run true
          python packaging/scripts/build_release_manifest.py --verify-existing
          node scripts/release/publish-registry.mjs --mode dry-run --ecosystem "$KAIROS_ECOSYSTEM" --version "$KAIROS_VERSION"

  publish:
    name: protected registry publication
    runs-on: ubuntu-latest
    needs: [preflight, dry-run]
    if: ${{ github.event.inputs.publish == 'true' && github.ref == 'refs/heads/main' }}
    environment: release-publication
    permissions:
      contents: write # Required only for the Go module tag push during protected publication.
      id-token: write # Required for trusted publishing to registries that support OIDC.
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.14'
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: '1.25.x'
          cache: false
      - uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: |
            10.0.x
            11.0.x
      - uses: julia-actions/setup-julia@f6f565d9f7cf12f53dc8045742460d6260ad3b39 # v3.0.1
        with:
          version: '1'
      - name: Ensure R is available
        run: |
          if ! command -v Rscript >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends r-base-core
          fi
          Rscript --version
      - name: Final health gate
        run: |
          node scripts/validation/validate-code-health.mjs
          node scripts/validation/validate-publication-readiness.mjs
      - name: Execute publication lane
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          KAIROS_ECOSYSTEM: ${{ github.event.inputs.ecosystem }}
          KAIROS_VERSION: ${{ github.event.inputs.version }}
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/release/publish-registry.mjs --mode publish --ecosystem "$KAIROS_ECOSYSTEM" --version "$KAIROS_VERSION"
      - uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
        if: ${{ github.event.inputs.ecosystem == 'all' || github.event.inputs.ecosystem == 'python' }}
        with:
          packages-dir: bindings/python/dist
