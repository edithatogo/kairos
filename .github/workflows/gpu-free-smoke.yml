name: GPU Free Smoke

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  pull_request:
    paths:
      - "crates/kairo-ecs-gpu/**"
      - "crates/kairo-ecs-webgpu/**"
      - "docs/gpu-compute/**"
      - "docs/cloud-hpc/free-compute-blocker-plan.md"
      - "conductor/free-compute-routes.json"
      - "scripts/validation/validate-free-compute-routes.mjs"
      - "tests/free-compute-routes.test.mjs"
      - "website/webgpu-demo/**"
      - "scripts/nim/**"
      - "notebooks/colab_gpu_smoke.ipynb"
      - "notebooks/colab_tpu_smoke.ipynb"
      - "notebooks/colab_tpu_dedicated_smoke.ipynb"
      - ".github/workflows/gpu-free-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-metal-smoke:
    name: macos-metal-smoke
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust 1.99.0
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt
      - name: Bind Rust 1.99.0 tools
        shell: bash
        run: |
          task_rustc="$(rustup which --toolchain 1.99.0 rustc)"
          task_bin="$(dirname "$task_rustc")"
          task_cargo="$(rustup which --toolchain 1.99.0 cargo)"
          task_rustdoc="$(rustup which --toolchain 1.99.0 rustdoc)"
          "$task_cargo" -V | grep -E '^cargo 1\.99\.0 '
          "$task_rustc" -V | grep -E '^rustc 1\.99\.0 '
          "$task_rustdoc" -V | grep -E '^rustdoc 1\.99\.0 '
          printf '%s\n' "PATH=$task_bin:$PATH" 'RUSTUP_TOOLCHAIN=1.99.0' "RUSTC=$task_rustc" "RUSTDOC=$task_rustdoc" >> "$GITHUB_ENV"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"

      - name: Metal-adjacent GPU crate check
        run: cargo check --manifest-path crates/kairo-ecs-gpu/Cargo.toml --features wgpu-backend --tests

      - name: WebGPU crate check
        run: cargo check --manifest-path crates/kairo-ecs-webgpu/Cargo.toml --features webgpu --tests

      - name: Browser demo smoke
        run: npm test --prefix website/webgpu-demo

      - name: Validate free compute blocker routes
        run: node scripts/validation/validate-free-compute-routes.mjs

  nim-gpu-smoke:
    name: nim-gpu-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"

      - name: Validate free compute blocker routes
        run: node scripts/validation/validate-free-compute-routes.mjs

      - name: NIM smoke
        env:
          NVIDIA_NIM_BASE_URL: ${{ secrets.NVIDIA_NIM_BASE_URL }}
          NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
          NVIDIA_NIM_MODEL: ${{ secrets.NVIDIA_NIM_MODEL }}
        run: |
          if [ -z "$NVIDIA_NIM_BASE_URL" ] || [ -z "$NVIDIA_NIM_API_KEY" ]; then
            echo "NVIDIA NIM secrets are not configured; skipping optional NIM smoke."
            exit 0
          fi
          node scripts/nim/nim-gpu-smoke.mjs || {
            echo "::warning::Optional NVIDIA NIM smoke failed; check NVIDIA_NIM_BASE_URL/NVIDIA_NIM_API_KEY configuration."
            exit 0
          }
