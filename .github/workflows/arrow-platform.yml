name: Arrow platform qualification

on:
  pull_request:
    paths:
      - 'crates/kairo-ecs-arrow/**'
      - 'crates/kairo-ecs-fs-guard/**'
      - 'crates/kairo-ecs-types/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/arrow-platform.yml'
  push:
    branches: [main]
    paths:
      - 'crates/kairo-ecs-arrow/**'
      - 'crates/kairo-ecs-fs-guard/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/arrow-platform.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arrow-platform-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  arrow-platform:
    name: Arrow runtime (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      RUST_BACKTRACE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install selected Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: arrow-platform
      - name: Native directory permission checks
        run: cargo test --locked -p kairo-ecs-fs-guard
      - name: Arrow publication, recovery and IPC checks
        run: >-
          cargo test --locked -p kairo-ecs-arrow --features polars-native
          --test track70_phase3_durable_publication
          --test track70_phase3_durability
          --test track70_phase1_native_tables
      - name: Arrow unit checks
        run: cargo test --locked -p kairo-ecs-arrow --features polars-native --lib
      - name: Focused lint checks
        run: >-
          cargo clippy --locked -p kairo-ecs-arrow -p kairo-ecs-fs-guard
          --features kairo-ecs-arrow/polars-native --all-targets -- -D warnings
      - name: Create source packages
        run: >-
          cargo package --locked --no-verify
          -p kairo-ecs-types -p kairo-ecs-fs-guard -p kairo-ecs-arrow
