name: CI Skip Guard

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions:
  pull-requests: read # Needed to inspect pull request title and body for skip directives.

jobs:
  reject-skip-directives:
    name: Reject CI skip directives
    runs-on: ubuntu-latest
    steps:
      - name: Check PR metadata
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const pattern = /\[(skip ci|ci skip|no ci|skip actions|actions skip)\]|skip-checks:\s*true/i;
            const pr = context.payload.pull_request;
            const candidates = [
              `PR title: ${pr.title || ""}`,
              `PR body: ${pr.body || ""}`,
            ];

            const offender = candidates.find((value) => pattern.test(value));
            if (offender) {
              core.setFailed(`CI skip directives are not allowed on pull requests: ${offender}`);
            }
