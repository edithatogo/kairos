name: CI Skip Guard

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  reject-skip-directives:
    name: Reject CI skip directives
    runs-on: ubuntu-latest
    steps:
      - name: Check PR metadata and commits
        uses: actions/github-script@v9
        with:
          script: |
            const pattern = /\[(skip ci|ci skip|no ci|skip actions|actions skip)\]|skip-checks:\s*true/i;
            const pr = context.payload.pull_request;
            const candidates = [
              `PR title: ${pr.title || ""}`,
              `PR body: ${pr.body || ""}`,
            ];

            const commits = await github.paginate(github.rest.pulls.listCommits, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100,
            });

            for (const commit of commits) {
              candidates.push(`commit ${commit.sha}: ${commit.commit.message || ""}`);
            }

            const offender = candidates.find((value) => pattern.test(value));
            if (offender) {
              core.setFailed(`CI skip directives are not allowed on pull requests: ${offender}`);
            }
