name: HPC Registry Publish

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish
        required: true
      publish:
        description: Actually publish cloud/HPC artifacts
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  preflight:
    name: hpc publication preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Validate HPC publication gates
        run: |
          node scripts/validation/validate-code-health.mjs
          node scripts/validation/validate-hpc-registry-readiness.mjs
      - name: Dry-run publication commands
        env:
          KAIROS_VERSION: ${{ github.event.inputs.version }}
        run: node scripts/release/publish-hpc.mjs --mode dry-run --version "$KAIROS_VERSION"

  publish:
    name: protected hpc publication
    runs-on: ubuntu-latest
    needs: preflight
    if: ${{ github.event.inputs.publish == 'true' && github.ref == 'refs/heads/main' }}
    environment: hpc-publication
    permissions:
      contents: read
      packages: write # Required only to publish OCI artifacts to GHCR.
      id-token: write # Required for future artifact attestations and trusted cloud registry flows.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Final health gate
        run: |
          node scripts/validation/validate-code-health.mjs
          node scripts/validation/validate-hpc-registry-readiness.mjs
      - name: Execute HPC publication lane
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KAIROS_VERSION: ${{ github.event.inputs.version }}
        run: node scripts/release/publish-hpc.mjs --mode publish --version "$KAIROS_VERSION"
