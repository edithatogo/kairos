name: Changelog Policy

on:
  pull_request:
    paths:
      - "CHANGELOG.md"
      - "crates/**"
      - "include/**"
      - "bindings/**"
      - "schemas/arrow/**"
      - "conformance/fixtures/**"
      - "docs/release/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-changelog:
    name: Enforce changelog policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check that public release surface edits update CHANGELOG.md
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="$(git merge-base HEAD origin/main || git rev-parse HEAD^)"
          fi
          head="${{ github.sha }}"
          changed="$(git diff --name-only "$base" "$head")"
          public_changed="$(printf '%s\n' "$changed" | rg '^(crates/kairo-ecs-(types|core|state|rng|ffi)|include/|bindings/(python|r|julia|typescript|csharp|go)|schemas/arrow/|conformance/fixtures/|docs/release/|\.github/workflows/)' || true)"
          if [ -n "$public_changed" ] && ! printf '%s\n' "$changed" | grep -qx 'CHANGELOG.md'; then
            echo "Public release surface changed without CHANGELOG.md"
            exit 1
          fi
          echo "changelog_policy=ok"
