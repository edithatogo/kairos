name: GitHub Actions Security Lint

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  pull_request:
    paths:
      - 'renovate.json'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Inventory workflow files
        run: |
          test -f .github/workflows/scorecard.yml
          test -f .github/workflows/dependency-review.yml
          test -f .github/workflows/sbom-attestations.yml
          test -f .github/workflows/release-attestations.yml
          test -f .github/workflows/workflow-security.yml
          test -f .github/workflows/actions-security.yml
          test -f .github/workflows/ci-policy.yml
          test -f .github/workflows/ci-skip-guard.yml
          test -f .github/workflows/ci-core.yml
          test -f .github/workflows/ci-bindings.yml
          test -f .github/workflows/benchmark-smoke.yml
          test -f .github/workflows/docs.yml
          test -f .github/workflows/docs-quality.yml
          test -f .github/workflows/docs-link-check.yml
          test -f .github/workflows/package-dry-run.yml
          test -f .github/workflows/release.yml
      - name: Detect floating action refs
        run: |
          if rg -n "uses:\s+[^@[:space:]]+@(main|master|latest|HEAD)\b" .github/workflows; then
            exit 1
          fi
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          persona: auditor
          online-audits: false
