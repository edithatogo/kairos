name: GitHub Actions Security Lint

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  pull_request:
    paths:
      - 'renovate.json'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Inventory workflow files
        run: |
          test -f .github/workflows/scorecard.yml
          test -f .github/workflows/dependency-review.yml
          test -f .github/workflows/sbom-attestations.yml
          test -f .github/workflows/release-attestations.yml
          test -f .github/workflows/workflow-security.yml
          test -f .github/workflows/actions-security.yml
          test -f .github/workflows/ci-policy.yml
          test -f .github/workflows/ci-skip-guard.yml
          test -f .github/workflows/ci-core.yml
          test -f .github/workflows/ci-bindings.yml
          test -f .github/workflows/benchmark-smoke.yml
          test -f .github/workflows/docs.yml
          test -f .github/workflows/docs-quality.yml
          test -f .github/workflows/docs-link-check.yml
          test -f .github/workflows/package-dry-run.yml
          test -f .github/workflows/release.yml
      - name: Detect floating action refs
        run: |
          result=0
          git grep -nE 'uses:[[:space:]]+[^@[:space:]]+@(main|master|latest|HEAD)([^[:alnum:]_]|$)' -- .github/workflows || result=$?
          test "$result" -eq 1
      - name: Install pinned zizmor
        uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
        with:
          tool: zizmor@1.32.0
          fallback: none
      - name: Audit runner workflows offline
        run: |
          scanner="$(command -v zizmor)"
          env -i PATH=/usr/bin:/bin HOME="$RUNNER_TEMP" "$scanner" \
            --offline --strict-collection --persona=auditor --format=sarif -- . > "$RUNNER_TEMP/zizmor.sarif"
      - name: Upload zizmor SARIF
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: ${{ runner.temp }}/zizmor.sarif
          category: zizmor
      - name: Enforce workflow runner safeguards
        run: |
          jq --slurp --exit-status '
            length == 1 and (.[0] |
              .version == "2.1.0" and
              (.runs | type == "array" and length > 0 and all(.[];
                .tool.driver.name == "zizmor" and
                (.results | type == "array" and all(.[];
                  (.level == "warning" or .level == "note" or .level == "none") and
                  (.ruleId | type == "string" and length > 0) and
                  .ruleId != "zizmor/artipacked")))))
          ' "$RUNNER_TEMP/zizmor.sarif" > /dev/null
