name: GitHub Actions Security Lint

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  pull_request:
    paths:
      - 'renovate.json'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Inventory workflow files
        run: |
          test -f .github/workflows/scorecard.yml
          test -f .github/workflows/dependency-review.yml
          test -f .github/workflows/sbom-attestations.yml
          test -f .github/workflows/release-attestations.yml
          test -f .github/workflows/workflow-security.yml
          test -f .github/workflows/actions-security.yml
          test -f .github/workflows/ci-policy.yml
          test -f .github/workflows/ci-skip-guard.yml
          test -f .github/workflows/ci-core.yml
          test -f .github/workflows/ci-bindings.yml
          test -f .github/workflows/benchmark-smoke.yml
          test -f .github/workflows/docs.yml
          test -f .github/workflows/docs-quality.yml
          test -f .github/workflows/docs-link-check.yml
          test -f .github/workflows/package-dry-run.yml
          test -f .github/workflows/release.yml
      - name: Detect floating action refs
        run: |
          result=0
          git grep -nE 'uses:[[:space:]]+[^@[:space:]]+@(main|master|latest|HEAD)([^[:alnum:]_]|$)' -- .github/workflows || result=$?
          test "$result" -eq 1
      - name: Run zizmor
        id: audit
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          persona: auditor
          online-audits: false
          token: ""
      - name: Enforce workflow runner safeguards
        env:
          SARIF: ${{ steps.audit.outputs.output-file }}
        run: |
          jq -e '
            .version == "2.1.0" and
            (.runs | type == "array" and length > 0 and all(.[];
              .tool.driver.name == "zizmor" and
              (.results | type == "array" and all(.[];
                .level != "error" and .ruleId != "zizmor/artipacked"))))
          ' "$SARIF" > /dev/null
