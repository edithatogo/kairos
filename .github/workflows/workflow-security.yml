name: Workflow Security

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  pull_request:
    paths:
      - 'renovate.json'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - 'renovate.json'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Inventory workflow files
        run: |
          test -f .github/workflows/actions-security.yml
          test -f .github/workflows/agent-harness.yml
          test -f .github/workflows/bench-regression.yml
          test -f .github/workflows/benchmark-smoke.yml
          test -f .github/workflows/benchmarks.yml
          test -f .github/workflows/changelog-policy.yml
          test -f .github/workflows/ci-bindings.yml
          test -f .github/workflows/ci-core.yml
          test -f .github/workflows/ci-policy.yml
          test -f .github/workflows/archive-supply-chain-main.yml
          test -f .github/workflows/arrow-platform.yml
          test -f .github/workflows/ci-skip-guard.yml
          test -f .github/workflows/cloud-smoke.yml
          test -f .github/workflows/devbox-runtime.yml
          test -f .github/workflows/code-health.yml
          test -f .github/workflows/codeql.yml
          test -f .github/workflows/community-standards.yml
          test -f .github/workflows/conductor-assessment-reminder.yml
          test -f .github/workflows/conformance.yml
          test -f .github/workflows/dependency-review.yml
          test -f .github/workflows/docs-link-check.yml
          test -f .github/workflows/docs-quality.yml
          test -f .github/workflows/privacy-secrets.yml
          test -f .github/workflows/python-dependency-inventory.yml
          test -f .github/workflows/docs.yml
          test -f .github/workflows/fuzzing.yml
          test -f .github/workflows/gpu-free-smoke.yml
          test -f .github/workflows/grype.yml
          test -f .github/workflows/hpc-registry-publish.yml
          test -f .github/workflows/native-beta.yml
          test -f .github/workflows/nightly.yml
          test -f .github/workflows/package-dry-run.yml
          test -f .github/workflows/release-attestations.yml
          test -f .github/workflows/release-drafter.yml
          test -f .github/workflows/release-plz.yml
          test -f .github/workflows/release.yml
          test -f .github/workflows/registry-publish.yml
          test -f .github/workflows/sbom-attestations.yml
          test -f .github/workflows/scorecard.yml
          test -f .github/workflows/secret-scan.yml
          test -f .github/workflows/stale.yml
          test -f .github/workflows/syft-linux-qualification.yml
          test -f .github/workflows/toolchain-check.yml
          test -f .github/workflows/validate-conductor.yml
          test -f .github/workflows/workflow-security.yml
      - name: Detect floating action refs
        run: |
          result=0
          git grep -nE 'uses:[[:space:]]+[^@[:space:]]+@(main|master|latest|HEAD)([^[:alnum:]_]|$)' -- .github/workflows || result=$?
          test "$result" -eq 1
      - name: actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
  zizmor:
    name: zizmor
    permissions:
      contents: read
      security-events: write # Needed to upload zizmor SARIF results into code scanning.
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Inventory workflow files
        run: |
          test -f .github/workflows/actions-security.yml
          test -f .github/workflows/agent-harness.yml
          test -f .github/workflows/bench-regression.yml
          test -f .github/workflows/benchmark-smoke.yml
          test -f .github/workflows/benchmarks.yml
          test -f .github/workflows/changelog-policy.yml
          test -f .github/workflows/ci-bindings.yml
          test -f .github/workflows/ci-core.yml
          test -f .github/workflows/ci-policy.yml
          test -f .github/workflows/archive-supply-chain-main.yml
          test -f .github/workflows/ci-skip-guard.yml
          test -f .github/workflows/cloud-smoke.yml
          test -f .github/workflows/devbox-runtime.yml
          test -f .github/workflows/code-health.yml
          test -f .github/workflows/codeql.yml
          test -f .github/workflows/community-standards.yml
          test -f .github/workflows/conductor-assessment-reminder.yml
          test -f .github/workflows/conformance.yml
          test -f .github/workflows/dependency-review.yml
          test -f .github/workflows/docs-link-check.yml
          test -f .github/workflows/docs-quality.yml
          test -f .github/workflows/privacy-secrets.yml
          test -f .github/workflows/python-dependency-inventory.yml
          test -f .github/workflows/docs.yml
          test -f .github/workflows/fuzzing.yml
          test -f .github/workflows/gpu-free-smoke.yml
          test -f .github/workflows/grype.yml
          test -f .github/workflows/hpc-registry-publish.yml
          test -f .github/workflows/native-beta.yml
          test -f .github/workflows/nightly.yml
          test -f .github/workflows/package-dry-run.yml
          test -f .github/workflows/release-attestations.yml
          test -f .github/workflows/release-drafter.yml
          test -f .github/workflows/release-plz.yml
          test -f .github/workflows/release.yml
          test -f .github/workflows/registry-publish.yml
          test -f .github/workflows/sbom-attestations.yml
          test -f .github/workflows/scorecard.yml
          test -f .github/workflows/secret-scan.yml
          test -f .github/workflows/stale.yml
          test -f .github/workflows/syft-linux-qualification.yml
          test -f .github/workflows/toolchain-check.yml
          test -f .github/workflows/validate-conductor.yml
          test -f .github/workflows/workflow-security.yml
      - name: Install pinned zizmor
        uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
        with:
          tool: zizmor@1.32.0
          fallback: none
      - name: Audit workflows in a separate network namespace
        shell: bash
        run: |
          set -euo pipefail
          scanner="$(command -v zizmor)"
          host_namespace="$(readlink /proc/self/ns/net)"
          sudo --non-interactive /usr/bin/unshare --net -- /usr/bin/setpriv \
            --reuid "$(id -u)" --regid "$(id -g)" --clear-groups --no-new-privs \
            /usr/bin/env -i PATH=/usr/bin:/bin HOME="$RUNNER_TEMP" /bin/sh -eu -c '
              test "$(id -u)" -ne 0
              test "$(readlink /proc/self/ns/net)" != "$1"
              test "$(wc -l < /proc/net/dev)" -eq 3
              grep -q "^NoNewPrivs:[[:space:]]*1$" /proc/self/status
              printf "Running zizmor as uid %s in an isolated network namespace\n" "$(id -u)" >&2
              exec "$2" --offline --strict-collection --persona=pedantic --format=sarif -- .
            ' sh "$host_namespace" "$scanner" | tee "$RUNNER_TEMP/zizmor.sarif" > /dev/null
      - name: Upload zizmor SARIF
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: ${{ runner.temp }}/zizmor.sarif
          category: zizmor
