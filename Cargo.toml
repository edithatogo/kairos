[workspace]
resolver = "2"
members = [
  "crates/kairo-ecs-types",
  "crates/kairo-ecs-core",
  "crates/kairo-ecs-state",
  "crates/kairo-ecs-rng",
  "crates/kairo-ecs-des",
  "crates/kairo-ecs-abm",
  "crates/kairo-ecs-ffi",
  "crates/kairo-ecs-uniffi",
  "crates/kairo-ecs-diplomat",
  "crates/kairo-ecs-arrow",
  "crates/kairo-ecs-fs-guard",
  "crates/kairo-ecs-bench",
  "crates/kairo-ecs-cli",
  "crates/kairo-ecs-gpu",
  "crates/kairo-ecs-cuda",
  "crates/kairo-ecs-webgpu",
  "crates/kairo-ecs-pdes",
  "crates/kairo-ecs-mpi",
  "crates/kairo-ecs-grpc",
  "crates/kairo-ecs-streaming",
  "crates/kairo-ecs-ml",
  "crates/kairo-ecs-fmi",
  "crates/kairo-ecs-debug",
  "crates/kairo-ecs-viz",
  "crates/kairo-ecs-wasm",
  "crates/kairo-ecs-cs-bridge",
  "crates/kairo-ecs-game-ontology",
  "crates/kairo-ecs-game-theory",
]
exclude = [
  "crates/kairo-ecs-pyo3",
]

[workspace.package]
edition = "2021"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/edithatogo/kairos"
rust-version = "1.99"

[workspace.lints.rust]
unsafe_code = "forbid"

# Polars development source requires its immutable upstream hashbrown patch.
# Git consumers must retain this patch in their workspace root.
[patch.crates-io]
hashbrown = { git = "https://github.com/pola-rs/hashbrown", rev = "d76a6f81abd8f388676aff15068236a8d21c7e1a" }
