[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kairo-ecs"
version = "0.1.0"
description = "Python package surface for KairoECS"
readme = "README.md"
requires-python = ">=3.15.2,<3.16"
license = "Apache-2.0"
license-files = ["LICENSE-APACHE"]
authors = [{ name = "KairoECS Maintainers" }]
dependencies = []

[project.optional-dependencies]
arrow = ["pyarrow>=25.0.1"]
test = ["pytest", "ruff==0.17.3"]

[tool.setuptools]
packages = ["kairo_ecs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
