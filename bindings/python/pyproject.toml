[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kairo-ecs"
version = "0.1.0"
description = "Python package surface for KairoECS"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "KairoECS Maintainers" }]
dependencies = []

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
packages = ["kairo_ecs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
