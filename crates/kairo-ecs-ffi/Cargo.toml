[package]
name = "kairo-ecs-ffi"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "kairo_ecs_ffi"
path = "src/lib.rs"

[dependencies]
kairo-ecs-core = { path = "../kairo-ecs-core" }
kairo-ecs-state = { path = "../kairo-ecs-state" }
kairo-ecs-types = { path = "../kairo-ecs-types" }
kairo-ecs-rng = { path = "../kairo-ecs-rng" }

[features]
default = []
numa = ["kairo-ecs-core/numa", "kairo-ecs-state/numa"]
