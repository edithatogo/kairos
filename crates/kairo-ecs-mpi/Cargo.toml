[package]
name = "kairo-ecs-mpi"
version = "0.0.0"
edition = "2021"
license.workspace = true
repository = "https://github.com/edithatogo/kairos"
rust-version.workspace = true
[dependencies]
kairo-ecs-pdes = { path = "../kairo-ecs-pdes", version = "0.0.0", features = ["time-warp", "pdes"] }
kairo-ecs-types = { path = "../kairo-ecs-types", version = "0.0.0" }

mpi = { version = "0.8.2", optional = true, default-features = false }

[features]
default = []
mpi = []
native-mpi = ["dep:mpi"]
external-time-warp = ["native-mpi", "kairo-ecs-pdes/external-time-warp"]
external-fault-injection = ["external-time-warp", "kairo-ecs-pdes/external-fault-injection"]

[dev-dependencies]
kairo-ecs-grpc = { path = "../kairo-ecs-grpc", version = "0.0.0" }
ed25519-dalek = "3.0.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
path = "src/lib.rs"
