[package]
name = "kairo-ecs-gpu"
version = "0.1.0"
edition = "2021"
license.workspace = true
repository = "https://github.com/edithatogo/kairos"
rust-version.workspace = true
[features]
default = []
gpu = []
wgpu-backend = ["gpu", "dep:wgpu", "dep:pollster"]
cuda-backend = ["gpu", "dep:kairo-ecs-cuda"]
metal-backend = ["gpu", "wgpu-backend"]

[lints.rust]
unsafe_code = "allow"

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
kairo-ecs-cuda = { path = "../kairo-ecs-cuda", version = "0.1.0", optional = true }
pollster = { version = "1.0.1", optional = true }
wgpu = { version = "30.0.1", optional = true }
