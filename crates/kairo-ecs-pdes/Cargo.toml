[package]
name = "kairo-ecs-pdes"
version = "0.0.0"
edition = "2021"
license.workspace = true
repository = "https://github.com/edithatogo/kairos"
rust-version.workspace = true
[dependencies]
kairo-ecs-types = { path = "../kairo-ecs-types", version = "0.0.0" }

rusqlite = { version = "0.42.0", optional = true, default-features = false, features = ["bundled"] }
sha2 = { version = "0.11.1", optional = true, default-features = false }

serde = { version = "1.0.229", features = ["derive"], optional = true }
serde_json = { version = "1.0.154", optional = true }
ed25519-dalek = { version = "3.0.0", optional = true }

[features]
default = []
pdes = []
time-warp = []
external-fault-injection = ["external-time-warp"]
external-time-warp = ["time-warp", "dep:rusqlite", "dep:sha2", "dep:serde", "dep:serde_json", "dep:ed25519-dalek"]
external-store-qualification = ["time-warp", "dep:rusqlite", "dep:sha2"]

[lib]
path = "src/lib.rs"

[dev-dependencies]
serde_json = "1.0.154"
kairo-ecs-core = { path = "../kairo-ecs-core", version = "0.0.0" }

[[bench]]
name = "production"
harness = false
required-features = ["pdes"]

[[bench]]
name = "time_warp"
harness = false
required-features = ["pdes", "time-warp"]
