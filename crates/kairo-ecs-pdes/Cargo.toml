[package]
name = "kairo-ecs-pdes"
version = "0.0.0"
edition = "2021"
license.workspace = true
repository = "https://github.com/edithatogo/kairos"
rust-version = "1.76"

[dependencies]
kairo-ecs-types = { path = "../kairo-ecs-types" }

[features]
default = []
pdes = []
time-warp = []

[lib]
path = "src/lib.rs"

[dev-dependencies]
serde_json = "1.0.151"
kairo-ecs-core = { path = "../kairo-ecs-core" }

[[bench]]
name = "production"
harness = false
required-features = ["pdes"]

[[bench]]
name = "time_warp"
harness = false
required-features = ["pdes", "time-warp"]
