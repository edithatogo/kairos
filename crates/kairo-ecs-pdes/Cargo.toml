[package]
name = "kairo-ecs-pdes"
version = "0.0.0"
edition = "2021"
license.workspace = true
repository = "https://github.com/edithatogo/kairos"
rust-version.workspace = true
[dependencies]
kairo-ecs-types = { path = "../kairo-ecs-types", version = "0.0.0" }

rusqlite = { version = "0.41.1", optional = true, default-features = false, features = ["bundled"] }
sha2 = { version = "0.11.1", optional = true, default-features = false }

[features]
default = []
pdes = []
time-warp = []
external-store-qualification = ["time-warp", "dep:rusqlite", "dep:sha2"]

[lib]
path = "src/lib.rs"

[dev-dependencies]
serde_json = "1"
kairo-ecs-core = { path = "../kairo-ecs-core", version = "0.0.0" }

[[bench]]
name = "production"
harness = false
required-features = ["pdes"]

[[bench]]
name = "time_warp"
harness = false
required-features = ["pdes", "time-warp"]
