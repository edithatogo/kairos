[package]
name = "kairo-ecs-wasm"
version = "0.1.0"
edition = "2021"
license.workspace = true
repository = "https://github.com/edithatogo/kairos"
description = "WASM bindings for KairoECS"

[dependencies]
kairo-ecs-ffi = { path = "../kairo-ecs-ffi" }
wasm-bindgen = { version = "0.2", optional = true }

[features]
default = []
wasm-export = ["dep:wasm-bindgen"]

[lib]
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]
