[package]
name = "kairo-ecs-core"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Core deterministic ECS simulation kernel for KairoECS"

[dependencies]
kairo-ecs-types = { path = "../kairo-ecs-types", version = "0.0.0" }
quick-xml = { version = "0.42.0", default-features = false, optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }

[dev-dependencies]
kairo-ecs-types = { path = "../kairo-ecs-types", version = "0.0.0" }
kairo-ecs-rng = { path = "../kairo-ecs-rng", version = "0.0.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
tempfile = "3.27.0"

[features]
default = []
checkpoint-json = ["dep:serde", "dep:serde_json"]
numa = ["dep:quick-xml"]

[lib]
path = "src/lib.rs"
