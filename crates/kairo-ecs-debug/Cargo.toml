[package]
name = "kairo-ecs-debug"
version = "0.0.0"
edition = "2021"
license.workspace = true
repository = "https://github.com/edithatogo/kairos"
rust-version.workspace = true
[dependencies]
kairo-ecs-core = { path = "../kairo-ecs-core", version = "0.0.0" }
kairo-ecs-types = { path = "../kairo-ecs-types", version = "0.0.0" }
clap = { version = ">=4.5.0, <4.6.0", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[lib]
path = "src/lib.rs"

[[bin]]
name = "kairo-ecs-debug"
path = "src/main.rs"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "reconstruct"
harness = false
