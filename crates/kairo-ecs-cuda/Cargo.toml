[package]
name = "kairo-ecs-cuda"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints.rust]
unsafe_code = "allow"

[features]
default = []
cuda = ["dep:cudarc"]

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
cudarc = { version = "0.19.10", default-features = false, features = ["driver", "nvrtc", "cuda-version-from-build-system", "dynamic-loading"], optional = true }
