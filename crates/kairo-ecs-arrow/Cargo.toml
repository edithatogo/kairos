[package]
rust-version.workspace = true
name = "kairo-ecs-arrow"
version = "0.1.0"
edition = "2021"
license.workspace = true
repository = "https://github.com/edithatogo/kairos"
description = "Arrow telemetry and event log serialization for KairoECS"

[dependencies]
kairo-ecs-types = { path = "../kairo-ecs-types", version = "0.0.0" }

# Track 62 Phase 0: the official Arrow logical-type crate, admitted default-off
# behind `arrow-native`. Phase 0 only needs schema types; see the handoff for
# why arrow-array/arrow-ipc/parquet are deliberately NOT admitted yet.
arrow-schema = { version = "60.0.0", optional = true }

[features]
default = []
# Real from Phase 0: official arrow_schema::Schema parity for EVENT_LOG_FIELDS.
arrow-native = ["dep:arrow-schema"]
# Still a stub, as registered in #261. Admitting parquet pulls arrow-array,
# which transitively pulls tiny-keccak (CC0-1.0); that licence decision belongs
# to Track 29/20 and is deliberately not taken here.
parquet-native = []
parallel-io = []
hdf5 = ["parallel-io"]
adios2 = ["parallel-io"]

[[example]]
name = "telemetry_event_log_roundtrip"
path = "../../examples/telemetry/event_log_roundtrip.rs"
