[package]
rust-version.workspace = true
name = "kairo-ecs-arrow"
version = "0.1.0"
edition = "2021"
license.workspace = true
repository = "https://github.com/edithatogo/kairos"
description = "Arrow telemetry and event log serialization for KairoECS"

[dependencies]
kairo-ecs-types = { path = "../kairo-ecs-types", version = "0.0.0" }
sha2 = { version = "0.10.8", default-features = false }
tempfile = "3.17.1"

# Track 62 Phase 0: the official Arrow logical-type crate, admitted default-off
# behind `arrow-native`. Phase 0 only needs schema types; see the handoff for
# why arrow-array/arrow-ipc/parquet are deliberately NOT admitted yet.
arrow-schema = { version = "60.0.0", optional = true }

# Track 70 Phase 0: Polars tabular processing engine, admitted default-off
# behind `polars-native`.
polars = { version = "0.45", default-features = false, features = ["lazy", "parquet", "ipc", "ipc_streaming", "fmt", "dtype-u16"], optional = true }

# Track 70 Phase 2: same pinned polars-arrow version, named edge only for the
# Arrow C Data Interface FFI layer (`polars_arrow::ffi`). No new transitive
# dependencies: polars already pulls polars-arrow 0.45.1.
polars-arrow = { version = "0.45.1", default-features = false, optional = true }

# Track 70 Phase 3 Task 3.2: run-output manifest (de)serialization behind
# `serde-runtime` (wired into `polars-native`). serde_json 1.x is already a
# workspace dependency via kairo-ecs-core; serde derive is new to this crate
# only.
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
cap-primitives = { version = "4.0.3", optional = true }
cap-fs-ext = { version = "4.0.3", default-features = false, optional = true }
same-file = { version = "1.0.6", optional = true }
kairo-ecs-fs-guard = { path = "../kairo-ecs-fs-guard", version = "0.1.0", optional = true }

[features]
default = []
# Real from Phase 0: official arrow_schema::Schema parity for EVENT_LOG_FIELDS.
arrow-native = ["dep:arrow-schema"]
# Track 70 Phase 3 Task 3.2: serde/serde_json carry the run-output manifest
# (`kairo_ecs.run_manifest.v1`, a small JSON checkpoint-control document —
# spec keeps those Serde-owned). Already workspace dependencies elsewhere
# (kairo-ecs-core); no new transitive trees. Maintainer override of the
# Tracks 93/94/96 sequencing gate recorded in the track handoff.
serde-runtime = ["dep:serde", "dep:serde_json"]
polars-native = ["dep:polars", "dep:polars-arrow", "dep:cap-primitives", "dep:cap-fs-ext", "dep:same-file", "dep:kairo-ecs-fs-guard", "serde-runtime"]
# Still a stub, as registered in #261. Admitting parquet pulls arrow-array,
# which transitively pulls tiny-keccak (CC0-1.0); that licence decision belongs
# to Track 29/20 and is deliberately not taken here.
parquet-native = []
parallel-io = []
hdf5 = ["parallel-io"]
adios2 = ["parallel-io"]

[dev-dependencies]
# Track 70 Phase 3 Task 3.3: run-output publication benchmarks. Criterion is
# already a workspace dependency via kairo-ecs-bench (no new transitive tree);
# the bench target is polars-native-only so default builds never compile it.
criterion = "0.5"

[[example]]
name = "telemetry_event_log_roundtrip"
path = "examples/telemetry_event_log_roundtrip.rs"

[[bench]]
name = "run_output"
harness = false
required-features = ["polars-native"]
