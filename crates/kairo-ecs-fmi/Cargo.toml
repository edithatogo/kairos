[package]
name = "kairo-ecs-fmi"
version = "0.1.0"
edition = "2021"
license.workspace = true
repository = "https://github.com/edithatogo/kairos"
rust-version.workspace = true
[features]
default = []
fmi-runtime = ["dep:libloading"]
fmi2 = ["fmi-runtime"]
fmi3 = ["fmi-runtime"]
aas = []
digital-twin = ["fmi2"]

[lib]
name = "kairo_ecs_fmi"
path = "src/lib.rs"

[dependencies]
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
libloading = { version = "0.9.0", optional = true }
zip = { version = "9.1.0", default-features = false, features = ["deflate-flate2"] }

[dev-dependencies]
serde_json = "1"
criterion = "0.5"

[[bench]]
name = "twin_snapshot_diff"
harness = false
required-features = ["digital-twin"]
