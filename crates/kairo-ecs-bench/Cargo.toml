[package]
name = "kairo-ecs-bench"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "kairo_ecs_bench"
path = "src/lib.rs"

[features]
engine-checkpoint = ["kairo-ecs-arrow/engine-checkpoint", "kairo-ecs-des/checkpoint-json"]
hdf5 = ["engine-checkpoint", "kairo-ecs-arrow/hdf5"]
adios2 = ["engine-checkpoint", "kairo-ecs-arrow/adios2"]

[dependencies]
kairo-ecs-core = { path = "../kairo-ecs-core", version = "0.0.0" }
kairo-ecs-rng = { path = "../kairo-ecs-rng", version = "0.0.0" }
kairo-ecs-state = { path = "../kairo-ecs-state", version = "0.0.0" }
kairo-ecs-types = { path = "../kairo-ecs-types", version = "0.0.0" }

[dev-dependencies]
criterion = "0.8.2"
kairo-ecs-arrow = { path = "../kairo-ecs-arrow", version = "0.1.0" }
kairo-ecs-des = { path = "../kairo-ecs-des", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3.27.0"

[[bench]]
name = "scheduler"
harness = false

[[bench]]
name = "state"
harness = false

[[bench]]
name = "hybrid"
harness = false
