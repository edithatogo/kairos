[package]
name = "kairo-ecs-bench"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "kairo_ecs_bench"
path = "src/lib.rs"

[dependencies]
kairo-ecs-core = { path = "../kairo-ecs-core" }
kairo-ecs-rng = { path = "../kairo-ecs-rng" }
kairo-ecs-state = { path = "../kairo-ecs-state" }
kairo-ecs-types = { path = "../kairo-ecs-types" }

[dev-dependencies]
criterion = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bench]]
name = "scheduler"
harness = false

[[bench]]
name = "state"
harness = false

[[bench]]
name = "hybrid"
harness = false
