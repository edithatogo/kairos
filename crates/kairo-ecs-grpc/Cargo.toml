[package]
name = "kairo-ecs-grpc"
version = "0.0.0"
edition = "2021"
license.workspace = true
repository = "https://github.com/edithatogo/kairos"
rust-version.workspace = true
[dependencies]
kairo-ecs-pdes = { path = "../kairo-ecs-pdes", version = "0.0.0", features = ["time-warp", "pdes"] }
kairo-ecs-types = { path = "../kairo-ecs-types", version = "0.0.0" }
prost = { version = "0.13.5", default-features = false, features = ["std", "prost-derive"] }
tokio = { version = "1.54.1", default-features = false, features = ["rt", "net", "io-util", "sync", "macros", "time"] }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = []
grpc = []

[lib]
path = "src/lib.rs"
