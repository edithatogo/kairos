syntax = "proto3";

package kairo.ecs.simulation.v1;

// Runtime transport contract (placeholder): see track 35 migration/telemetry docs.
message RemoteEvent {
  uint32 source_lp = 1;
  uint32 dest_lp = 2;
  uint64 tick = 3;
  bytes event_payload = 4;
}

// Runtime transport contract placeholder for ownership transfer in one migration envelope.
message MigrationRequest {
  uint64 entity_index = 1;
  uint32 entity_generation = 2;
  uint32 source_lp = 3;
  uint32 dest_lp = 4;
  string migration_id = 5;
  repeated ComponentBlob components = 6;
  repeated PendingEvent pending_events = 7;
}

message ComponentBlob {
  string component_type_id = 1;
  uint64 generation = 2;
  bytes payload = 3;
}

message PendingEvent {
  uint32 source_lp = 1;
  uint32 dest_lp = 2;
  uint64 tick = 3;
  uint64 sequence = 4;
  uint64 payload_bytes = 5;
  bool anti_message = 6;
}

message MigrationAck {
  string migration_id = 1;
  bool applied = 2;
  string message = 3;
}

message TelemetryBatch {
  uint32 source_lp = 1;
  bytes arrow_ipc_payload = 2;
  uint64 tick_start = 3;
  uint64 tick_end = 4;
}

message GvtProposal {
  uint32 source_lp = 1;
  uint64 local_min_tick = 2;
}

message GvtDecision {
  uint64 gvt_tick = 1;
}

message AntiMessage {
  uint32 source_lp = 1;
  uint32 dest_lp = 2;
  uint64 tick = 3;
  uint64 sequence = 4;
}

message Heartbeat {
  uint32 source_lp = 1;
  uint64 observed_tick = 2;
  uint64 elapsed_since_last_seen_ms = 3;
}

message HeartbeatAck {
  uint32 source_lp = 1;
  bool accepted = 2;
  string message = 3;
}

message RetryPolicy {
  uint32 max_attempts = 1;
  uint64 base_delay_ms = 2;
  uint64 max_delay_ms = 3;
  bool retry_on_unavailable = 4;
}

// Runtime transport contract placeholder for service discovery: this is not wired to
// transport runtime in the current track slice.
service SimulationTransport {
  rpc ExchangeEvents(stream RemoteEvent) returns (stream RemoteEvent);
  rpc ExchangeAntiMessages(stream AntiMessage) returns (stream AntiMessage);
  rpc MigrateEntity(MigrationRequest) returns (MigrationAck);
  rpc StreamTelemetry(stream TelemetryBatch) returns (MigrationAck);
  rpc GvtSync(GvtProposal) returns (GvtDecision);
  rpc Heartbeat(Heartbeat) returns (HeartbeatAck);
}
